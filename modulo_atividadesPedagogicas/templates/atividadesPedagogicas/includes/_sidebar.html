
<!-- ══════════════════════════════════
     SIDEBAR ADMIN (SUPERUSER / ADMIN)
     ══════════════════════════════════ -->
{% if not user.is_superuser or user.is_staff %}
<aside class="rcs-admin-sidebar" aria-label="Painel administrativo">
  <div class="rcs-admin-sidebar__brand" aria-hidden="true">Admin</div>
  <nav class="rcs-admin-sidebar__nav">
    <a href="atividadePedagogica:inicio'" class="rcs-admin-sidebar__item" title="Painel de Controle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Todos os jogos</span>
    </a>
    <a href="{% url 'atividadePedagogica:jogo_create' %}" class="rcs-admin-sidebar__item" title="Gerenciar Atividades">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        <line x1="8" y1="7" x2="16" y2="7"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
      <span>Atividades</span>
    </a>
    <a href="/admin/auth/user/" class="rcs-admin-sidebar__item" title="Gerenciar Usuários">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Usuários</span>
    </a>
    <a href="/admin/atividadesPedagogicas/recurso/" class="rcs-admin-sidebar__item" title="Adicionar Novo Recurso">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      <span>Novo Recurso</span>
    </a>
  </nav>
  <div class="rcs-admin-sidebar__footer">
    <a href="/admin/logout/" class="rcs-admin-sidebar__item" title="Sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Sair</span>
    </a>
  </div>
</aside>
{% endif %}
