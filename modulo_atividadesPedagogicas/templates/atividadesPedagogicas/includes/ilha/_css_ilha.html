

<style>
/* ══════════════════════════════════════════
   RESET & BASE — TEMA ÁGUA CLARO
══════════════════════════════════════════ */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}
:root {
  /* Paleta água clara */
  --sky-50:   #f0f9ff;
  --sky-100:  #e0f2fe;
  --sky-200:  #bae6fd;
  --sky-300:  #7dd3fc;
  --sky-400:  #38bdf8;
  --sky-500:  #0ea5e9;
  --sky-600:  #0284c7;
  --cyan-400: #22d3ee;
  --cyan-500: #06b6d4;
  --teal-500: #14b8a6;
  --aqua-500: #00c2cb;
  --gold:     #f59e0b;
  --gold-glow:#fbbf24;
  --amber:    #f97316;
  --green:    #10b981;
  --purple:   #8b5cf6;
  --blue:     #2563eb;

  /* Tons de texto */
  --ink-900:  #0c2238;
  --ink-700:  #1e3a5f;
  --ink-500:  #475569;
  --ink-400:  #64748b;

  /* Vidro aquático claro */
  --glass:      rgba(255, 255, 255, 0.55);
  --glass-soft: rgba(255, 255, 255, 0.35);
  --glass-strong: rgba(255, 255, 255, 0.75);
  --glass-deep: rgba(224, 242, 254, 0.6);
  --border:     rgba(255, 255, 255, 0.65);
  --border-aqua:rgba(14, 165, 233, 0.35);
  --border-gold:rgba(245, 158, 11, 0.45);

  --radius-sm:  10px;
  --radius-md:  16px;
  --radius-lg:  24px;

  --shadow-soft: 0 8px 32px rgba(14, 116, 144, 0.12);
  --shadow-glow: 0 10px 40px rgba(56, 189, 248, 0.25);
  --shadow-gold: 0 8px 30px rgba(245, 158, 11, 0.3);

  --font-main:  'Inter', 'Segoe UI', sans-serif;
  --font-display:'Cinzel', serif;
  --transition: 0.28s cubic-bezier(.4,0,.2,1);
}

html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  font-family: var(--font-main);
  color: var(--ink-900);
  user-select: none; touch-action: none;
  /* Fundo céu-água com gradientes suaves */
  background:
    radial-gradient(ellipse at 20% 10%, #e0f7ff 0%, transparent 55%),
    radial-gradient(ellipse at 80% 90%, #ccfbf1 0%, transparent 55%),
    linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 45%, #cffafe 100%);
}

/* Ondas de água animadas no fundo */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 800px 200px at 30% 85%, rgba(56, 189, 248, 0.18), transparent 70%),
    radial-gradient(ellipse 600px 180px at 70% 70%, rgba(34, 211, 238, 0.15), transparent 70%),
    radial-gradient(ellipse 500px 150px at 50% 95%, rgba(20, 184, 166, 0.12), transparent 70%);
  animation: waterFloat 14s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(circle at 15% 25%, rgba(255,255,255,0.7) 1px, transparent 1.5px),
    radial-gradient(circle at 65% 15%, rgba(255,255,255,0.5) 1px, transparent 1.5px),
    radial-gradient(circle at 85% 55%, rgba(255,255,255,0.6) 1px, transparent 1.5px),
    radial-gradient(circle at 35% 75%, rgba(255,255,255,0.5) 1px, transparent 1.5px);
  background-size: 400px 400px, 300px 300px, 500px 500px, 350px 350px;
  opacity: 0.55;
  animation: sparkles 22s linear infinite;
}
@keyframes waterFloat {
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(-20px, 15px) scale(1.05); }
}
@keyframes sparkles {
  from { background-position: 0 0, 0 0, 0 0, 0 0; }
  to   { background-position: 400px 200px, -300px 150px, 500px -250px, -350px 175px; }
}

/* ══════════════════════════════════════════
   INTRO SCREEN
══════════════════════════════════════════ */
#intro-toggle { display: none; }

#intro-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(186, 230, 253, 0.9) 0%, transparent 60%),
    linear-gradient(180deg, #e0f7ff 0%, #bae6fd 40%, #a5f3fc 75%, #99f6e4 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 28px 18px;
  overflow-y: auto;
  transition: opacity 0.8s ease, transform 0.8s ease;
}
#intro-overlay::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle, rgba(255,255,255,0.9) 1.5px, transparent 2px) 10% 20% / 280px 280px,
    radial-gradient(circle, rgba(255,255,255,0.7) 1px, transparent 1.5px) 55% 60% / 200px 200px,
    radial-gradient(circle, rgba(255,255,255,0.5) 1px, transparent 1.5px) 80% 15% / 340px 340px;
  animation: starsShift 20s linear infinite alternate;
}
@keyframes starsShift {
  from { background-position: 10% 20%, 55% 60%, 80% 15%; }
  to   { background-position: 15% 25%, 60% 65%, 85% 20%; }
}

/* Ondas aquáticas no topo e base do intro */
#intro-overlay::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: 0; height: 180px; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 1200px 120px at 50% 100%, rgba(14, 165, 233, 0.35), transparent 70%),
    radial-gradient(ellipse 800px 80px at 30% 100%, rgba(34, 211, 238, 0.3), transparent 70%),
    radial-gradient(ellipse 900px 100px at 70% 100%, rgba(20, 184, 166, 0.25), transparent 70%);
  animation: waveMove 8s ease-in-out infinite alternate;
}
@keyframes waveMove {
  from { transform: translateX(-10px); }
  to   { transform: translateX(10px); }
}

#intro-toggle:checked ~ #intro-overlay {
  opacity: 0; pointer-events: none; transform: scale(1.04);
}

.intro-inner {
  position: relative; z-index: 1;
  max-width: 900px; width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}

/* Header institucional */
.intro-header {
  display: flex; align-items: center; gap: 22px;
  margin-bottom: 36px;
  background: var(--glass-strong);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 32px;
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  width: 100%;
  justify-content: center;
  flex-wrap: wrap;
  box-shadow: var(--shadow-soft);
}
.intro-logo-slot {
  width: 78px; height: 78px;
  border-radius: 16px;
  border: 2px dashed var(--border-aqua);
  background: rgba(255, 255, 255, 0.7);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  box-shadow: inset 0 0 12px rgba(14, 165, 233, 0.1);
}
.intro-logo-slot img { max-width: 90%; max-height: 90%; object-fit: contain; }
.intro-institution {
  display: flex; flex-direction: column; gap: 3px;
}
.intro-institution .city-name {
  font-family: var(--font-display);
  font-size: clamp(0.88rem, 2.5vw, 1.1rem);
  font-weight: 700; letter-spacing: 0.06em;
  color: var(--ink-700); text-transform: uppercase;
}
.intro-institution .sec-name {
  font-size: clamp(0.72rem, 2vw, 0.82rem);
  color: var(--ink-500);
  letter-spacing: 0.05em; text-transform: uppercase;
  font-weight: 500;
}
.intro-divider-v {
  width: 1px; height: 60px;
  background: linear-gradient(to bottom, transparent, rgba(14, 116, 144, 0.35), transparent);
}
.intro-brand {
  display: flex; flex-direction: column; gap: 3px;
}
.intro-brand .env-label {
  font-size: clamp(0.65rem, 1.8vw, 0.72rem);
  color: var(--sky-600); text-transform: uppercase;
  letter-spacing: 0.16em; font-weight: 700;
}
.intro-brand .env-name {
  font-family: var(--font-display);
  font-size: clamp(1.15rem, 3.5vw, 1.55rem);
  font-weight: 900; letter-spacing: 0.03em;
  background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 35%, #06b6d4 65%, #14b8a6 100%);
  background-size: 300% 100%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmerBrand 5s ease infinite;
}
@keyframes shimmerBrand {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Title block */
.intro-title-block { text-align: center; margin-bottom: 28px; }
.intro-eyebrow {
  font-size: clamp(0.7rem, 2vw, 0.8rem);
  letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--sky-600); font-weight: 700; margin-bottom: 14px;
  display: flex; align-items: center; justify-content: center; gap: 12px;
}
.intro-eyebrow::before, .intro-eyebrow::after {
  content: ''; display: block; width: 44px; height: 1px;
  background: linear-gradient(to right, transparent, var(--sky-500));
}
.intro-eyebrow::after { transform: scaleX(-1); }

.intro-headline {
  font-family: var(--font-display);
  font-size: clamp(2.1rem, 6vw, 3.8rem);
  font-weight: 900; line-height: 1.08; letter-spacing: -0.01em;
  background: linear-gradient(160deg, #0c2238 0%, #0284c7 40%, #06b6d4 70%, #14b8a6 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmerHeadline 6s ease infinite;
  margin-bottom: 12px;
  text-shadow: 0 4px 30px rgba(14, 165, 233, 0.15);
}
@keyframes shimmerHeadline {
  0%, 100% { background-position: 0% 0%; }
  50%       { background-position: 100% 100%; }
}
.intro-subtitle {
  font-size: clamp(0.82rem, 2.2vw, 0.98rem);
  color: var(--ink-500); letter-spacing: 0.06em;
  text-transform: uppercase; font-weight: 600;
}

/* Narrative text */
.intro-narrative {
  background: var(--glass-strong);
  border: 1px solid var(--border);
  border-left: 4px solid var(--sky-500);
  border-radius: var(--radius-md);
  padding: 30px 34px;
  margin-bottom: 32px;
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  line-height: 1.9;
  color: var(--ink-700);
  font-size: clamp(0.9rem, 2vw, 1rem);
  font-weight: 400;
  letter-spacing: 0.01em;
  max-height: 300px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--sky-400) transparent;
  box-shadow: var(--shadow-soft);
  position: relative;
}
.intro-narrative::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 60px;
  background: linear-gradient(180deg, rgba(255,255,255,0.6), transparent);
  pointer-events: none; border-radius: var(--radius-md) var(--radius-md) 0 0;
}
.intro-narrative::-webkit-scrollbar { width: 5px; }
.intro-narrative::-webkit-scrollbar-thumb { background: var(--sky-400); border-radius: 3px; }

.intro-narrative p { margin-bottom: 14px; position: relative; }
.intro-narrative p:last-child { margin-bottom: 0; }
.intro-narrative strong { color: var(--sky-700); font-weight: 700; }
.intro-narrative em { color: var(--cyan-500); font-style: italic; font-weight: 500; }

/* Features row */
.intro-features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
  margin-bottom: 34px;
  width: 100%;
}
.feat-card {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 14px;
  text-align: center;
  transition: var(--transition);
  cursor: default;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow-soft);
}
.feat-card:hover {
  background: var(--glass-strong);
  border-color: var(--sky-400);
  transform: translateY(-4px);
  box-shadow: var(--shadow-glow);
}
.feat-icon { font-size: 1.8rem; margin-bottom: 10px; display: block; }
.feat-text { font-size: 0.82rem; color: var(--ink-700); font-weight: 600; line-height: 1.35; }

/* CTA Button */
.intro-cta-label {
  display: inline-flex; align-items: center; gap: 12px;
  cursor: pointer;
  background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 50%, #14b8a6 100%);
  color: #ffffff;
  font-weight: 800; font-size: clamp(0.92rem, 2.5vw, 1.08rem);
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 18px 48px;
  border-radius: 50px;
  border: none;
  box-shadow: var(--shadow-glow), 0 4px 14px rgba(0,0,0,0.15);
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative; overflow: hidden;
}
.intro-cta-label::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.35), transparent 50%);
  opacity: 0; transition: opacity 0.25s;
}
.intro-cta-label:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 14px 44px rgba(14, 165, 233, 0.5), 0 6px 16px rgba(0,0,0,0.18);
}
.intro-cta-label:hover::before { opacity: 1; }
.intro-cta-label:active { transform: scale(0.98); }
.intro-cta-arrow { font-size: 1.2em; }

/* ══════════════════════════════════════════
   TOP BAR — tema água claro
══════════════════════════════════════════ */
#ui-container { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#ui-container > * { pointer-events: auto; }

#top-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 22px; height: 66px;
  background: var(--glass-strong);
  backdrop-filter: blur(22px) saturate(1.5);
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 24px rgba(14, 116, 144, 0.1);
}

.top-brand {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px 0 0;
  border-right: 1px solid rgba(14, 116, 144, 0.2);
  margin-right: 8px;
}
.top-logo-slot {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 1.5px dashed var(--border-aqua);
  background: rgba(255, 255, 255, 0.7);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}
.top-logo-slot img { max-width: 90%; max-height: 90%; object-fit: contain; }
.top-brand-text { display: flex; flex-direction: column; gap: 1px; line-height: 1.15; }
.top-brand-text .tb-city {
  font-size: 0.64rem; color: var(--ink-500);
  text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
}
.top-brand-text .tb-env {
  font-family: var(--font-display);
  font-size: 0.82rem; font-weight: 700; letter-spacing: 0.04em;
  background: linear-gradient(135deg, #0284c7, #06b6d4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

.top-left { display: flex; align-items: center; gap: 12px; }

.mode-toggle {
  display: flex; align-items: center; gap: 8px;
  background: var(--glass);
  border: 1px solid var(--border);
  padding: 8px 18px; border-radius: 50px;
  cursor: pointer; font-weight: 600; font-size: 0.84rem;
  color: var(--ink-700);
  letter-spacing: 0.02em;
  transition: var(--transition);
  font-family: var(--font-main);
  backdrop-filter: blur(10px);
}
.mode-toggle:hover { background: var(--glass-strong); border-color: var(--sky-400); color: var(--sky-700); }
.mode-toggle.edit-mode {
  background: rgba(245, 158, 11, 0.18);
  border-color: rgba(245, 158, 11, 0.5);
  color: var(--amber);
}

.resource {
  display: flex; align-items: center; gap: 7px;
  font-weight: 700; font-size: 0.9rem;
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(251, 191, 36, 0.15));
  padding: 8px 16px; border-radius: 50px;
  border: 1px solid var(--border-gold);
  color: #b45309;
  letter-spacing: 0.02em;
  backdrop-filter: blur(10px);
}

.top-right { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  background: var(--glass);
  border: 1px solid var(--border);
  color: var(--ink-700);
  width: 38px; height: 38px; border-radius: 50%;
  cursor: pointer; font-size: 0.95rem;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
  backdrop-filter: blur(10px);
}
.icon-btn:hover {
  background: var(--glass-strong);
  color: var(--sky-600);
  border-color: var(--sky-400);
  transform: scale(1.08);
}

/* ══════════════════════════════════════════
   SIDE MENU — aquático
══════════════════════════════════════════ */
#side-menu {
  position: absolute; top: 78px; left: 12px;
  width: 280px;
  max-height: calc(100vh - 100px);
  background: var(--glass-strong);
  backdrop-filter: blur(26px) saturate(1.6);
  -webkit-backdrop-filter: blur(26px) saturate(1.6);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  transform: translateX(calc(-100% - 14px));
  transition: transform 0.42s cubic-bezier(.4,0,.2,1);
  z-index: 50; overflow-y: auto;
  padding: 20px 18px;
  color: var(--ink-900);
  pointer-events: auto;
  scrollbar-width: thin; scrollbar-color: var(--sky-400) transparent;
  box-shadow: var(--shadow-soft);
}
#side-menu::-webkit-scrollbar { width: 5px; }
#side-menu::-webkit-scrollbar-thumb { background: var(--sky-400); border-radius: 3px; }
#side-menu.visible { transform: translateX(0); }

.menu-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; padding-bottom: 14px;
  border-bottom: 1px solid rgba(14, 116, 144, 0.2);
}
.menu-header h3 {
  margin: 0; font-size: 1.05rem;
  background: linear-gradient(135deg, #0284c7, #06b6d4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800; letter-spacing: 0.04em;
}
.close-menu {
  background: var(--glass); border: 1px solid var(--border);
  color: var(--ink-500); font-size: 1rem;
  cursor: pointer; pointer-events: auto; z-index: 51;
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.close-menu:hover {
  background: rgba(239, 68, 68, 0.12);
  color: #dc2626;
  border-color: rgba(239, 68, 68, 0.4);
}

.catalog-title {
  font-size: 0.7rem; text-transform: uppercase;
  color: var(--sky-600); font-weight: 700;
  margin: 18px 0 10px; letter-spacing: 0.14em;
  display: flex; align-items: center; gap: 6px;
}
.catalog-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to right, rgba(14, 165, 233, 0.4), transparent);
}

.catalog-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; margin-bottom: 5px;
  background: rgba(255, 255, 255, 0.5);
  border-radius: var(--radius-sm);
  cursor: pointer; font-size: 0.86rem;
  border: 1px solid transparent;
  transition: var(--transition);
  color: var(--ink-700);
  font-weight: 500;
}
.catalog-item:hover {
  background: rgba(186, 230, 253, 0.6);
  border-color: var(--sky-300);
  transform: translateX(3px);
  color: var(--sky-700);
}
.catalog-item.active {
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(6, 182, 212, 0.2));
  border-color: var(--sky-500);
  color: var(--sky-700);
  font-weight: 600;
}
.catalog-item span {
  font-size: 0.75rem; color: #b45309;
  font-weight: 700; background: rgba(245, 158, 11, 0.15);
  padding: 3px 9px; border-radius: 20px;
  border: 1px solid rgba(245, 158, 11, 0.3);
}

/* ══════════════════════════════════════════
   TOOLS PANEL
══════════════════════════════════════════ */
#tools-panel {
  position: absolute; top: 86px; right: 20px;
  width: 220px;
  background: var(--glass-strong);
  backdrop-filter: blur(26px) saturate(1.5);
  -webkit-backdrop-filter: blur(26px) saturate(1.5);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  color: var(--ink-900); padding: 18px;
  opacity: 0; pointer-events: none;
  transform: translateY(-8px) scale(0.97);
  transition: var(--transition);
  z-index: 40;
  box-shadow: var(--shadow-soft);
}
#tools-panel.visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

.panel-title {
  font-size: 0.9rem; font-weight: 700;
  margin-bottom: 14px; display: flex; justify-content: space-between;
  align-items: center; letter-spacing: 0.04em;
  color: var(--sky-700);
}
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }

/* ══════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════ */
.action-btn {
  padding: 11px 15px;
  background: var(--glass);
  border: 1px solid var(--border);
  color: var(--ink-700);
  border-radius: var(--radius-sm);
  cursor: pointer; font-size: 0.84rem;
  text-align: center; transition: var(--transition);
  font-family: var(--font-main); font-weight: 600;
  backdrop-filter: blur(10px);
}
.action-btn:hover {
  background: var(--glass-strong);
  color: var(--sky-700);
  border-color: var(--sky-400);
}
.action-btn.danger {
  border-color: rgba(239, 68, 68, 0.35);
  color: #dc2626;
  background: rgba(254, 226, 226, 0.5);
