<style>
/* ═══════════════════════════════════════════════════════════════════════════════
   DESIGN SYSTEM - INSPIRAÇÃO RETRO/PLATAFORMA
   Referências: Mario World, Kirby, Yoshi's Island, Animal Crossing
   ═══════════════════════════════════════════════════════════════════════════════ */

:root {
  --sky-top: #4FC3F7;
  --sky-bottom: #B3E5FC;
  --grass-primary: #7CB342;
  --grass-dark: #558B2F;
  --wood-primary: #8D6E63;
  --wood-dark: #5D4037;
  --stone-primary: #90A4AE;
  --accent-gold: #FFD54F;
  --accent-coral: #FF8A65;
  --accent-mint: #80CBC4;
  --accent-lavender: #B39DDB;
  --ui-bg: rgba(255, 255, 255, 0.92);
  --ui-bg-dark: rgba(30, 30, 40, 0.88);
  --ui-border: rgba(255, 255, 255, 0.3);
  --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.15);
  --shadow-strong: 0 8px 32px rgba(0, 0, 0, 0.25);
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: 'Nunito', 'Segoe UI', sans-serif;
  background: #000;
  user-select: none;
  touch-action: none;
  -webkit-font-smoothing: antialiased;
}

#ui-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 10;
}

.pointer-events-auto { pointer-events: auto; }

/* ═══════════════════════════════════════════════════════════════════════════════
   TOP BAR MINIMALISTA - APENAS INDICADORES ESSENCIAIS
   ═══════════════════════════════════════════════════════════════════════════════ */

#top-indicators {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  pointer-events: auto;
}

.indicator-pill {
  background: var(--ui-bg);
  backdrop-filter: blur(12px);
  border: 2px solid var(--ui-border);
  border-radius: 20px;
  padding: 8px 14px;
  font-weight: 700;
  font-size: 0.9em;
  color: #333;
  box-shadow: var(--shadow-soft);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.2s;
}

.indicator-pill:hover { transform: translateY(-2px); }

.crystal-pill { color: #F57C00; }
.time-pill { color: #1976D2; }

/* ═══════════════════════════════════════════════════════════════════════════════
   BOTÃO DE MODO - FLUTUANTE CANTO SUPERIOR ESQUERDO
   ═══════════════════════════════════════════════════════════════════════════════ */

#mode-button {
  position: absolute;
  top: 16px;
  left: 16px;
  background: var(--ui-bg);
  backdrop-filter: blur(12px);
  border: 2px solid var(--ui-border);
  border-radius: 20px;
  padding: 10px 16px;
  font-weight: 700;
  font-size: 0.9em;
  color: #333;
  cursor: pointer;
  box-shadow: var(--shadow-soft);
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
  transition: all 0.3s;
  z-index: 20;
}

#mode-button:hover { transform: translateY(-2px); box-shadow: var(--shadow-strong); }
#mode-button.edit-mode { background: #FFF3E0; color: #E65100; border-color: #FFB74D; }

/* ═══════════════════════════════════════════════════════════════════════════════
   DRAWER MENUS - LATERAIS RECOLHÍVEIS COM AUTO-HIDE
   ═══════════════════════════════════════════════════════════════════════════════ */

.drawer {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: var(--ui-bg);
  backdrop-filter: blur(16px);
  border: 2px solid var(--ui-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-strong);
  pointer-events: auto;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 30;
  overflow: hidden;
}

.drawer-left {
  left: 16px;
  width: 320px;
  max-height: 70vh;
  transform: translateY(-50%) translateX(-340px);
}

.drawer-left.open { transform: translateY(-50%) translateX(0); }

.drawer-right {
  right: 16px;
  width: 260px;
  max-height: 60vh;
  transform: translateY(-50%) translateX(280px);
}

.drawer-right.open { transform: translateY(-50%) translateX(0); }

.drawer-header {
  padding: 16px 20px;
  border-bottom: 2px solid rgba(0,0,0,0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, rgba(255,213,79,0.15), rgba(129,212,250,0.15));
}

.drawer-title {
  font-size: 1.1em;
  font-weight: 800;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
}

.drawer-close {
  background: rgba(0,0,0,0.08);
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.1em;
  color: #666;
  transition: all 0.2s;
}

.drawer-close:hover { background: rgba(0,0,0,0.15); color: #333; }

.drawer-content {
  padding: 12px;
  overflow-y: auto;
  max-height: calc(70vh - 60px);
}

.drawer-content::-webkit-scrollbar { width: 6px; }
.drawer-content::-webkit-scrollbar-track { background: transparent; }
.drawer-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }

/* ═══════════════════════════════════════════════════════════════════════════════
   CATÁLOGO - SEÇÕES ORGANIZADAS
   ═══════════════════════════════════════════════════════════════════════════════ */

.catalog-section {
  margin-bottom: 16px;
}

.catalog-section-title {
  font-size: 0.75em;
  text-transform: uppercase;
  font-weight: 800;
  color: #666;
  letter-spacing: 1px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.catalog-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.catalog-item {
  background: white;
  border: 2px solid rgba(0,0,0,0.08);
  border-radius: var(--radius-md);
  padding: 10px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  overflow: hidden;
}

.catalog-item::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-gold), var(--accent-coral));
  opacity: 0;
  transition: opacity 0.2s;
}

.catalog-item:hover {
  transform: translateY(-2px);
  border-color: var(--accent-gold);
  box-shadow: var(--shadow-soft);
}

.catalog-item:hover::before { opacity: 1; }

.catalog-item.active {
  background: #FFF8E1;
  border-color: var(--accent-gold);
  box-shadow: 0 0 0 3px rgba(255,213,79,0.3);
}

.catalog-item-icon {
  font-size: 1.8em;
  text-align: center;
}

.catalog-item-name {
  font-size: 0.8em;
  font-weight: 700;
  color: #333;
  text-align: center;
}

.catalog-item-cost {
  font-size: 0.7em;
  color: #F57C00;
  text-align: center;
  font-weight: 700;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   BOTTOM BAR - CONTROLES E MISSÕES
   ═══════════════════════════════════════════════════════════════════════════════ */

#bottom-bar {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  align-items: flex-end;
  pointer-events: auto;
  z-index: 25;
}

.bottom-panel {
  background: var(--ui-bg);
  backdrop-filter: blur(16px);
  border: 2px solid var(--ui-border);
  border-radius: var(--radius-xl);
  padding: 12px;
  box-shadow: var(--shadow-strong);
  display: flex;
  gap: 8px;
  align-items: center;
}

.camera-controls {
  display: flex;
  gap: 6px;
}

.cam-btn {
  background: white;
  border: 2px solid rgba(0,0,0,0.1);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.3em;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cam-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
.cam-btn.active { background: var(--accent-gold); border-color: #F57C00; }

.mission-btn {
  background: linear-gradient(135deg, var(--accent-lavender), var(--accent-mint));
  border: 2px solid rgba(255,255,255,0.5);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.3em;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.mission-btn:hover { transform: translateY(-2px) scale(1.05); }

.mission-btn::after {
  content: '';
  position: absolute;
  top: -4px;
  right: -4px;
  width: 12px;
  height: 12px;
  background: #FF5252;
  border-radius: 50%;
  border: 2px solid white;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: 0.8; }
}

/* ═══════════════════════════════════════════════════════════════════════════════
   FLOATING ACTION BUTTONS
   ═══════════════════════════════════════════════════════════════════════════════ */

.fab-container {
  position: absolute;
  bottom: 100px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: auto;
  z-index: 20;
}

.fab {
  background: var(--ui-bg);
  backdrop-filter: blur(12px);
  border: 2px solid var(--ui-border);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.3em;
  box-shadow: var(--shadow-soft);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fab:hover { transform: translateY(-2px) scale(1.05); box-shadow: var(--shadow-strong); }

/* ═══════════════════════════════════════════════════════════════════════════════
   TOGGLE BUTTONS (CATÁLOGO/FERRAMENTAS)
   ═══════════════════════════════════════════════════════════════════════════════ */

.toggle-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: var(--ui-bg);
  backdrop-filter: blur(12px);
  border: 2px solid var(--ui-border);
  width: 48px;
  height: 80px;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 1.5em;
  box-shadow: var(--shadow-soft);
  transition: all 0.3s;
  pointer-events: auto;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: center;
}

.toggle-btn:hover { transform: translateY(-50%) scale(1.05); }

.toggle-left { left: 16px; }
.toggle-left.shifted { left: 340px; }
.toggle-right { right: 16px; }
.toggle-right.shifted { right: 280px; }

/* ═══════════════════════════════════════════════════════════════════════════════
   INDICADORES E HINTS
   ═══════════════════════════════════════════════════════════════════════════════ */

#mode-indicator {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ui-bg-dark);
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.9em;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 35;
  backdrop-filter: blur(12px);
}

#mode-indicator.show { opacity: 1; }

#interaction-prompt {
  position: absolute;
  background: linear-gradient(135deg, #81C784, #4CAF50);
  color: white;
  padding: 12px 20px;
  border-radius: 25px;
  font-size: 0.95em;
  font-weight: 700;
  pointer-events: auto;
  z-index: 60;
  opacity: 0;
  transition: opacity 0.3s;
  cursor: pointer;
  transform: translateX(-50%);
  border: 2px solid white;
  box-shadow: var(--shadow-strong);
}

#interaction-prompt.show { opacity: 1; }

#riding-hint {
  position: absolute;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ui-bg-dark);
  color: var(--accent-gold);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 0.9em;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 30;
  backdrop-filter: blur(12px);
}

#riding-hint.show { opacity: 1; }

#avatar-hint {
  position: absolute;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ui-bg-dark);
  backdrop-filter: blur(12px);
  padding: 10px 18px;
  border-radius: 20px;
  color: white;
  font-size: 0.85em;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 30;
  border: 2px solid rgba(255,255,255,0.2);
}

#avatar-hint.show { opacity: 1; }

/* ═══════════════════════════════════════════════════════════════════════════════
   SPEECH BUBBLES - ESTILO CARTOON
   ═══════════════════════════════════════════════════════════════════════════════ */

#npc-speech-bubble {
  position: absolute;
  background: white;
  color: #333;
  padding: 12px 18px;
  border-radius: 20px;
  font-size: 0.95em;
  font-weight: 600;
  pointer-events: none;
  z-index: 100;
  box-shadow: var(--shadow-strong);
  max-width: 240px;
  text-align: center;
  opacity: 0;
  transition: opacity 0.3s, transform 0.2s;
  border: 3px solid var(--accent-mint);
  transform: translateX(-50%);
}

#npc-speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 12px solid white;
}

#npc-speech-bubble.show { opacity: 1; }

/* ═══════════════════════════════════════════════════════════════════════════════
   MODAIS - DESIGN CONSISTENTE
   ═══════════════════════════════════════════════════════════════════════════════ */

.modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  pointer-events: auto;
}

.modal-content {
  background: var(--ui-bg);
  border-radius: var(--radius-xl);
  padding: 28px;
  width: 420px;
  max-width: 90vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow-strong);
  border: 3px solid var(--ui-border);
}

.modal-content h2 {
  margin-top: 0;
  color: #333;
  font-size: 1.4em;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.dialogue-box {
  background: rgba(0,0,0,0.05);
  padding: 14px;
  border-radius: var(--radius-md);
  margin-bottom: 14px;
}

.dialogue-box label {
  display: block;
  font-size: 0.85em;
  color: #666;
  margin-bottom: 8px;
  font-weight: 700;
}

.dialogue-box textarea {
  width: 100%;
  background: white;
  border: 2px solid rgba(0,0,0,0.1);
  color: #333;
  padding: 10px;
  border-radius: var(--radius-sm);
  resize: vertical;
  min-height: 70px;
  box-sizing: border-box;
  font-family: inherit;
}

.minigame-option {
  display: block;
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  background: white;
  border: 2px solid rgba(0,0,0,0.08);
  border-radius: var(--radius-md);
  color: #333;
  text-align: left;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
}

.minigame-option:hover {
  background: #FFF8E1;
  border-color: var(--accent-gold);
  transform: translateX(4px);
}

.minigame-option.correct { background: #E8F5E9; border-color: #4CAF50; color: #2E7D32; }
.minigame-option.wrong { background: #FFEBEE; border-color: #F44336; color: #C62828; }

.bncc-tag {
  display: inline-block;
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-coral));
  color: white;
  font-size: 0.75em;
  padding: 4px 12px;
  border-radius: 12px;
  margin-bottom: 12px;
  font-weight: 700;
}

.action-btn {
  padding: 12px;
  background: white;
  border: 2px solid rgba(0,0,0,0.1);
  color: #333;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 0.95em;
  text-align: center;
  font-weight: 700;
  transition: all 0.2s;
}

.action-btn:hover { background: #F5F5F5; transform: translateY(-1px); }
.action-btn.primary { background: linear-gradient(135deg, var(--accent-gold), var(--accent-coral)); color: white; border: none; }
.action-btn.primary:hover { opacity: 0.9; }
.action-btn.danger { border-color: #EF5350; color: #C62828; }

/* ═══════════════════════════════════════════════════════════════════════════════
   MOBILE CONTROLS
   ═══════════════════════════════════════════════════════════════════════════════ */

#mobile-controls {
  position: absolute;
  bottom: 100px;
  left: 20px;
  display: none;
  z-index: 40;
  pointer-events: auto;
}

.joystick-container {
  width: 110px;
  height: 110px;
  background: rgba(255,255,255,0.3);
  backdrop-filter: blur(12px);
  border: 3px solid rgba(255,255,255,0.5);
  border-radius: 50%;
  position: relative;
}

.joystick-knob {
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-coral));
  border: 3px solid white;
  border-radius: 50%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  box-shadow: var(--shadow-soft);
}

#action-buttons {
  position: absolute;
  bottom: 100px;
  right: 20px;
  display: none;
  gap: 12px;
  z-index: 40;
  pointer-events: auto;
}

.action-btn-mobile {
  width: 64px;
  height: 64px;
  background: rgba(255,255,255,0.9);
  border: 3px solid white;
  border-radius: 50%;
  color: #333;
  font-size: 1.6em;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-soft);
}

@media (max-width: 768px) {
  #mobile-controls { display: block; }
  #action-buttons { display: flex; }
  .drawer-left { width: 280px; }
  .drawer-left.open { transform: translateY(-50%) translateX(0); }
}

/* ═══════════════════════════════════════════════════════════════════════════════
   CROSSHAIR & BLOCKER
   ═══════════════════════════════════════════════════════════════════════════════ */

#crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 12px;
  height: 12px;
  background: white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  display: none;
  pointer-events: none;
  border: 2px solid rgba(0,0,0,0.3);
  z-index: 50;
}

#blocker {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
  pointer-events: auto;
}

#instructions-fp {
  text-align: center;
  color: white;
  cursor: pointer;
  padding: 40px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: var(--radius-xl);
  background: var(--ui-bg-dark);
  backdrop-filter: blur(16px);
}

#instructions-fp h1 { font-size: 1.8em; margin-bottom: 12px; }

/* ═══════════════════════════════════════════════════════════════════════════════
   LABELS (PORTAIS E NPCs)
   ═══════════════════════════════════════════════════════════════════════════════ */

.portal-label, .npc-label {
  color: white;
  background: var(--ui-bg-dark);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 0.85em;
  font-weight: 700;
  pointer-events: none;
  border: 2px solid var(--accent-gold);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow-soft);
  white-space: nowrap;
}

.npc-label {
  border-color: var(--accent-mint);
  font-size: 0.8em;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   TELEPORT FLASH
   ═══════════════════════════════════════════════════════════════════════════════ */

#teleport-flash {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  transition: opacity 0.3s;
}

#teleport-flash.active { opacity: 0.8; }

/* ═══════════════════════════════════════════════════════════════════════════════
   MISSIONS PANEL
   ═══════════════════════════════════════════════════════════════════════════════ */

.missions-drawer {
  position: absolute;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ui-bg);
  backdrop-filter: blur(16px);
