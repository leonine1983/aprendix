<style>
/* ══════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════ */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}
:root {
  --gold:       #f5c842;
  --gold-glow:  #ffd700;
  --amber:      #ff9800;
  --amber-deep: #e65100;
  --teal:       #00bcd4;
  --green:      #4caf50;
  --blue:       #1565c0;
  --purple:     #7c4dff;
  --dark:       #f7f7f7;
  --dark2:      #0e1520;
  --dark3:      #141d2b;
  --glass:      rgba(14, 21, 32, 0.82);
  --glass-light:rgba(255,255,255,0.07);
  --border:     rgba(255,255,255,0.10);
  --border-gold:rgba(245,200,66,0.35);
  --radius-sm:  8px;
  --radius-md:  14px;
  --radius-lg:  22px;
  --shadow-glow:0 0 28px rgba(245,200,66,0.18);
  --font-main:  'Inter', 'Segoe UI', sans-serif;
  --font-display:'Cinzel', serif;
  --transition: 0.28s cubic-bezier(.4,0,.2,1);
}
body {
  margin: 0; overflow: hidden;
  font-family: var(--font-main);
  background: var(--dark); color: #e8eaf0;
  user-select: none; touch-action: none;
}

/* ══════════════════════════════════════════
   INTRO SCREEN (CSS-only, checkbox dismiss)
══════════════════════════════════════════ */
#intro-toggle { display: none; }

#intro-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: radial-gradient(ellipse at 60% 40%, #0a0f3c 0%, #040818 55%, #000 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px 16px;
  overflow-y: auto;
  transition: opacity 0.7s ease, transform 0.7s ease;
}
#intro-toggle:checked ~ #intro-overlay {
  opacity: 0; pointer-events: none; transform: scale(1.04);
}

/* Stars background */
#intro-overlay::before {
  content: '';
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 1px) 10% 20% / 250px 250px,
    radial-gradient(circle, rgba(255,255,255,0.6) 1px, transparent 1px) 50% 60% / 180px 180px,
    radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 1px) 80% 15% / 320px 320px,
    radial-gradient(circle, rgba(245,200,66,0.5) 1px, transparent 1px) 30% 80% / 200px 200px;
  animation: starsShift 18s linear infinite alternate;
}
@keyframes starsShift {
  from { background-position: 10% 20%, 50% 60%, 80% 15%, 30% 80%; }
  to   { background-position: 15% 25%, 55% 65%, 85% 20%, 35% 85%; }
}

/* Ambient glow blobs */
#intro-overlay::after {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 700px 400px at 20% 70%, rgba(124,77,255,0.15), transparent),
    radial-gradient(ellipse 600px 300px at 80% 30%, rgba(0,188,212,0.12), transparent),
    radial-gradient(ellipse 500px 500px at 50% 50%, rgba(245,200,66,0.06), transparent);
}

.intro-inner {
  position: relative; z-index: 1;
  max-width: 860px; width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}

/* Logo + institution header */
.intro-header {
  display: flex; align-items: center; gap: 20px;
  margin-bottom: 36px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-lg);
  padding: 16px 32px;
  backdrop-filter: blur(14px);
  width: 100%;
  justify-content: center;
  flex-wrap: wrap;
}
.intro-logo-slot {
  width: 72px; height: 72px;
  border-radius: 12px;
  border: 2px dashed rgba(245,200,66,0.5);
  background: rgba(245,200,66,0.05);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 28px;
  color: rgba(245,200,66,0.4);
}
.intro-institution {
  display: flex; flex-direction: column; gap: 2px;
}
.intro-institution .city-name {
  font-family: var(--font-display);
  font-size: clamp(0.85rem, 2.5vw, 1.05rem);
  font-weight: 700; letter-spacing: 0.08em;
  color: #d0d8e8; text-transform: uppercase;
}
.intro-institution .sec-name {
  font-size: clamp(0.72rem, 2vw, 0.82rem);
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.intro-divider-v {
  width: 1px; height: 56px;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2), transparent);
}
.intro-brand {
  display: flex; flex-direction: column; gap: 2px;
}
.intro-brand .env-label {
  font-size: clamp(0.65rem, 1.8vw, 0.72rem);
  color: var(--gold); text-transform: uppercase;
  letter-spacing: 0.14em; font-weight: 600;
}
.intro-brand .env-name {
  font-family: var(--font-display);
  font-size: clamp(1.1rem, 3.5vw, 1.5rem);
  font-weight: 900; letter-spacing: 0.04em;
  background: linear-gradient(135deg, #f5c842, #ff9800, #ffffff, #f5c842);
  background-size: 300% 100%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmerBrand 4s ease infinite;
}
@keyframes shimmerBrand {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Title block */
.intro-title-block { text-align: center; margin-bottom: 28px; }
.intro-eyebrow {
  font-size: clamp(0.7rem, 2vw, 0.8rem);
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--teal); font-weight: 600; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.intro-eyebrow::before, .intro-eyebrow::after {
  content: ''; display: block; width: 40px; height: 1px;
  background: linear-gradient(to right, transparent, var(--teal));
}
.intro-eyebrow::after { transform: scaleX(-1); }

.intro-headline {
  font-family: var(--font-display);
  font-size: clamp(2rem, 6vw, 3.6rem);
  font-weight: 900; line-height: 1.08; letter-spacing: -0.01em;
  background: linear-gradient(160deg, #ffffff 0%, #f5c842 45%, #ff9800 75%, #ffffff 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmerHeadline 5s ease infinite;
  margin-bottom: 10px;
}
@keyframes shimmerHeadline {
  0%, 100% { background-position: 0% 0%; }
  50%       { background-position: 100% 100%; }
}
.intro-subtitle {
  font-size: clamp(0.8rem, 2.2vw, 0.95rem);
  color: rgba(255,255,255,0.45); letter-spacing: 0.08em;
  text-transform: uppercase; font-weight: 500;
}

/* Narrative text */
.intro-narrative {
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.09);
  border-left: 3px solid var(--gold);
  border-radius: var(--radius-md);
  padding: 28px 32px;
  margin-bottom: 32px;
  backdrop-filter: blur(10px);
  line-height: 1.85;
  color: rgba(255,255,255,0.82);
  font-size: clamp(0.88rem, 2vw, 0.97rem);
  font-weight: 300;
  letter-spacing: 0.01em;
  max-height: 280px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(245,200,66,0.3) transparent;
}
.intro-narrative::-webkit-scrollbar { width: 4px; }
.intro-narrative::-webkit-scrollbar-thumb { background: rgba(245,200,66,0.3); border-radius: 2px; }

.intro-narrative p { margin-bottom: 14px; }
.intro-narrative p:last-child { margin-bottom: 0; }
.intro-narrative strong { color: var(--gold); font-weight: 600; }
.intro-narrative em { color: var(--teal); font-style: italic; }

/* Features row */
.intro-features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 32px;
  width: 100%;
}
.feat-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: var(--radius-md);
  padding: 16px 14px;
  text-align: center;
  transition: var(--transition);
  cursor: default;
}
.feat-card:hover {
  background: rgba(245,200,66,0.07);
  border-color: rgba(245,200,66,0.3);
  transform: translateY(-2px);
}
.feat-icon { font-size: 1.6rem; margin-bottom: 8px; display: block; }
.feat-text { font-size: 0.78rem; color: rgba(255,255,255,0.62); font-weight: 500; line-height: 1.3; }

/* CTA Button */
.intro-cta-label {
  display: inline-flex; align-items: center; gap: 12px;
  cursor: pointer;
  background: linear-gradient(135deg, #f5c842 0%, #ff9800 60%, #e65100 100%);
  color: #080c14;
  font-weight: 800; font-size: clamp(0.9rem, 2.5vw, 1.05rem);
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 16px 44px;
  border-radius: 50px;
  border: none;
  box-shadow: 0 6px 30px rgba(245,200,66,0.35), 0 2px 8px rgba(0,0,0,0.5);
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative; overflow: hidden;
}
.intro-cta-label::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
  opacity: 0; transition: opacity 0.2s;
}
.intro-cta-label:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 10px 40px rgba(245,200,66,0.5), 0 4px 12px rgba(0,0,0,0.5);
}
.intro-cta-label:hover::before { opacity: 1; }
.intro-cta-label:active { transform: scale(0.98); }
.intro-cta-arrow { font-size: 1.2em; }

/* ══════════════════════════════════════════
   TOP BAR — redesigned
══════════════════════════════════════════ */
#top-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 20px; height: 62px;
  background: rgba(8,12,20,0.92);
  backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid rgba(245,200,66,0.15);
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
}

/* Brand strip in top-bar */
.top-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px 0 0;
  border-right: 1px solid rgba(255,255,255,0.1);
  margin-right: 6px;
}
.top-logo-slot {
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 1.5px dashed rgba(245,200,66,0.45);
  background: rgba(245,200,66,0.05);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: rgba(245,200,66,0.35);
  flex-shrink: 0;
}
.top-brand-text { display: flex; flex-direction: column; gap: 0; line-height: 1.15; }
.top-brand-text .tb-city {
  font-size: 0.62rem; color: rgba(255,255,255,0.45);
  text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
}
.top-brand-text .tb-env {
  font-family: var(--font-display);
  font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em;
  color: var(--gold);
}

.top-left { display: flex; align-items: center; gap: 12px; }

.mode-toggle {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.14);
  padding: 7px 16px; border-radius: 50px;
  cursor: pointer; font-weight: 600; font-size: 0.82rem;
  color: rgba(255,255,255,0.8);
  letter-spacing: 0.02em;
  transition: var(--transition);
  font-family: var(--font-main);
}
.mode-toggle:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); }
.mode-toggle.edit-mode { background: rgba(255,152,0,0.2); border-color: rgba(255,152,0,0.5); color: var(--amber); }

.resource {
  display: flex; align-items: center; gap: 7px;
  font-weight: 700; font-size: 0.88rem;
  background: rgba(245,200,66,0.1);
  padding: 7px 14px; border-radius: 50px;
  border: 1px solid rgba(245,200,66,0.3);
  color: var(--gold-glow);
  letter-spacing: 0.02em;
}

.top-right { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.13);
  color: rgba(255,255,255,0.7);
  width: 36px; height: 36px; border-radius: 50%;
  cursor: pointer; font-size: 0.95rem;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.icon-btn:hover { background: rgba(255,255,255,0.15); color: white; border-color: rgba(255,255,255,0.3); transform: scale(1.08); }

/* ══════════════════════════════════════════
   SIDE MENU
══════════════════════════════════════════ */
#side-menu {
  position: absolute; top: 72px; left: 10px;
  width: 270px;
  max-height: calc(100vh - 90px);
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(1.5);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-lg);
  transform: translateX(calc(-100% - 12px));
  transition: transform 0.42s cubic-bezier(.4,0,.2,1);
  z-index: 50; overflow-y: auto;
  padding: 18px 16px;
  color: white;
  pointer-events: auto;
  scrollbar-width: thin; scrollbar-color: rgba(245,200,66,0.25) transparent;
  box-shadow: 4px 0 24px rgba(0,0,0,0.4), var(--shadow-glow);
}
#side-menu::-webkit-scrollbar { width: 4px; }
#side-menu::-webkit-scrollbar-thumb { background: rgba(245,200,66,0.25); border-radius: 2px; }
#side-menu.visible { transform: translateX(0); }

.menu-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid rgba(245,200,66,0.2);
}
.menu-header h3 {
  margin: 0; font-size: 1rem; color: var(--gold);
  font-weight: 700; letter-spacing: 0.04em;
}
.close-menu {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.6); font-size: 1rem;
  cursor: pointer; pointer-events: auto; z-index: 51;
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.close-menu:hover { background: rgba(255,100,100,0.2); color: #ff6b6b; border-color: rgba(255,100,100,0.4); }

.catalog-title {
  font-size: 0.68rem; text-transform: uppercase;
  color: var(--amber); font-weight: 700;
  margin: 16px 0 8px; letter-spacing: 0.12em;
  display: flex; align-items: center; gap: 6px;
}
.catalog-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to right, rgba(255,152,0,0.3), transparent);
}

.catalog-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 12px; margin-bottom: 4px;
  background: rgba(255,255,255,0.04);
  border-radius: var(--radius-sm);
  cursor: pointer; font-size: 0.85rem;
  border: 1px solid transparent;
  transition: var(--transition);
  color: rgba(255,255,255,0.8);
}
.catalog-item:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.15);
  transform: translateX(3px);
  color: white;
}
.catalog-item.active {
  background: rgba(255,152,0,0.18);
  border-color: rgba(255,152,0,0.5);
  color: var(--amber);
}
.catalog-item span {
  font-size: 0.75rem; color: var(--gold);
  font-weight: 600; background: rgba(245,200,66,0.1);
  padding: 2px 7px; border-radius: 20px;
}

/* ══════════════════════════════════════════
   TOOLS PANEL
══════════════════════════════════════════ */
#tools-panel {
  position: absolute; top: 80px; right: 18px;
  width: 210px;
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(1.5);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-gold);
  color: white; padding: 16px;
  opacity: 0; pointer-events: none;
  transform: translateY(-8px) scale(0.97);
  transition: var(--transition);
  z-index: 40;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
#tools-panel.visible { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

.panel-title {
  font-size: 0.85rem; color: var(--gold); font-weight: 700;
  margin-bottom: 14px; display: flex; justify-content: space-between;
  align-items: center; letter-spacing: 0.04em;
}
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }

/* ══════════════════════════════════════════
   BUTTONS (unified)
══════════════════════════════════════════ */
.action-btn {
  padding: 10px 14px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.8);
  border-radius: var(--radius-sm);
  cursor: pointer; font-size: 0.83rem;
  text-align: center; transition: var(--transition);
  font-family: var(--font-main); font-weight: 500;
}
.action-btn:hover { background: rgba(255,255,255,0.15); color: white; border-color: rgba(255,255,255,0.28); }
.action-btn.danger { border-color: rgba(255,100,100,0.35); color: #ff7b7b; }
.action-btn.danger:hover { background: rgba(255,100,100,0.15); border-color: rgba(255,100,100,0.6); }
.action-btn.primary {
  background: rgba(255,152,0,0.25); color: var(--amber);
  border-color: rgba(255,152,0,0.5); font-weight: 700;
}
.action-btn.primary:hover { background: rgba(255,152,0,0.4); border-color: var(--amber); }

/* ══════════════════════════════════════════
   CAMERA CONTROLS
══════════════════════════════════════════ */
#camera-controls {
  position: absolute; bottom: 28px; right: 24px;
  display: flex; flex-direction: column; gap: 8px; z-index: 30;
}
.cam-btn {
  background: rgba(8,12,20,0.75);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.16);
  color: rgba(255,255,255,0.7);
  padding: 10px; border-radius: 50%;
  cursor: pointer; font-size: 1.15rem;
  width: 46px; height: 46px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.cam-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); color: white; transform: scale(1.08); }
.cam-btn.active { background: rgba(76,175,80,0.3); border-color: rgba(76,175,80,0.7); color: var(--green); }

/* ══════════════════════════════════════════
   MODE INDICATOR
══════════════════════════════════════════ */
#mode-indicator {
  position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(8,12,20,0.88);
  backdrop-filter: blur(14px);
  padding: 10px 22px; border-radius: 50px;
  color: white; font-weight: 600; font-size: 0.82rem;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 35;
  border: 1px solid rgba(255,255,255,0.12); letter-spacing: 0.04em;
}
#mode-indicator.show { opacity: 1; }

/* ══════════════════════════════════════════
   TIME INDICATOR
══════════════════════════════════════════ */
#time-indicator {
  position: absolute; top: 80px; right: 24px;
  background: rgba(8,12,20,0.8);
  backdrop-filter: blur(14px);
  padding: 9px 18px; border-radius: 50px;
  color: rgba(255,255,255,0.75); font-size: 0.83rem; z-index: 30;
  border: 1px solid rgba(255,255,255,0.13);
  display: flex; align-items: center; gap: 7px;
  font-weight: 500;
}

/* ══════════════════════════════════════════
   MODALS
══════════════════════════════════════════ */
.modal-overlay {
  position: absolute; inset: 0;
  background: rgba(4,8,20,0.82);
  backdrop-filter: blur(16px);
  display: none; justify-content: center; align-items: center;
  z-index: 1000; padding: 16px;
}
.modal-content {
  background: var(--dark2);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-lg);
  padding: 32px 28px;
  width: 100%; max-width: 440px;
  color: white;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6), var(--shadow-glow);
}
.modal-content h2 {
  margin: 0 0 6px; color: var(--gold);
  font-size: 1.2rem; font-weight: 700; letter-spacing: 0.02em;
}

.dialogue-box {
  background: rgba(0,0,0,0.25); padding: 14px;
  border-radius: var(--radius-sm); margin-bottom: 14px;
  border: 1px solid rgba(255,255,255,0.07);
}
.dialogue-box label { display: block; font-size: 0.78rem; color: rgba(255,255,255,0.45); margin-bottom: 8px; font-weight: 500; }
.dialogue-box textarea {
  width: 100%; background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.85); padding: 10px; border-radius: var(--radius-sm);
  resize: vertical; min-height: 70px; box-sizing: border-box;
  font-family: var(--font-main); font-size: 0.85rem; transition: var(--transition);
}
.dialogue-box textarea:focus { outline: none; border-color: rgba(245,200,66,0.4); }

.minigame-option {
  display: block; width: 100%; padding: 13px 16px;
  margin-bottom: 9px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-sm); color: rgba(255,255,255,0.82);
  text-align: left; cursor: pointer; font-size: 0.9rem;
