const AssetManager = {
    cache: new Map(),
    
    loadTexture(url, fallbackColor = 0xff00ff) {
        if (this.cache.has(url)) {
            return Promise.resolve(this.cache.get(url));
        }
        
        return new Promise((resolve) => {
            const loader = new THREE.TextureLoader();
            loader.load(
                url,
                (texture) => {
                    texture.encoding = THREE.sRGBEncoding;
                    this.cache.set(url, texture);
                    console.log(`[AssetManager] ✅ Carregado: ${url}`);
                    resolve(texture);
                },
                undefined,
                (error) => {
                    console.warn(`[AssetManager] ⚠️ Falha ao carregar ${url}. Usando fallback.`);
                    const fallbackMat = new THREE.MeshStandardMaterial({
                        color: fallbackColor,
                        roughness: 0.7,
                        metalness: 0.2
                    });
                    resolve({ isFallback: true, material: fallbackMat });
                }
            );
        });
    },
    
    async loadMultiple(assetList) {
        const results = {};
        for (const [key, url] of Object.entries(assetList)) {
            results[key] = await this.loadTexture(url);
        }
        return results;
    }
};

// SPRITE ANIMATOR NATURAL (Fase 6 - Animação Fluida)
// ══════════════════════════════════════════════════════════════
class SpriteAnimator {
    constructor(texture, framesX, framesY) {
        this.texture = texture;
        this.framesX = framesX;
        this.framesY = framesY;
        this.totalFrames = framesX * framesY;
        
        // Criar material base
        this.material = new THREE.SpriteMaterial({
            map: texture,
            transparent: true,
            depthWrite: false
        });
        
        // Criar sprite
        this.sprite = new THREE.Sprite(this.material);
        
        // Calcular proporção de cada frame
        this.frameWidth = 1 / framesX;
        this.frameHeight = 1 / framesY;
        
        // Estado atual
        this.currentFrame = 0;
        this.currentAnimation = 'idle';
        this.animationSpeed = 1;
        this.elapsed = 0;
        this.isPlaying = true;
        
        // Definição das animações (sequências de frames)
        this.animations = {
            // Idle: Loop suave entre frames 0, 1, 2, 3 (linha 1)
            idle: {
                frames: [0, 1, 2, 3, 2, 1], // Ida e volta para movimento natural
                speed: 0.2, // Segundos por frame
                loop: true
            },
            // Talking: Frames da linha 2 (4-7) - gestos de conversa
            talking: {
                frames: [4, 5, 6, 7, 6, 5],
                speed: 0.15,
                loop: true
            },
            // Casting: Frames da linha 3 (8-11) - lançando magia
            casting: {
                frames: [8, 9, 10, 11, 10, 9],
                speed: 0.12,
                loop: false
            }
        };
        
        // Iniciar com idle
        this.play('idle');
    }
    
    play(animationName, resetFrame = true) {
        if (!this.animations[animationName]) {
            console.warn(`Animação '${animationName}' não existe!`);
            return;
        }
        
        this.currentAnimation = animationName;
        if (resetFrame) {
            this.currentFrame = 0;
            this.elapsed = 0;
        }
        this.isPlaying = true;
        this.updateUVs(this.animations[animationName].frames[0]);
    }
    
    stop() {
        this.isPlaying = false;
    }
    
    update(dt) {
        if (!this.isPlaying) return;
        
        const anim = this.animations[this.currentAnimation];
        if (!anim) return;
        
        this.elapsed += dt * this.animationSpeed;
        
        if (this.elapsed >= anim.speed) {
            this.elapsed = 0;
            this.currentFrame++;
            
            // Loop ou parar no último frame
            if (this.currentFrame >= anim.frames.length) {
                if (anim.loop) {
                    this.currentFrame = 0;
                } else {
                    this.currentFrame = anim.frames.length - 1;
                    this.isPlaying = false;
                }
            }
            
            // Atualizar UV para o frame atual
            const frameIndex = anim.frames[this.currentFrame];
            this.updateUVs(frameIndex);
        }
    }
    
    updateUVs(frameIndex) {
        const col = frameIndex % this.framesX;
        const row = Math.floor(frameIndex / this.framesX);
        
        // Resetar transformações UV
        this.texture.offset.set(0, 0);
        this.texture.repeat.set(1, 1);
        
        // Configurar para mostrar apenas o frame atual
        this.texture.offset.set(
            col * this.frameWidth,
            1 - (row + 1) * this.frameHeight
        );
        this.texture.repeat.set(this.frameWidth, this.frameHeight);
    }
    
    setScale(x, y) {
        this.sprite.scale.set(x, y, 1);
    }
    
    // Método para interpolação suave entre frames
    setBlendMode(blend) {
        this.material.blending = blend;
    }
}

function makeSky(){
  const geo = new THREE.SphereGeometry(1200,32,16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms:{ uTime:{value:0} },
    vertexShader:`varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform float uTime; varying vec3 vPos; void main(){ float y = normalize(vPos).y; vec3 zenith = vec3(0.18,0.45,0.88); vec3 horizon = vec3(0.62,0.84,1.0); vec3 ground  = vec3(0.72,0.88,0.95); vec3 col = mix(horizon, zenith, clamp(y,0.,1.)); col = mix(ground, col, clamp(y*2.+0.5,0.,1.)); gl_FragColor = vec4(col,1.0); }`
  });
  return new THREE.Mesh(geo,mat);
}

function makeCloudTexture(){
  const size=256; const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,size,size);
  function puff(x,y,r,a){ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(255,255,255,${a})`); g.addColorStop(1,'rgba(255,255,255,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
  puff(128,128,90,.9); puff(90,120,65,.8); puff(165,115,60,.75); puff(110,155,50,.7); puff(148,152,55,.7); puff(75,140,45,.6); puff(185,140,40,.55);
  const tex=new THREE.CanvasTexture(c); tex.encoding=THREE.sRGBEncoding; return tex;
}
const cloudTex = makeCloudTexture();

    { y: 40, count: 10, spread: 350, scale: [80, 160] },

  let idx = 0;
  layers.forEach(({ y, count, spread, scale }) => {
    for (let i = 0; i < count && idx < cloudCount; i++, idx++) {

// ── Island terrain (Com Raízes e Pedras Instanciadas) ───────
function buildIsland(){
  const group=new THREE.Group();
  const terrainGeo=new THREE.CylinderGeometry(80,55,28,64,8,false);
  const pos=terrainGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    const r=Math.sqrt(x*x+z*z);
    const n1=Math.sin(x*.08)*Math.cos(z*.08)*8;
    const n2=Math.sin(x*.18+1.5)*Math.sin(z*.15)*4;
    const n3=Math.sin(x*.35+z*.3)*2;
    const bump=(n1+n2+n3);
    if(y>0) pos.setY(i,y+bump*(1-r/90));
    if(y<0){ const s=0.7+Math.sin(i*.7)*.3; pos.setX(i,x*s); pos.setZ(i,z*s); pos.setY(i,y+Math.sin(i*.5)*3); }
  }
  pos.needsUpdate=true; terrainGeo.computeVertexNormals();
  const terrainMat=new THREE.MeshStandardMaterial({color:0x6ab04c,roughness:.9,metalness:.0});
  const terrain=new THREE.Mesh(terrainGeo,terrainMat); terrain.receiveShadow=true; terrain.castShadow=true;
  group.add(terrain);
  
  const rockGeo=new THREE.CylinderGeometry(50,30,35,48,5,false);
  const rockPos=rockGeo.attributes.position;
  for(let i=0;i<rockPos.count;i++){ rockPos.setX(i,rockPos.getX(i)+(Math.random()-.5)*6); rockPos.setZ(i,rockPos.getZ(i)+(Math.random()-.5)*6); }
  rockPos.needsUpdate=true; rockGeo.computeVertexNormals();
  const rockMat=new THREE.MeshStandardMaterial({color:0x8B7355,roughness:1,metalness:0});
  const rock=new THREE.Mesh(rockGeo,rockMat); rock.position.y=-20; rock.receiveShadow=true; group.add(rock);

  // Raízes Otimizadas (InstancedMesh)
  const rootCount = 35;
  const rootGeo = new THREE.CylinderGeometry(0.4, 0.8, 15, 6);
  const rootMat = new THREE.MeshStandardMaterial({color:0x5c4827,roughness:1});
  const rootMesh = new THREE.InstancedMesh(rootGeo, rootMat, rootCount);
  const dummy = new THREE.Object3D();
  for(let i=0; i<rootCount; i++){
    const a=Math.random()*Math.PI*2; const r=25+Math.random()*25;
    const h=8+Math.random()*30; const w=1.2+Math.random()*2;
    dummy.position.set(Math.cos(a)*r, -(28+h*.5)+Math.random()*5, Math.sin(a)*r);
    dummy.rotation.set((Math.random()-.5)*.4, Math.random()*Math.PI*2, (Math.random()-.5)*.4);
    dummy.scale.set(w*.3, h/15, w*.3);
    dummy.updateMatrix();
    rootMesh.setMatrixAt(i, dummy.matrix);
  }
  rootMesh.castShadow = true; rootMesh.receiveShadow = true;
  group.add(rootMesh);

  // Pedras/Detalhes Suspensos (InstancedMesh)
  const hangCount = 25;
  const hangGeo = new THREE.DodecahedronGeometry(1, 0);
  const hangMat = new THREE.MeshStandardMaterial({color:0x9c8860,roughness:.85});
  const hangMesh = new THREE.InstancedMesh(hangGeo, hangMat, hangCount);
  for(let i=0; i<hangCount; i++){
    const a=Math.random()*Math.PI*2; const r=30+Math.random()*30;
    const s=3+Math.random()*8;
    dummy.position.set(Math.cos(a)*r, -35-Math.random()*15, Math.sin(a)*r);
    dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    hangMesh.setMatrixAt(i, dummy.matrix);
  }
  hangMesh.castShadow = true;
  group.add(hangMesh);

  return group;
}

// FUNÇÃO DE ALTURA DO TERRENO (Replica EXATAMENTE a matemática da ilha)
// ══════════════════════════════════════════════════════════════
function getTerrainHeight(x, z) {
    const r = Math.sqrt(x * x + z * z);
    if (r > 80) return -100; // Fora da ilha principal
    
    // Mesmas fórmulas de ruído usadas em buildIsland()
    const n1 = Math.sin(x * 0.08) * Math.cos(z * 0.08) * 8;
    const n2 = Math.sin(x * 0.18 + 1.5) * Math.sin(z * 0.15) * 4;
    const n3 = Math.sin(x * 0.35 + z * 0.3) * 2;
    const bump = n1 + n2 + n3;
    
    // A altura base do topo do cilindro é 14. O bump é atenuado nas bordas.
    return 14 + bump * (1 - r / 90);
}

// Verifica se está sobre uma ponte
function isOnBridge(position, bridgeWidth = 4) {
    for (const bridge of bridges) {
        const dx = bridge.endX - bridge.startX;
        const dz = bridge.endZ - bridge.startZ;
        const lengthSquared = dx * dx + dz * dz;
        
        let t = ((position.x - bridge.startX) * dx + 
                 (position.z - bridge.startZ) * dz) / lengthSquared;
        
        if (t >= -0.1 && t <= 1.1) {
            const closestX = bridge.startX + t * dx;
            const closestZ = bridge.startZ + t * dz;
            
            const perpDist = Math.sqrt(
                Math.pow(position.x - closestX, 2) + 
                Math.pow(position.z - closestZ, 2)
            );
            
            if (perpDist <= bridgeWidth / 2 + 0.5) {
                return {
                    onBridge: true,
                    bridge: bridge,
                    progress: t,
                    height: bridge.startY + (bridge.endY - bridge.startY) * t
                };
            }
        }
    }
    return { onBridge: false };
}

// Verifica se está sobre uma ilha
function isOnIsland(position, islandData) {
    const dx = position.x - islandData.x;
    const dz = position.z - islandData.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    return dist <= islandData.radius - 2;
}

// Obtém altura válida (ilha ou ponte)
function getValidHeight(position) {
    const bridgeCheck = isOnBridge(position);
    if (bridgeCheck.onBridge) {
        return bridgeCheck.height;
    }
    
    for (const island of islandsData) {
        if (isOnIsland(position, island)) {
            return island.height;
        }
    }
    
    return null;
}

// Valida movimento antes de aplicar
function validateMovement(newPosition) {
    const validHeight = getValidHeight({ 
        x: newPosition.x, 
        z: newPosition.z 
    });
    
    if (validHeight === null) {
        return { valid: false, reason: 'fora_das_areas' };
    }
    
    const currentValidHeight = getValidHeight({ 
        x: avatar.position.x, 
        z: avatar.position.z 
    });
    
    if (currentValidHeight !== null) {
        const heightDiff = Math.abs(validHeight - currentValidHeight);
        if (heightDiff > 3 && !isJumping) {
            return { valid: false, reason: 'desnivel_excessivo' };
        }
    }
    
    return { valid: true, height: validHeight };
}

// Cria ponte corrigida (conecta bordas das ilhas)
// ══════════════════════════════════════════════════════════════
// FUNÇÃO AUXILIAR: Calcula a altura REAL da superfície de uma ilha
// ══════════════════════════════════════════════════════════════
function getIslandSurfaceY(islandData) {
    // Ilha principal usa a função de terreno com ruído
    if (islandData.radius >= 70) {
        return getTerrainHeight(islandData.x, islandData.z);
    }
    // Mini ilhas: cilindro com altura = radius * 0.6
    // O topo fica em: centroY + (altura/2) = height + radius*0.3
    return islandData.height + (islandData.radius * 0.3);
}

// ══════════════════════════════════════════════════════════════
// PONTE CORRIGIDA: Vetores, Rotação e Distribuição por Lerp
// ══════════════════════════════════════════════════════════════
function createProperBridge(startIsland, endIsland) {
    const bridgeGroup = new THREE.Group();

    // ── 1. CÁLCULO DOS VETORES DE ORIGEM E DESTINO ─────────────
    // Direção horizontal entre os centros das ilhas
    const dx = endIsland.x - startIsland.x;
    const dz = endIsland.z - startIsland.z;
    const horizontalDist = Math.sqrt(dx * dx + dz * dz);
    const angle = Math.atan2(dz, dx); // Rotação Y (plano XZ)

    // Altura REAL da superfície (topo da grama) de cada ilha
    const startSurfaceY = getIslandSurfaceY(startIsland);
    const endSurfaceY   = getIslandSurfaceY(endIsland);

    // Margem de segurança: a ponte começa/termina um pouco antes da borda
    // para não ficar "flutuando no ar" na extremidade
    const startMargin = 3;
    const endMargin   = 3;

    // Ponto de INÍCIO: borda da superfície da Ilha A
    const startPos = new THREE.Vector3(
        startIsland.x + Math.cos(angle) * ((startIsland.radius || 75) - startMargin),
        startSurfaceY,
        startIsland.z + Math.sin(angle) * ((startIsland.radius || 75) - startMargin)
    );

    // Ponto de FIM: borda da superfície da Ilha B
    const endPos = new THREE.Vector3(
        endIsland.x - Math.cos(angle) * ((endIsland.radius || 18) - endMargin),
        endSurfaceY,
        endIsland.z - Math.sin(angle) * ((endIsland.radius || 18) - endMargin)
    );

    // ── 2. CÁLCULO DA INCLINAÇÃO (SLOPE) ──────────────────────
    const dy = endPos.y - startPos.y;
    // Ângulo de inclinação no eixo X local da ponte
    // atan2(dy, dist_horizontal) dá a rampa correta
    const slopeAngle = Math.atan2(dy, horizontalDist);

    // ── 3. MATERIAIS ──────────────────────────────────────────
    const woodMat  = new THREE.MeshStandardMaterial({ color: 0x8B6914, roughness: 0.9, metalness: 0.1 });
    const ropeMat  = new THREE.MeshStandardMaterial({ color: 0xD2B48C, roughness: 1.0 });
    const postMat  = new THREE.MeshStandardMaterial({ color: 0x654321, roughness: 0.95 });

    // ── 4. DISTRIBUIÇÃO DAS TÁBUAS VIA VECTOR3.LERP ───────────
    const plankWidth  = 3.5;
    const plankLength = 2.2;
    const plankCount  = Math.ceil(horizontalDist / 2);

    for (let i = 0; i < plankCount; i++) {
        // Interpolação linear: t vai de 0 (início) a 1 (fim)
        const t = i / Math.max(1, plankCount - 1);
        const pos = new THREE.Vector3().lerpVectors(startPos, endPos, t);

        const plank = new THREE.Mesh(
            new THREE.BoxGeometry(plankLength, 0.15, plankWidth),
            woodMat
        );

        // Posição interpolada ao longo da rampa
        plank.position.copy(pos);

        // Rotação Y: alinha a tábua com a direção da ponte
        plank.rotation.y = angle;

        // Rotação X: INCLINA a tábua para seguir a rampa
        // (isso é o que faltava no código original!)
        plank.rotation.x = -slopeAngle;

        plank.castShadow    = true;
        plank.receiveShadow = true;
        bridgeGroup.add(plank);
    }

    // ── 5. POSTES E CORDAS (também interpolados) ──────────────
    const postSpacing = 10;
    const postCount   = Math.floor(horizontalDist / postSpacing);
    const postGeo     = new THREE.CylinderGeometry(0.3, 0.3, 3, 6);

    for (let i = 0; i <= postCount; i++) {
        const t = i / Math.max(1, postCount);
        const pos = new THREE.Vector3().lerpVectors(startPos, endPos, t);

        // Vetor perpendicular à direção da ponte (para posicionar postes nas laterais)
        const perpX = -Math.sin(angle);
        const perpZ =  Math.cos(angle);
        const lateralOffset = 2.2;

        // Poste esquerdo
        const postLeft = new THREE.Mesh(postGeo, postMat);
        postLeft.position.set(
            pos.x + perpX * lateralOffset,
            pos.y + 1.5,
            pos.z + perpZ * lateralOffset
        );
        postLeft.castShadow = true;
        bridgeGroup.add(postLeft);

        // Poste direito
        const postRight = new THREE.Mesh(postGeo, postMat);
        postRight.position.set(
            pos.x - perpX * lateralOffset,
            pos.y + 1.5,
            pos.z - perpZ * lateralOffset
        );
        postRight.castShadow = true;
        bridgeGroup.add(postRight);
    }

    scene.add(bridgeGroup);

    // ── 6. REGISTRO PARA COLISÃO E TRAVESSIA ──────────────────
    bridges.push({
        group: bridgeGroup,
        startX: startPos.x, startZ: startPos.z, startY: startPos.y,
        endX:   endPos.x,   endZ:   endPos.z,   endY:   endPos.y,
        angle: angle,
        length: horizontalDist,
        width: plankWidth,
        startIsland: startIsland,
        endIsland: endIsland
    });

    return bridgeGroup;
}

// ══════════════════════════════════════════════════════════════
// VERSÃO ALTERNATIVA: Ponte com CatmullRomCurve3 (curva suave)
// Use esta se quiser uma ponte arqueada em vez de reta
// ══════════════════════════════════════════════════════════════
function createCurvedBridge(startIsland, endIsland, arcHeight = 4) {
    const startSurfaceY = getIslandSurfaceY(startIsland);
    const endSurfaceY   = getIslandSurfaceY(endIsland);

    const dx = endIsland.x - startIsland.x;
    const dz = endIsland.z - startIsland.z;
    const angle = Math.atan2(dz, dx);

    const startMargin = 3;
    const endMargin   = 3;

    const startPos = new THREE.Vector3(
        startIsland.x + Math.cos(angle) * ((startIsland.radius || 75) - startMargin),
        startSurfaceY,
        startIsland.z + Math.sin(angle) * ((startIsland.radius || 75) - startMargin)
    );

    const endPos = new THREE.Vector3(
        endIsland.x - Math.cos(angle) * ((endIsland.radius || 18) - endMargin),
        endSurfaceY,
        endIsland.z - Math.sin(angle) * ((endIsland.radius || 18) - endMargin)
    );

    // Ponto de controle no meio, elevado para criar o arco
    const midPoint = new THREE.Vector3().lerpVectors(startPos, endPos, 0.5);
    midPoint.y += arcHeight; // Eleva o centro da ponte

    // CatmullRomCurve3 cria uma curva suave passando pelos pontos
    const curve = new THREE.CatmullRomCurve3([
        startPos,
        midPoint,
        endPos
    ]);

    const bridgeGroup = new THREE.Group();
    const plankCount  = 40;
    const woodMat     = new THREE.MeshStandardMaterial({ color: 0x8B6914, roughness: 0.9 });

    for (let i = 0; i < plankCount; i++) {
        const t = i / (plankCount - 1);

        // Ponto na curva
        const pos = curve.getPoint(t);

        // Tangente da curva (direção local da ponte neste ponto)
        const tangent = curve.getTangent(t);

        const plank = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 0.15, 3.5),
            woodMat
        );

        plank.position.copy(pos);

        // Usa lookAt para alinhar a tábua com a tangente da curva
        // Criamos um ponto à frente na direção da tangente
        const lookTarget = pos.clone().add(tangent);
        plank.lookAt(lookTarget);

        plank.castShadow = true;
        bridgeGroup.add(plank);
    }

    scene.add(bridgeGroup);
    return bridgeGroup;
}

function buildOptimizedEnvironment() {
    const group = new THREE.Group();
    const dummy = new THREE.Object3D();
    const color = new THREE.Color();

    // 1. ÁRVORES
    const treePositions = [
        [10,15],[28,-8],[-25,18],[-15,-30],[35,30],[-40,-15],[5,-45],[40,-35],
        [-30,40],[20,40],[-50,10],[50,-20],[15,-20],[-10,-15],[32,12],
        [60,10],[-60,-10],[70,-40],[-70,50],[0,60],[0,-60],[45,45],[-45,-45]
    ];
    const treeCount = treePositions.length;
    
    const trunkGeo = new THREE.CylinderGeometry(0.4, 0.5, 3, 6);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.9 });
    const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
    
    const leavesGeo = new THREE.ConeGeometry(2.5, 6, 7);
    const leavesMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
    const leavesMesh = new THREE.InstancedMesh(leavesGeo, leavesMat, treeCount);
    
    treePositions.forEach(([x, z], i) => {
        const scale = 0.8 + Math.random() * 0.6;
        const rot = Math.random() * Math.PI * 2;
        
        // ✅ CORREÇÃO: Calcula a altura real do terreno neste ponto (X, Z)
        const terrainY = getTerrainHeight(x, z);
        
        // Tronco: base apoiada exatamente no terreno
        dummy.position.set(x, terrainY + (1.5 * scale), z);
        dummy.rotation.set(0, rot, 0);
        dummy.scale.set(scale, scale, scale);
        dummy.updateMatrix();
        trunkMesh.setMatrixAt(i, dummy.matrix);
        
        // Folhas: acima do tronco
        dummy.position.set(x, terrainY + (4.5 * scale), z);
        dummy.updateMatrix();
        leavesMesh.setMatrixAt(i, dummy.matrix);
        
        color.setHSL(0.28 + Math.random() * 0.08, 0.6 + Math.random() * 0.3, 0.3 + Math.random() * 0.2);
        leavesMesh.setColorAt(i, color);
    });
    trunkMesh.castShadow = true; trunkMesh.receiveShadow = true;
    leavesMesh.castShadow = true; leavesMesh.receiveShadow = true;
    group.add(trunkMesh);
    group.add(leavesMesh);

    // 2. FLORES
    const flowerCount = 150;
    const flowerGeo = new THREE.SphereGeometry(0.25, 6, 6);
    const flowerMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
    const flowerMesh = new THREE.InstancedMesh(flowerGeo, flowerMat, flowerCount);
    const flowerColors = [0xff6b8a, 0xffcc44, 0xff8c42, 0xff4dd8, 0x9b59ff, 0x44ddff];
    
    for (let i = 0; i < flowerCount; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 12 + Math.random() * 50;
        const fx = Math.cos(a) * r;
        const fz = Math.sin(a) * r;
        
        // ✅ CORREÇÃO: Calcula a altura real do terreno
        const terrainY = getTerrainHeight(fx, fz);
        
        dummy.position.set(fx, terrainY + 0.4, fz);
        const fs = 0.8 + Math.random() * 0.6;
        dummy.scale.set(fs, fs, fs);
        dummy.updateMatrix();
        flowerMesh.setMatrixAt(i, dummy.matrix);
        color.setHex(flowerColors[Math.floor(Math.random() * flowerColors.length)]);
        flowerMesh.setColorAt(i, color);
    }
    flowerMesh.receiveShadow = true;
    group.add(flowerMesh);

    // 3. CAMINHOS (Conectando o centro às trilhas)
    const pathCount = 60;
    const pathGeo = new THREE.PlaneGeometry(3.5, 3.5);
    const pathMat = new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 1, metalness: 0 });
    const pathMesh = new THREE.InstancedMesh(pathGeo, pathMat, pathCount);
    
    const trailTargets = [
        { x: 160, z: 80 }, { x: -150, z: 120 }, { x: 200, z: -100 }, { x: -180, z: -130 }
    ];
    
    let pIdx = 0;
    trailTargets.forEach(target => {
        for (let i = 1; i <= 15 && pIdx < pathCount; i++, pIdx++) {
            const progress = i / 15;
            const px = target.x * progress * 0.25; 
            const pz = target.z * progress * 0.25;
            
            // ✅ CORREÇÃO: Calcula a altura real do terreno + pequeno offset
            const terrainY = getTerrainHeight(px, pz);
            
            dummy.position.set(px, terrainY + 0.05, pz);
            dummy.rotation.x = -Math.PI / 2;
            dummy.rotation.z = Math.atan2(target.z, target.x) + (Math.random() - 0.5) * 0.8;
            dummy.scale.set(1 + Math.random() * 0.4, 1 + Math.random() * 0.4, 1);
            dummy.updateMatrix();
            pathMesh.setMatrixAt(pIdx, dummy.matrix);
        }
    });
    pathMesh.receiveShadow = true;
    group.add(pathMesh);

    scene.add(group);
    return { trunkMesh, leavesMesh, flowerMesh, pathMesh };
}

function makeMiniIsland(x,y,z,r){
  const g=new THREE.Group();
  const geo=new THREE.CylinderGeometry(r,r*.7,r*.6,16,3); const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){ if(pos.getY(i)>0){ pos.setY(i,pos.getY(i)+Math.sin(pos.getX(i)*.3)*2); } }
  pos.needsUpdate=true; geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x5a9e38,roughness:.9})));
  const rg=new THREE.CylinderGeometry(r*.65,r*.4,r*.5,12); const rm=new THREE.Mesh(rg,new THREE.MeshStandardMaterial({color:0x8B7355,roughness:1}));
  rm.position.y=-(r*.55); g.add(rm);
  g.position.set(x,y,z); return g;
}
function buildParticles(){
  const count=800; const geo=new THREE.BufferGeometry(); const positions=new Float32Array(count*3); const colors=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2; const r=20+Math.random()*120;
    positions[i*3]=Math.cos(a)*r; positions[i*3+1]=-20+Math.random()*80; positions[i*3+2]=Math.sin(a)*r;
    const h=.5+Math.random()*.4; const rv=h, gv=.7, bv=.9;

  }
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  const mat=new THREE.PointsMaterial({size:.8,vertexColors:true,transparent:true,opacity:.75,sizeAttenuation:true});
  return new THREE.Points(geo,mat);
}

function updateCamera(){

    if (isFirstPerson && !renderer.xr.isPresenting) {

    // --- Lógica Original da 3ª Pessoa ---
    // No modo VR, o WebXR controla a câmera automaticamente, então ignoramos a lógica abaixo
    if (!renderer.xr.isPresenting) {
        camState.smoothTarget.lerp(avatar.position.clone().add(new THREE.Vector3(0,2,0)),.1);
        const x=camState.smoothTarget.x+camState.distance*Math.sin(camState.phi)*Math.sin(camState.theta);
        const y=camState.smoothTarget.y+camState.distance*Math.cos(camState.phi);
        const z=camState.smoothTarget.z+camState.distance*Math.sin(camState.phi)*Math.cos(camState.theta);
        camState.smoothPos.lerp(new THREE.Vector3(x,y,z),.08);
        camera.position.copy(camState.smoothPos);
        camera.lookAt(camState.smoothTarget);
    }
}

// Função para detectar qual ilha o avatar está
// Função para detectar qual ilha o avatar está
function getCurrentIsland(px, pz) {
    // Primeiro verificar se está em uma ponte
    const bridge = getCurrentBridge(px, pz, 14.5);
    if (bridge) {
        // Retornar a ilha de destino da ponte
        return islandsData.find(island => 
            island.x === bridge.bridge.endX && 
            island.z === bridge.bridge.endZ
        ) || islandsData[0];
    }
    
    for (const island of islandsData) {
        const dx = px - island.x;
        const dz = pz - island.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        // Margem de tolerância de 5 unidades para bordas
        if (dist <= island.radius + 5) {
            return island;
        }
    }
    return null; // Não está em nenhuma ilha
}

// Função para verificar se há ponte entre duas ilhas
// Função para verificar se há ponte entre duas ilhas
function hasBridge(island1, island2) {
    // Verificar se existe uma ponte registrada entre as ilhas
    return bridges.some(bridge => {
        const bridgeStartIsland = getCurrentIsland(bridge.startX, bridge.startZ);
        const bridgeEndIsland = getCurrentIsland(bridge.endX, bridge.endZ);
        
        return (
            (bridgeStartIsland === island1 && bridgeEndIsland === island2) ||
            (bridgeStartIsland === island2 && bridgeEndIsland === island1)
        );
    });
}

// Função para verificar se o avatar está em uma ponte
function getCurrentBridge(px, pz, py) {
    for (const bridge of bridges) {
        // Calcular distância do ponto à linha da ponte
        const dx = bridge.endX - bridge.startX;
        const dz = bridge.endZ - bridge.startZ;
        const length = Math.sqrt(dx * dx + dz * dz);
        
        // Projeção do ponto na linha da ponte
        const t = ((px - bridge.startX) * dx + (pz - bridge.startZ) * dz) / (length * length);
        
        if (t >= 0 && t <= 1) {
            // Ponto mais próximo na linha
            const closestX = bridge.startX + t * dx;
            const closestZ = bridge.startZ + t * dz;
            
            // Distância perpendicular
            const perpDist = Math.sqrt(
                Math.pow(px - closestX, 2) + 
                Math.pow(pz - closestZ, 2)
            );
            
            // Verificar se está dentro da largura da ponte
            if (perpDist <= bridge.width / 2) {
                // Calcular altura da ponte neste ponto
                const bridgeY = bridge.startY + (bridge.endY - bridge.startY) * t;
                
                // Verificar se está próximo da altura da ponte
                if (Math.abs(py - bridgeY) < 3) {
                    return {
                        bridge: bridge,
                        progress: t,
                        height: bridgeY
                    };
                }
            }
        }
    }
    return null;
}


function updateMovement(dt) {
    const speed = 6 * cfg.speed;
    let mx = 0, mz = 0;
    
    // 1. Controles manuais (teclado/joystick) cancelam o movimento por clique
    if (keys['KeyW'] || keys['ArrowUp']) { mz -= 1; moveTarget = null; }
    if (keys['KeyS'] || keys['ArrowDown']) { mz += 1; moveTarget = null; }
    if (keys['KeyA'] || keys['ArrowLeft']) { mx -= 1; moveTarget = null; }
    if (keys['KeyD'] || keys['ArrowRight']) { mx += 1; moveTarget = null; }
    if (joystickActive) { mx += joystickDx; mz += joystickDz; moveTarget = null; }
    
    const len = Math.hypot(mx, mz);
    if (len > 1) { mx /= len; mz /= len; }
    
    let wx = 0, wz = 0;
    
    // 2. Lógica de "Clique para Mover" (se não houver input manual)
    if (moveTarget && len === 0) {
        const dx = moveTarget.x - avatar.position.x;
        const dz = moveTarget.z - avatar.position.z;
        const dist = Math.hypot(dx, dz);
        
        if (dist > 0.8) { // Distância mínima para considerar que chegou
            // Calcula a direção mundial diretamente
            wx = (dx / dist) * speed;
            wz = (dz / dist) * speed;
            
            // Suaviza a velocidade
            velX += (wx - velX) * .18;
            velZ += (wz - velZ) * .18;
        } else {
            moveTarget = null; // Chegou ao destino
            velX *= 0.8;
            velZ *= 0.8;
        }
    } else if (len > 0) {
        // Movimento manual (com rotação da câmera)
        const sinT = Math.sin(camState.theta), cosT = Math.cos(camState.theta);
        wx = mx * cosT + mz * sinT;
        wz = -mx * sinT + mz * cosT;
        
        velX += (wx * speed - velX) * .18;
        velZ += (wz * speed - velZ) * .18;
    } else {
        // Sem input e sem alvo, desacelera
        velX *= 0.8;
        velZ *= 0.8;
        if (Math.abs(velX) < 0.1) velX = 0;
        if (Math.abs(velZ) < 0.1) velZ = 0;
    }
    
    const proposedX = avatar.position.x + velX * dt;
    const proposedZ = avatar.position.z + velZ * dt;
    const proposedPos = { x: proposedX, z: proposedZ };
    const validation = validateMovement(proposedPos);
    
    if (validation.valid) {
        avatar.position.x = proposedX;
        avatar.position.z = proposedZ;
        avatar.position.y = validation.height;
        onGround = true;
        isFalling = false;
    } else {
        velX *= 0.1;
        velZ *= 0.1;
        // Se estiver indo para um alvo e bateu em algo, cancela o alvo se estiver muito perto
        if (moveTarget) {
            const distToTarget = Math.hypot(moveTarget.x - avatar.position.x, moveTarget.z - avatar.position.z);
            if (distToTarget < 2) moveTarget = null;
        }
    }
    
    if (isFalling) {
        velY -= 20 * dt;
        avatar.position.y += velY * dt;
        const currentPos = { x: avatar.position.x, z: avatar.position.z };
        const validHeight = getValidHeight(currentPos);
        if (validHeight !== null && avatar.position.y <= validHeight + 1) {
            avatar.position.y = validHeight;
            velY = 0;
            isFalling = false;
            onGround = true;
        }
    }
    
    if (keys['Space'] && onGround && !isFalling) {
        velY = 8;
        isJumping = true;
        onGround = false;
    }
    
    const isMoving = Math.hypot(velX, velZ) > .15;
    if (isMoving) {
        // Usa a direção da velocidade para rotacionar o avatar
        const targetAngle = Math.atan2(velX, velZ);
        let diff = targetAngle - avatar.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        avatar.rotation.y += diff * .15;
        
        const wt = performance.now() * .006;
        const s = Math.sin(wt * cfg.speed);
        const legs = avatar.children.filter((c, i) => i >= 5);
        if (legs.length >= 2) {
            legs[0].rotation.x = s * .6;
            if (legs[1]) legs[1].rotation.x = -s * .6;
        }
    } else {
        // Parar animação de andar suavemente
        const legs = avatar.children.filter((c, i) => i >= 5);
        if (legs.length >= 2) {
            legs[0].rotation.x *= 0.8;
            if (legs[1]) legs[1].rotation.x *= 0.8;
        }
    }
    
    if (avatar.position.y < -50) {
        avatar.position.set(0, 14.5, 0);
        velX = 0; velY = 0; velZ = 0;
        isFalling = false;
        moveTarget = null;
        notifSys.show('⚠️ Você caiu! Retornando...', 'xp', 2500);
    }
}

let zoomInterval = null;
function startZoom(dir) {
  if (zoomInterval) clearInterval(zoomInterval); // Evita múltiplos intervals
  zoomInterval = setInterval(() => {
    const step = 2; // Valor fixo para zoom suave (era distance * 0.02)
    camState.distance = Math.max(
      camState.minDist, 
      Math.min(camState.maxDist, camState.distance + dir * step)
    );
  }, 16);
}
function stopZoom() { 
  clearInterval(zoomInterval); 
  zoomInterval = null; 
}

// Garantir que os botões respondam a todos os eventos

const zoomOut = document.getElementById('btn-zoom-out');

['mousedown', 'touchstart'].forEach(ev => {
  zoomIn.addEventListener(ev, e => { startZoom(-1); e.preventDefault(); }, {passive: false});

});

['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(ev => {

function createCentralPlaza(){
  const group = new THREE.Group();
  const crystalMat = new THREE.MeshBasicMaterial({color:0x00ffcc,transparent:true,opacity:0.75});
  const crystalGeo = new THREE.OctahedronGeometry(4,0);
  const centralCrystal = new THREE.Mesh(crystalGeo, crystalMat);
  centralCrystal.position.set(0,18,0);
  centralCrystal.userData.isCentralCrystal = true;
  group.add(centralCrystal);
  const ringMat = new THREE.MeshBasicMaterial({color:0x5bc8f5,transparent:true,opacity:0.5,wireframe:true});
  const ring = new THREE.Mesh(new THREE.TorusGeometry(6,0.3,8,32), ringMat);
  ring.position.set(0,16,0);
  ring.rotation.x = Math.PI/2;
  group.add(ring);
  const pedMat = new THREE.MeshBasicMaterial({color:0x8899bb,transparent:true,opacity:0.8});
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(1.5,2,3,8), pedMat);
  ped.position.set(0,15.5,0);
  group.add(ped);
  const plaqueMat = new THREE.MeshBasicMaterial({color:0x1a3a6a,transparent:true,opacity:0.9,side:THREE.DoubleSide});
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(14,5), plaqueMat);
  plaque.position.set(0,17,-8);
  plaque.rotation.y = Math.PI;
  group.add(plaque);
  const pathMat = new THREE.MeshBasicMaterial({color:0x7799aa,transparent:true,opacity:0.6});
  [[0,0,1],[0,0,-1],[1,0,0],[-1,0,0]].forEach(([x,y,z])=>{
    const path = new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.2,6), pathMat);
    path.position.set(x*14, 14.5, z*14);
    group.add(path);
    for(let i=2;i<=4;i++){
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,0.2,6), pathMat);
      seg.position.set(x*14*i/4, 14.5, z*14*i/4);
      group.add(seg);
    }
  });
  scene.add(group);
  return {group, centralCrystal, ring};
}
function createPointsOfInterest(){
  const markers = [];
  const markerMat = new THREE.MeshBasicMaterial({color:0xffdd44,transparent:true,opacity:0.9});
  pontosDeInteresse.forEach(poi => {
    const markerGroup = new THREE.Group();
    markerGroup.position.set(poi.posicao.x, poi.posicao.y, poi.posicao.z);
    const gem = new THREE.Mesh(new THREE.OctahedronGeometry(1.2,0), markerMat.clone());
    gem.material.color.setHex(0xffee66);
    markerGroup.add(gem);
    const beamMat = new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.15});
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,8,6), beamMat);
    beam.position.y = -4;
    markerGroup.add(beam);
    markerGroup.userData = {poi, baseY: poi.posicao.y};
    scene.add(markerGroup);
    markers.push(markerGroup);
  });
  return markers;
}

function createCentralParticles(){
  const count = 60;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for(let i=0;i<count;i++){
    const angle = (i/count)*Math.PI*2;
    const r = 5 + Math.random()*3;
    positions[i*3] = Math.cos(angle)*r;
    positions[i*3+1] = 16 + Math.random()*6;
    positions[i*3+2] = Math.sin(angle)*r;
    colors[i*3]=0.3+Math.random()*0.3; colors[i*3+1]=0.8+Math.random()*0.2; colors[i*3+2]=1;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({size:0.8,vertexColors:true,transparent:true,opacity:0.9,sizeAttenuation:true}));
  scene.add(pts);
  return pts;
}

function updateFase1(t){
  if(plaza.centralCrystal){
    plaza.centralCrystal.rotation.y += 0.008;
    plaza.centralCrystal.rotation.x = Math.sin(t*0.7)*0.1;
    plaza.centralCrystal.position.y = 18 + Math.sin(t*1.2)*0.5;
    plaza.centralCrystal.material.opacity = 0.6 + Math.sin(t*1.5)*0.2;
  }
  if(plaza.ring){
    plaza.ring.rotation.z += 0.004;
  }
  poiMarkers.forEach((m, i)=>{
    m.position.y = m.userData.baseY + Math.sin(t*1.4 + i*1.2)*0.8;
    m.children[0].rotation.y += 0.02;
    m.children[0].material.opacity = 0.7 + Math.sin(t*2 + i)*0.3;
  });
  if(centralParticles){
    const pos = centralParticles.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      const angle = (i/pos.count)*Math.PI*2 + t*0.3;
      const r = 5 + Math.sin(t*0.5+i)*1.5;
      pos.setX(i, Math.cos(angle)*r);
      pos.setY(i, 16 + Math.random()*0.1 + Math.sin(t+i*0.3)*2);
      pos.setZ(i, Math.sin(angle)*r);
    }
    pos.needsUpdate = true;
  }
  scene.children.forEach(obj=>{
    if(obj.userData && obj.userData.area){
      obj.position.y = obj.userData.baseY + Math.sin(t*0.8 + obj.userData.area.x)*0.3;
    }
  });
  let closest = null, closestDist = Infinity;
  poiMarkers.forEach(m=>{
    const dx = avatar.position.x - m.position.x;
    const dz = avatar.position.z - m.position.z;
    const dist = Math.hypot(dx, dz);
    if(dist < 12 && dist < closestDist){ closest = m; closestDist = dist; }
  });
  if(closest !== nearPoi){
    nearPoi = closest;
    if(nearPoi){
      hintEl.style.left = '50%';
      hintEl.style.top = '65%';
      hintEl.classList.add('visible');
    } else {
      hintEl.classList.remove('visible');
    }
  }
  if(isMobileDevice && closest){
    hintEl.classList.add('visible');
  }
}

const bridges = [];

// Função para verificar se o avatar está em uma ponte
function getCurrentBridge(px, pz, py) {
    for (const bridge of bridges) {
        // Calcular distância do ponto à linha da ponte
        const dx = bridge.endX - bridge.startX;
        const dz = bridge.endZ - bridge.startZ;
        const length = bridge.length;
        
        // Projeção do ponto na linha da ponte
        const t = ((px - bridge.startX) * dx + (pz - bridge.startZ) * dz) / (length * length);
        
        if (t >= -0.1 && t <= 1.1) { // Margem de tolerância
            // Ponto mais próximo na linha
            const closestX = bridge.startX + t * dx;
            const closestZ = bridge.startZ + t * dz;
            
            // Distância perpendicular
            const perpDist = Math.sqrt(
                Math.pow(px - closestX, 2) + 
                Math.pow(pz - closestZ, 2)
            );
            
            // Verificar se está dentro da largura da ponte
            if (perpDist <= bridge.width / 2 + 0.5) {
                // Calcular altura da ponte neste ponto
                const bridgeY = bridge.startY + (bridge.endY - bridge.startY) * t;
                
                // Verificar se está próximo da altura da ponte
                if (Math.abs(py - bridgeY) < 3) {
                    return {
                        bridge: bridge,
                        progress: t,
                        height: bridgeY
                    };
                }
            }
        }
    }
    return null;
}

// Modificar getCurrentIsland para incluir pontes
function getCurrentIsland(px, pz) {
    // Primeiro verificar se está em uma ponte
    const bridge = getCurrentBridge(px, pz, 14.5);
    if (bridge) {
        // Retornar a ilha de destino da ponte se estiver indo para lá
        if (bridge.progress > 0.5) {
            return bridge.bridge.endIsland;
        } else {
            return bridge.bridge.startIsland;
        }
    }
    
    for (const island of islandsData) {
        const dx = px - island.x;
        const dz = pz - island.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        // Margem de tolerância de 5 unidades para bordas
        if (dist <= island.radius + 5) {
            return island;
        }
    }
    return null; // Não está em nenhuma ilha
}

function createTrailPortals(){

    const pilGeo=new THREE.CylinderGeometry(.42,.52,7,8);
    const pilMesh=new THREE.InstancedMesh(pilGeo,pilMat,2);
    [-2.8,2.8].forEach((side,i)=>{

      dummy.updateMatrix(); pilMesh.setMatrixAt(i,dummy.matrix);
    });
    pg.add(pilMesh);
    const archMat=new THREE.MeshStandardMaterial({color:trilha.cor,emissive:trilha.cor,emissiveIntensity:.55,transparent:true,opacity:.92,roughness:.15,metalness:.8});
    const arch=new THREE.Mesh(new THREE.TorusGeometry(2.8,.38,8,22,Math.PI),archMat);

    const innerMat=new THREE.MeshBasicMaterial({color:trilha.cor,transparent:true,opacity:.22,side:THREE.DoubleSide});
    const inner=new THREE.Mesh(new THREE.PlaneGeometry(5,6.2),innerMat);
    inner.position.set(0,3.4,0); pg.add(inner);
    const pGeo=new THREE.BufferGeometry();
    const pPos=new Float32Array(32*3);
    for(let i=0;i<32;i++){
      const a=(i/32)*Math.PI*2;
      pPos[i*3]=Math.cos(a)*2.7; pPos[i*3+1]=3.5+Math.sin(a)*2.7; pPos[i*3+2]=(Math.random()-.5)*.4;
    }
    pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
    const pPts=new THREE.Points(pGeo,new THREE.PointsMaterial({color:trilha.cor,size:.55,transparent:true,opacity:.95,sizeAttenuation:true}));
    pg.add(pPts);
    const plateMat=new THREE.MeshBasicMaterial({color:trilha.cor,transparent:true,opacity:.55,side:THREE.DoubleSide,wireframe:false});

function lerpAngle(a,b,t){
  let d=b-a;
  while(d>Math.PI)d-=Math.PI*2;
  while(d<-Math.PI)d+=Math.PI*2;
  return a+d*t;
}
function easeInOut(t){return t<.5?2*t*t:-1+(4-2*t)*t;}

function zoomToPoint(targetPos, newDistance = 35) {
    // Evita conflito com viagens de trilha já em andamento
    if (camTravel) return;
    
    // Fecha painéis abertos para não atrapalhar
    if (document.getElementById('trail-panel').classList.contains('active')) closeTrailPanel();
    if (document.getElementById('info-panel').classList.contains('active')) closeInfoPanel();
    
    // Calcula ângulo ideal para olhar o ponto (mantém visão 3/4)
    const targetTheta = camState.theta; // Mantém rotação atual
    const targetPhi = 0.7; // Ângulo levemente inclinado
    
    camTravel = {
        sTheta: camState.theta,
        sPhi: camState.phi,
        sDist: camState.distance,
        tTheta: targetTheta,
        tPhi: targetPhi,
        tDist: newDistance, // Zoom mais próximo
        dur: 1.4, // Animação rápida
        el: 0,
        sTarget: camState.smoothTarget.clone(),
        tTarget: targetPos.clone().add(new THREE.Vector3(0, 2, 0)) // Foco 2 unidades acima do chão
    };
    
    // Feedback visual sutil
    notifSys.show('🔍 Focando no local...', 'xp', 1200);
}

// Função para retornar à visão geral (duplo clique ou botão)
function resetCameraView() {
    if (camTravel) return;
    camTravel = {
        sTheta: camState.theta,
        sPhi: camState.phi,
        sDist: camState.distance,
        tTheta: 0,
        tPhi: 0.8,
        tDist: 80,
        dur: 1.2,
        el: 0,
        sTarget: camState.smoothTarget.clone(),
        tTarget: new THREE.Vector3(0, 14, 0)
    };
}


function updateCamTravel(dt){
  if(!camTravel)return;
  camTravel.el+=dt;
  const frac=Math.min(camTravel.el/camTravel.dur,1);
  const e=easeInOut(frac);
  camState.theta=lerpAngle(camTravel.sTheta,camTravel.tTheta,e);
  camState.phi=camTravel.sPhi+(camTravel.tPhi-camTravel.sPhi)*e;
  camState.distance=camTravel.sDist+(camTravel.tDist-camTravel.sDist)*e;
  camState.smoothTarget.lerpVectors(camTravel.sTarget,camTravel.tTarget,e);
  if(frac>=1)camTravel=null;
}

const rc2 = new THREE.Raycaster();
const m2v = new THREE.Vector2();

function handleCanvasClick(event) {
    // Ignora cliques se há painéis abertos
    if (document.getElementById('trail-panel').classList.contains('active')) return;
    if (document.getElementById('activity-overlay').classList.contains('active')) return;
    
    const cx = event.touches ? event.changedTouches[0].clientX : event.clientX;
    const cy = event.touches ? event.changedTouches[0].clientY : event.clientY;
    m2v.set((cx / window.innerWidth) * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
    rc2.setFromCamera(m2v, camera);
    
    // 1. PRIORIDADE: Verificar portais
    const portalMeshes = [];
    portais.forEach(p => p.traverse(c => { if (c.isMesh) portalMeshes.push(c); }));
    const portalHits = rc2.intersectObjects(portalMeshes, false);
    if (portalHits.length > 0) {
        let hitPortal = null;
        portais.forEach(p => {
            p.traverse(c => { if (c === portalHits[0].object) hitPortal = p; });
        });
        if (hitPortal) {
            openTrailPanel(hitPortal.userData.trilha);
            return; // Sai da função ao abrir portal
        }
    }
    
    // 2. Raycast contra o cenário/terreno
    const sceneObjects = [];
    scene.traverse(obj => {
        if (obj.isMesh && obj.visible && 
            !obj.userData.isNPC && 
            obj.parent !== avatar && 
            obj !== avatar && 
            !obj.userData.isCentralCrystal &&
            obj.material && 
            !obj.material.transparent && 
            !obj.material.wireframe) {
            sceneObjects.push(obj);
        }
    });
    
    const sceneHits = rc2.intersectObjects(sceneObjects, false);
    if (sceneHits.length > 0) {
        const hitPoint = sceneHits[0].point;
        
        // ✅ CORREÇÃO CRÍTICA: Define o destino do movimento
        moveTarget = { x: hitPoint.x, z: hitPoint.z };
        console.log('[CLICK-TO-MOVE] Destino definido:', moveTarget);
        
        // Calcula e aplica o zoom suave
        const distFromCamera = camera.position.distanceTo(hitPoint);
        let targetZoom = 35;
        if (distFromCamera < 50) {
            targetZoom = Math.max(20, distFromCamera * 0.6);
        } else if (distFromCamera > 150) {
            targetZoom = 50;
        }
        zoomToPoint(hitPoint, targetZoom);
    }
}

function updatePhase2(t, pList, tGroups, dt){
  if(pList) pList.forEach(p=>{
    const{arch,inner,pPts,ph}=p.userData;
    if(arch) arch.material.emissiveIntensity=.4+Math.sin(t*2+ph)*.28;
    if(inner) inner.material.opacity=.12+Math.sin(t*1.6+ph)*.12;
    if(pPts){
      const pp=pPts.geometry.attributes.position;
      for(let j=0;j<pp.count;j++){
        const a=(j/pp.count)*Math.PI*2+t*.85+ph;
        const r=2.65+Math.sin(t*2.5+j*.4)*.2;
        pp.setX(j,Math.cos(a)*r); pp.setY(j,3.5+Math.sin(a)*r); pp.setZ(j,Math.sin(t+j)*.15);
      }
      pp.needsUpdate=true;
    }
  });
  if(tGroups) tGroups.forEach((g,idx)=>{
    if(!g)return;
    if(idx===0&&g.userData.bPts){
      const bp=g.userData.bPts.geometry.attributes.position;
      g.userData.bPhases.forEach((ph,i)=>{
        bp.setX(i,bp.getX(i)+Math.cos(t*.9+ph)*.07);
        bp.setY(i,bp.getY(i)+Math.sin(t*2.8+ph)*.035);
        bp.setZ(i,bp.getZ(i)+Math.sin(t*.7+ph)*.07);
      });
      bp.needsUpdate=true;
    }
    if(idx===2){
      if(g.userData.gMesh){
        g.userData.gearAngles=g.userData.gearAngles||[0,0,0,0];
        const d=new THREE.Object3D();
        g.userData.gearAngles=g.userData.gearAngles.map((a,i)=>a+g.userData.gearSpeeds[i]);
        g.userData.gearAngles.forEach((a,i)=>{
          const[gx,gy,gz]=g.userData.gearPos[i];
          d.position.set(gx,gy,gz); d.rotation.set(0,0,a); d.scale.setScalar(1);
          d.updateMatrix(); g.userData.gMesh.setMatrixAt(i,d.matrix);
        });
        g.userData.gMesh.instanceMatrix.needsUpdate=true;
      }
      if(g.userData.smokes) g.userData.smokes.forEach((sm,j)=>{
        sm.position.y+=.012; sm.userData.phase+=dt;
        sm.material.opacity=Math.max(0,.28-sm.userData.phase*.09);
        sm.scale.setScalar(1+sm.userData.phase*.18);
        if(sm.userData.phase>3){sm.position.set(0,TRILHAS_DATA[2].islandPos.y+5+j*1.3,0);sm.userData.phase=0;sm.scale.setScalar(1);}
      });
    }
    if(idx===3){
      if(g.userData.platforms) g.userData.platforms.forEach(p=>{
        p.position.y=p.userData.baseY+Math.sin(t*.85+p.userData.fp)*.55;
      });
      if(g.userData.cloudObjs) g.userData.cloudObjs.forEach(cl=>{
        cl.position.x+=Math.sin(t*cl.userData.sp+cl.userData.ph)*.028;
        cl.position.y+=Math.sin(t*.5+cl.userData.ph)*.016;
      });
    }
    if(idx===4){
      if(g.userData.runeRings) g.userData.runeRings.forEach(r=>{
        r.rotation.z+=r.userData.rs; r.material.opacity=.55+Math.sin(t*2+r.userData.ph)*.32;
      });
      if(g.userData.topCrystal){
        g.userData.topCrystal.rotation.y+=.016;
        g.userData.topCrystal.material.opacity=.45+Math.sin(t*2.2)*.32;
      }
      if(g.userData.ePts){
        const ep=g.userData.ePts.geometry.attributes.position;
        for(let i=0;i<ep.count;i++){
          const a=(i/ep.count)*Math.PI*2+t*.65;
          ep.setX(i,Math.cos(a)*4.5); ep.setZ(i,Math.sin(a)*4.5);
        }
        ep.needsUpdate=true;
      }
    }
    if(idx===5&&g.userData.holos) g.userData.holos.forEach(h=>{
      h.material.opacity=.22+Math.sin(t*1.6+h.userData.ph)*.28;
      h.scale.y=.88+Math.sin(t*2.2+h.userData.ph)*.12;
    });
    if(idx===6&&g.userData.sigRings) g.userData.sigRings.forEach(r=>{
      const v=Math.sin(t*1.6-r.userData.si*.35);
      r.material.opacity=Math.max(0,v*.5);
      r.scale.setScalar(.8+v*.22);
    });
  });
  updateCamTravel(dt);
}

// NPC: MAGO DA COMPUTAÇÃO (5×5 - 25 frames)
// ══════════════════════════════════════════════════════════════
async function createNPC() {
    const group = new THREE.Group();
    
    // 1. Carregar sprite sheet 5×5
    const npcTexture = await AssetManager.loadTexture(
        '{% static "ilha/mago.png" %}', 
        0x4466ff
    );
    
    let animator = null;
    
    if (npcTexture.isFallback) {
        // FALLBACK: Geometria procedural
        const bodyMat = npcTexture.material; 
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 1.2, 8), bodyMat);
        body.castShadow = true; body.receiveShadow = true;
        group.add(body);
        
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), headMat);
        head.position.y = 1.2; head.castShadow = true;
        group.add(head);
        
        const hatMat = new THREE.MeshStandardMaterial({ color: 0x6644ff });
        const hat = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.8, 8), hatMat);
        hat.position.y = 1.7;
        group.add(hat);
        
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
        leftEye.position.set(-0.15, 1.3, 0.45);
        const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
        rightEye.position.set(0.15, 1.3, 0.45);
        group.add(leftEye); group.add(rightEye);
        
        const staffMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const staff = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.5, 6), staffMat);
        staff.position.set(0.6, 1.2, 0.2);
        staff.rotation.z = -0.2;
        group.add(staff);
        
    } else {
        // SUCESSO: Criar animador 5×5
        animator = new SpriteAnimator(npcTexture, 5, 5, 10);
        animator.setScale(2.8, 3.5);
        animator.sprite.position.y = 1.5;
        group.add(animator.sprite);
        
        // Colisor invisível
        const collider = new THREE.Mesh(
            new THREE.CylinderGeometry(0.7, 0.7, 2.2, 8),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        collider.position.y = 1.1;
        group.add(collider);
    }
    
    // Posição inicial
    group.position.set(5, 14.8, 12);
    group.scale.set(1.9, 1.9, 1.9); // ✅ Aumenta 190% (1.9x) em largura e altura;
    
    // Anel de interação visual
    const radius = 6.5;
    const interactionRingGeo = new THREE.RingGeometry(radius - 0.15, radius + 0.15, 64);
    const interactionRingMat = new THREE.MeshBasicMaterial({ 
        color: 0x5bc8f5, 
        transparent: true, 
        opacity: 0.2, 
        side: THREE.DoubleSide,
        depthWrite: false
    });
    const interactionRing = new THREE.Mesh(interactionRingGeo, interactionRingMat);
    interactionRing.rotation.x = -Math.PI / 2;
    interactionRing.position.y = -0.3;
    group.add(interactionRing);
    
    // DADOS DE ESTADO
    group.userData = {
        isNPC: true,
        npcName: "Mago da Computação",
        interactionRadius: radius,
        isPatrolling: true,
        patrolDirection: 1,
        patrolSpeed: 1.2,
        patrolAxis: 'x',
        hasInteracted: false,
        interactionCooldown: 0,
        interactionRing: interactionRing,
        animator: animator,
        lastAnimationState: 'idle'
    };
    
    scene.add(group);
    return group;
}



// ══════════════════════════════════════════════════════════════
// LÓGICA DE PATRULHA E ANIMAÇÃO NATURAL (5×5)
// ══════════════════════════════════════════════════════════════
function updateNPC(dt) {
    if (!npcGroup) return;

    const dist = avatar.position.distanceTo(npcGroup.position);
    const interactionRadius = npcGroup.userData.interactionRadius;
    const exitRadius = interactionRadius * 1.5; 
    
    const isClose = dist < interactionRadius;
    const isFar = dist > exitRadius; 
    
    const isDialogOpen = document.getElementById('npc-dialog').style.display === 'flex' || 
                         document.getElementById('dialogo-avancado').style.display === 'flex' ||
                         document.getElementById('activity-overlay').classList.contains('active');

    if (npcGroup.userData.interactionCooldown === undefined) {
        npcGroup.userData.interactionCooldown = 0;
    }

    if (npcGroup.userData.interactionCooldown > 0) {
        npcGroup.userData.interactionCooldown -= dt;
    }

    // 1. Lógica de Interação Automática
    if (isClose && !isDialogOpen && !npcGroup.userData.hasInteracted && npcGroup.userData.interactionCooldown <= 0) {
        npcGroup.userData.hasInteracted = true;
        npcGroup.userData.interactionCooldown = 2;
        startNPCDialog();
    } 
    // 2. FECHAMENTO AUTOMÁTICO ao se afastar
    else if (isFar && isDialogOpen) {
        document.getElementById('npc-dialog').style.display = 'none';
        document.getElementById('dialogo-avancado').style.display = 'none';
        document.getElementById('activity-overlay').classList.remove('active');
        npcGroup.userData.hasInteracted = false;
    }
    // 3. Reset do estado
    else if (isFar && !isDialogOpen) {
        npcGroup.userData.hasInteracted = false;
    }

    // 4. Determinar estado de animação baseado no contexto
    let desiredAnimation = 'idle';
    let isMoving = false;
    
    if (isDialogOpen) {
        desiredAnimation = 'talking'; // Mago está "falando"
    } else if (isClose) {
        desiredAnimation = 'pointing'; // Mago aponta para o jogador
    } else if (!isClose && !isDialogOpen && npcGroup.userData.isPatrolling) {
        // Patrulhando - usar idle com movimento
        const moveAmount = npcGroup.userData.patrolSpeed * dt * npcGroup.userData.patrolDirection;
        
        if (npcGroup.userData.patrolAxis === 'x') {
            npcGroup.position.x += moveAmount;
            npcGroup.rotation.y = npcGroup.userData.patrolDirection > 0 ? Math.PI / 2 : -Math.PI / 2;
            
            if (npcGroup.position.x > 8) {
                npcGroup.userData.patrolDirection = -1;
            } else if (npcGroup.position.x < 2) {
                npcGroup.userData.patrolDirection = 1;
            }
            isMoving = true;
            desiredAnimation = 'idle'; // Idle mesmo andando (movimento sutil)
        }
    }

    // 5. ANIMAÇÃO NATURAL (VisualLayer)
    if (npcGroup.userData.animator) {
        // Transição suave entre animações
        if (desiredAnimation !== npcGroup.userData.lastAnimationState) {
            npcGroup.userData.animator.play(desiredAnimation, true);
            npcGroup.userData.lastAnimationState = desiredAnimation;
        }
        
        // Atualizar animação
        npcGroup.userData.animator.update(dt);
        
        // Ajustar velocidade baseado no movimento
        if (isMoving) {
            npcGroup.userData.animator.animationSpeed = 1.2; // Mais rápido andando
        } else {
            npcGroup.userData.animator.animationSpeed = 1.0; // Normal parado
        }
    }

    // 6. Quando parado, olha para o jogador
    if (isClose || isDialogOpen) {
        npcGroup.lookAt(avatar.position.x, npcGroup.position.y, avatar.position.z);
    }

    // 7. FEEDBACK VISUAL DO ANEL
    if (npcGroup.userData.interactionRing) {
        const t = performance.now() * 0.001;
        const baseOpacity = 0.15 + Math.sin(t * 2) * 0.1;
        
        if (isClose) {
            npcGroup.userData.interactionRing.material.opacity = 0.45;
            npcGroup.userData.interactionRing.material.color.setHex(0xffdd44); 
        } else {
            npcGroup.userData.interactionRing.material.opacity = baseOpacity;
            npcGroup.userData.interactionRing.material.color.setHex(0x5bc8f5); 
        }
    }
}

function checkMissionProgress(type, value) {
    let updated = false;
    missoes.forEach(mission => {
        if (mission.concluida) return;
        switch(mission.objetivo) {
            case 'descobrir_trilha':
                if (type === 'descobrir') { mission.progresso = discoveredSet.size; if (mission.progresso >= mission.objetivoValor) mission.progresso = mission.objetivoValor; updated = true; }
                break;
            case 'visitar_trilha':
                if (type === 'visitar' && value === mission.objetivoValor) { mission.progresso = 1; updated = true; }
                break;
            case 'interagir_portais':
                if (type === 'interagir') { mission.progresso = estatisticas.interacoesRealizadas; if (mission.progresso >= mission.objetivoValor) mission.progresso = mission.objetivoValor; updated = true; }
                break;
            case 'concluir_atividade':
                if (type === 'atividade' && value === mission.objetivoValor) { mission.progresso = 1; updated = true; }
                break;
        }
        if (updated && mission.progresso >= mission.objetivoValor) mission.progresso = mission.objetivoValor;
    });
    if (updated) { updateMissionUI(); saveProgress(); }
}

function desbloquearConhecimento(atividadeId) {
    const trilha = TRILHAS_DATA.find(t => t.id === atividadeId);
    if (!trilha) return;
    
    if (!conhecimentos.find(k => k.id === atividadeId)) {
        conhecimentos.push({
            id: atividadeId,
            titulo: `Conceito: ${trilha.tema}`,
            descricao: `Você dominou os fundamentos de ${trilha.tema} na ${trilha.nome}.`,
            desbloqueado: true,
            trilha: trilha.nome,
            dataDesbloqueio: new Date().toISOString()
        });
        notifSys.show(`📚 Novo Conhecimento: ${trilha.tema}`, 'xp', 3000);
        atualizarEnciclopedia();
    }
}

function atualizarEnciclopedia() {
    const conteudosEl = document.getElementById('bib-conteudos');
    if (conhecimentos.length === 0) {
        conteudosEl.innerHTML = '<p style="text-align:center; color:#888;">Nenhum conceito desbloqueado ainda. Complete atividades para aprender!</p>';
    } else {
        conteudosEl.innerHTML = conhecimentos.map(k => `
            <div class="bib-item">
                <h4>${k.titulo}</h4>
                <p>${k.descricao}</p>
                <small style="color:#888;">Trilha: ${k.trilha}</small>
            </div>
        `).join('');
    }
    document.getElementById('bib-fragmentos').textContent = `💎 Fragmentos Coletados: ${fragmentosColetados.size}`;
}

const _originalCheckActivityAnswer = checkActivityAnswer;
checkActivityAnswer = function(selectedIndex, correctIndex, trailId) {
    _originalCheckActivityAnswer(selectedIndex, correctIndex, trailId);
    
    const isCorreta = (selectedIndex === correctIndex);
    if (isCorreta) {
        learningProfile.acertos++;
        desbloquearConhecimento(trailId);
        
        const trilha = TRILHAS_DATA.find(t => t.id === trailId);
        if (trilha && trilha.concluida && !worldProgress.habilidadesDesenvolvidas.has(trailId)) {
            worldProgress.trilhasConcluidas++;
            worldProgress.habilidadesDesenvolvidas.add(trailId);
        }
        
        if (learningProfile.acertos % 3 === 0 && learningProfile.dificuldadeAtual === "facil") {
            learningProfile.dificuldadeAtual = "medio";
            notifSys.show("🌟 Desafio avançado desbloqueado!", 'levelup', 3000);
        } else if (learningProfile.acertos % 5 === 0 && learningProfile.dificuldadeAtual === "medio") {
            learningProfile.dificuldadeAtual = "avancado";
            notifSys.show("🏆 Modo Mestre ativado!", 'levelup', 3000);
        }
    } else {
        learningProfile.erros++;
        if (learningProfile.erros >= 2 && learningProfile.dificuldadeAtual !== "facil") {
            learningProfile.dificuldadeAtual = "facil";
            notifSys.show("💡 Modo de dicas extras ativado!", 'xp', 3000);
        }
    }
    learningProfile.atividadesConcluidas++;
    saveProgress();
};

    // Mini Ilhas / Trilhas
    miniIslands.forEach((mini, idx) => {
        const trail = TRILHAS_DATA[idx];
        if (trail) {
            mini.traverse(obj => {
                if (obj.isMesh) obj.userData.locationName = `${trail.emoji} ${trail.nome}`;
            });
        }
    });
    
    // Ilha extra (Ilha das Conexões)
    const extraIsland = scene.children.find(c => c.userData && c.userData.extraIsland7);
    if (extraIsland) {
        extraIsland.traverse(obj => {
            if (obj.isMesh) obj.userData.locationName = "📡 Ilha das Conexões";
        });
    }
    
    // Portais
    portais.forEach(p => {
        const trilha = p.userData.trilha;
        if (trilha) {
            p.traverse(obj => {
                if (obj.isMesh) obj.userData.locationName = `${trilha.emoji} Portal: ${trilha.nome}`;
            });
        }
    });
    
    // Grupos de trilhas (conteúdo das ilhas)
    trilhaGroups.forEach((g, idx) => {
        const trail = TRILHAS_DATA[idx];
        if (trail && g) {
            g.traverse(obj => {
                if (obj.isMesh && !obj.userData.locationName) {
                    obj.userData.locationName = `${trail.emoji} ${trail.nome}`;
                }
            });
        }
    });
    
    // Praça Central
    if (plaza && plaza.group) {
        plaza.group.traverse(obj => {
            if (obj.isMesh) obj.userData.locationName = "⭐ Praça Central do Conhecimento";
        });
    }
    
    // Pontos de Interesse
    poiMarkers.forEach(m => {
        if (m.userData.poi) {
            m.traverse(obj => {
                if (obj.isMesh) obj.userData.locationName = `${m.userData.poi.icone} ${m.userData.poi.nome}`;
            });
        }
    });
    
    // Cachoeira
    if (waterfall) {
        waterfall.traverse(obj => {
            if (obj.isMesh) obj.userData.locationName = "💧 Cachoeira do Conhecimento";
        });
    }
    
    // Árvores (InstancedMesh)
    if (optimizedEnv && optimizedEnv.trunkMesh) {
        optimizedEnv.trunkMesh.userData.locationName = "🌲 Árvore";
        optimizedEnv.leavesMesh.userData.locationName = "🌲 Árvore";
    }
    
    // Flores
    if (optimizedEnv && optimizedEnv.flowerMesh) {
        optimizedEnv.flowerMesh.userData.locationName = "🌸 Flor";
    }
    
    // Cristais
    if (crystalGroup) {
        crystalGroup.traverse(obj => {
            if (obj.isMesh) obj.userData.locationName = "💎 Cristal Mágico";
        });
    }
    
    // NPC
    // Será marcado quando o NPC for criado (já tem userData.isNPC)
}

// Chamar após todos os objetos serem criados
setTimeout(assignNamesToObjects, 100);

// 3. Sistema de Hover com Raycaster (otimizado)
const hoverRaycaster = new THREE.Raycaster();
const hoverMouse = new THREE.Vector2();
let lastHoverCheck = 0;
const HOVER_THROTTLE = 50; // Verificar apenas a cada 50ms (performance)
let currentHoveredName = null;

canvas.addEventListener('mousemove', (e) => {
    const now = performance.now();
    if (now - lastHoverCheck < HOVER_THROTTLE) return;
    lastHoverCheck = now;
    
    // Se painel está aberto, esconder tooltip
    if (document.getElementById('trail-panel').classList.contains('active') ||
        document.getElementById('activity-overlay').classList.contains('active')) {
        hoverTooltip.style.opacity = '0';
        currentHoveredName = null;
        return;
    }
    
    hoverMouse.set(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1
    );
    
    hoverRaycaster.setFromCamera(hoverMouse, camera);
    
    // Coletar meshes com locationName
    const hoverTargets = [];
    scene.traverse(obj => {
        if (obj.isMesh && obj.userData.locationName && obj.visible) {
            hoverTargets.push(obj);
        }
    });
    
    // Adicionar NPC se existir
    if (npcGroup) {
        npcGroup.traverse(obj => {
            if (obj.isMesh) {
                if (!obj.userData.locationName) obj.userData.locationName = "🧙 Mago da Computação";
                hoverTargets.push(obj);
            }
        });
    }
    
    const intersects = hoverRaycaster.intersectObjects(hoverTargets, false);
    
    if (intersects.length > 0) {
        const hit = intersects[0];
        let locationName = hit.object.userData.locationName;
        
        // Para InstancedMesh, identificar instância específica
        if (hit.object.isInstancedMesh && hit.instanceId !== undefined) {
            if (hit.object.userData.locationName === "🌲 Árvore") {
                locationName = `🌲 Árvore #${hit.instanceId + 1}`;
            } else if (hit.object.userData.locationName === "🌸 Flor") {
                locationName = `🌸 Flor #${hit.instanceId + 1}`;
            }
        }
        
        if (locationName && locationName !== currentHoveredName) {
            currentHoveredName = locationName;
            hoverTooltip.textContent = locationName;
            hoverTooltip.style.opacity = '1';
        }
        
        // Posicionar tooltip no mouse
        hoverTooltip.style.left = e.clientX + 'px';
        hoverTooltip.style.top = e.clientY + 'px';
        
        // Cursor pointer
        canvas.style.cursor = 'pointer';
    } else {
        if (currentHoveredName) {
            hoverTooltip.style.opacity = '0';
            currentHoveredName = null;
            canvas.style.cursor = 'default';
        }
    }
});

// Esconder tooltip ao sair do canvas
canvas.addEventListener('mouseleave', () => {
    hoverTooltip.style.opacity = '0';
    currentHoveredName = null;
    canvas.style.cursor = 'default';
});
