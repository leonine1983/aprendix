const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    topColor: { value: new THREE.Color(0x0077ff) },
    bottomColor: { value: new THREE.Color(0xffffff) },
    offset: { value: 20 },
    exponent: { value: 0.6 },
    sunPosition: { value: new THREE.Vector3(50, 100, 50) },
    moonPosition: { value: new THREE.Vector3(-50, 80, -50) }
  },
  vertexShader: `
    varying vec3 vWorldPosition;
    void main() {
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      gl_Position.z = gl_Position.w;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform float offset;
    uniform float exponent;
    uniform vec3 sunPosition;
    uniform vec3 moonPosition;
    varying vec3 vWorldPosition;
    void main() {
      vec3 direction = normalize(vWorldPosition);
      float h = normalize(vWorldPosition + offset).y;
      vec3 skyColor = mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0));
      float sunDist = length(direction - normalize(sunPosition));
      float sunGlow = exp(-sunDist * 3.0) * 0.8;
      skyColor += vec3(1.0, 0.9, 0.7) * sunGlow;
      float moonDist = length(direction - normalize(moonPosition));
      float moonGlow = exp(-moonDist * 3.0) * 0.4;
      skyColor += vec3(0.8, 0.85, 1.0) * moonGlow;
      gl_FragColor = vec4(skyColor, 1.0);
    }
  `,
  side: THREE.BackSide
});

function createTeleportPortal(x, y, z, color, destinationPortal, label) {
  const group = new THREE.Group();

  const ringGeo = new THREE.TorusGeometry(2.5, 0.25, 16, 64);
  const ringMat = new THREE.MeshPhysicalMaterial({
    color: color, emissive: color, emissiveIntensity: 2.5,
    roughness: 0.1, metalness: 0.9, clearcoat: 1.0
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.castShadow = true;
  group.add(ring);

  const surfaceGeo = new THREE.CircleGeometry(2.3, 64);
  const surfaceMat = new THREE.MeshPhysicalMaterial({
    color: color, emissive: color, emissiveIntensity: 1.5,
    transparent: true, opacity: 0.4, roughness: 0.1, metalness: 0.3, side: THREE.DoubleSide
  });
  const surface = new THREE.Mesh(surfaceGeo, surfaceMat);
  group.add(surface);

  const particleCount = 100;
  const particleGeo = new THREE.BufferGeometry();
  const particlePos = new Float32Array(particleCount * 3);
  const particleSpeeds = new Float32Array(particleCount);
  const particleAngles = new Float32Array(particleCount);
  const particleRadii = new Float32Array(particleCount);

  for (let i = 0; i < particleCount; i++) {
    particleAngles[i] = Math.random() * Math.PI * 2;
    particleRadii[i] = 2.0 + Math.random() * 1.5;
    particleSpeeds[i] = 0.5 + Math.random() * 1.5;
    particlePos[i * 3] = Math.cos(particleAngles[i]) * particleRadii[i];
    particlePos[i * 3 + 1] = (Math.random() - 0.5) * 1.5;
    particlePos[i * 3 + 2] = Math.sin(particleAngles[i]) * particleRadii[i];
  }
  particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
  const particleMat = new THREE.PointsMaterial({
    color: color, size: 0.15, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending
  });
  const particles = new THREE.Points(particleGeo, particleMat);
  group.add(particles);

  const portalLight = new THREE.PointLight(color, 3, 15);
  portalLight.position.set(0, 0, 0);
  group.add(portalLight);

  const baseGeo = new THREE.CylinderGeometry(0.8, 1.0, 0.5, 16);
  const baseMat = new THREE.MeshPhysicalMaterial({ color: 0x555555, roughness: 0.7, metalness: 0.5 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = -2.75;
  base.castShadow = true;
  group.add(base);

  [-1.2, 1.2].forEach(xOff => {
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 5, 8), baseMat);
    col.position.set(xOff, -0.25, 0);
    col.castShadow = true;
    group.add(col);
    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), ringMat);
    orb.position.set(xOff, 2.5, 0);
    group.add(orb);
  });

  group.position.set(x, y, z);
  group.userData.isTeleportPortal = true;
  group.userData.portalColor = color;
  group.userData.destination = destinationPortal;
  group.userData.particleData = { positions: particlePos, speeds: particleSpeeds, angles: particleAngles, radii: particleRadii, count: particleCount };

  scene.add(group);
  placedObjects.push(group);

  const div = document.createElement('div');
  div.className = 'portal-label';
  div.textContent = label;
  const labelObj = new CSS2DObject(div);
  labelObj.position.set(0, 3.5, 0);
  group.add(labelObj);

  return group;
}

function updateTeleportPortals(delta) {
  teleportPortals.forEach(portal => {
    const data = portal.userData.particleData;
    const positions = data.positions;
    for (let i = 0; i < data.count; i++) {
      data.angles[i] += data.speeds[i] * delta * 2;
      positions[i * 3] = Math.cos(data.angles[i]) * data.radii[i];
      positions[i * 3 + 1] += Math.sin(time * 3 + i) * 0.01;
      positions[i * 3 + 2] = Math.sin(data.angles[i]) * data.radii[i];
    }
    portal.children.forEach(child => {
      if (child.isPoints) child.geometry.attributes.position.needsUpdate = true;
    });
  });
}

function checkTeleportCollision(entity) {
  const now = performance.now();
  if (now - lastTeleportTime < TELEPORT_COOLDOWN) return;

  teleportPortals.forEach(portal => {
    const dist = entity.position.distanceTo(portal.position);
    if (dist < 2.5) {
      const dest = portal.userData.destination;
      if (dest && dest.position) {
        const flash = document.getElementById('teleport-flash');
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 300);

        entity.position.copy(dest.position);
        entity.position.y = 1.5;

        const indicator = document.getElementById('mode-indicator');
        indicator.textContent = `🌀 Teleportado para ${dest.userData.portalName || 'outra ilha'}!`;
        indicator.style.color = '#' + portal.userData.portalColor.toString(16).padStart(6, '0');
        indicator.classList.add('show');
        setTimeout(() => indicator.classList.remove('show'), 2000);

        lastTeleportTime = now;
      }
    }
  });
}

function createHouse(x, z, rotation = 0) {
  const group = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 4), matWood);
  base.position.y = 1.5; base.castShadow = true; base.receiveShadow = true; group.add(base);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(3.2, 2, 4), matRockDark);
  roof.position.y = 4; roof.rotation.y = Math.PI / 4; roof.castShadow = true; group.add(roof);
  const doorPivot = new THREE.Group(); doorPivot.position.set(-0.6, 0.9, 2.01);
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.1), matDoor); door.position.set(0.6, 0, 0); door.castShadow = true; doorPivot.add(door);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffd700 })); knob.position.set(1.0, 0, 0.06); doorPivot.add(knob); group.add(doorPivot);
  [-1.2, 1.2].forEach(xOff => {
    const window = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.1), new THREE.MeshPhysicalMaterial({ color: 0x81d4fa, roughness: 0.1, metalness: 0.3, transmission: 0.5 }));
    window.position.set(xOff, 1.8, 2.01); group.add(window);
  });
  group.position.set(x, 1.5, z); group.rotation.y = rotation; scene.add(group); placedObjects.push(group);
  const houseData = { group: group, doorPivot: doorPivot, doorOpen: false, targetDoorAngle: 0, currentDoorAngle: 0, position: new THREE.Vector3(x, 1.5, z), rotation: rotation };
  houses.push(houseData); return houseData;
}

const ANIMAL_BEHAVIORS = {
  cow: { speed: 0.8, states: ['grazing', 'walking', 'ruminating', 'idle'], stateDurations: { grazing: [4, 8], walking: [3, 6], ruminating: [5, 10], idle: [2, 4] }, bobble: 0.02 },
  ox: { speed: 0.6, states: ['grazing', 'walking', 'resting', 'idle'], stateDurations: { grazing: [5, 10], walking: [2, 5], resting: [6, 12], idle: [3, 5] }, bobble: 0.015 },
  horse: { speed: 2.5, states: ['trotting', 'grazing', 'idle', 'rearing'], stateDurations: { trotting: [3, 6], grazing: [4, 8], idle: [2, 4], rearing: [1, 2] }, bobble: 0.03 },
  chicken: { speed: 1.8, states: ['pecking', 'walking', 'running', 'idle'], stateDurations: { pecking: [2, 4], walking: [2, 5], running: [1, 2], idle: [1, 3] }, bobble: 0.04 },
  pig: { speed: 1.0, states: ['rooting', 'walking', 'resting', 'idle'], stateDurations: { rooting: [3, 6], walking: [2, 4], resting: [5, 10], idle: [2, 4] }, bobble: 0.025 }
};

function updateAnimalAI(animal, deltaTime) {
  const ai = animal.userData.ai; if (!ai) return;
  const behavior = ANIMAL_BEHAVIORS[ai.type]; if (!behavior) return;
  ai.stateTimer -= deltaTime; ai.bobbleTime += deltaTime;
  if (ai.stateTimer <= 0) { const states = behavior.states; ai.state = states[Math.floor(Math.random() * states.length)]; const duration = behavior.stateDurations[ai.state]; ai.stateTimer = duration[0] + Math.random() * (duration[1] - duration[0]); if (ai.state === 'walking' || ai.state === 'trotting' || ai.state === 'running') ai.direction = new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize(); }
  const group = animal; const body = group.userData.bodyMesh; const head = group.userData.headMesh;
  switch (ai.state) {
    case 'grazing': case 'pecking': case 'rooting': if (head) head.rotation.x = -0.5; if (body) body.position.y = ai.baseY + Math.sin(ai.bobbleTime * 3) * 0.05; break;
    case 'ruminating': if (head) head.rotation.x = -0.2; if (body) body.position.y = ai.baseY + Math.sin(ai.bobbleTime * 2) * 0.02; break;
    case 'walking': case 'trotting': const speed = behavior.speed * (ai.state === 'trotting' ? 1.5 : 1); group.position.x += ai.direction.x * speed * deltaTime; group.position.z += ai.direction.z * speed * deltaTime; group.rotation.y = Math.atan2(ai.direction.x, ai.direction.z); if (head) head.rotation.x = 0; if (body) body.position.y = ai.baseY + Math.abs(Math.sin(ai.bobbleTime * 5)) * behavior.bobble; if (group.userData.legs) group.userData.legs.forEach((leg, i) => { leg.rotation.x = Math.sin(ai.bobbleTime * 5 + i * Math.PI / 2) * 0.3; }); break;
    case 'running': const runSpeed = behavior.speed * 2; group.position.x += ai.direction.x * runSpeed * deltaTime; group.position.z += ai.direction.z * runSpeed * deltaTime; group.rotation.y = Math.atan2(ai.direction.x, ai.direction.z); if (head) head.rotation.x = 0.2; if (body) body.position.y = ai.baseY + Math.abs(Math.sin(ai.bobbleTime * 8)) * 0.08; if (group.userData.legs) group.userData.legs.forEach((leg, i) => { leg.rotation.x = Math.sin(ai.bobbleTime * 8 + i * Math.PI / 2) * 0.5; }); break;
    case 'resting': if (body) body.position.y = ai.baseY - 0.3; if (head) head.rotation.x = 0.3; break;
    case 'rearing': if (group) group.rotation.x = -0.3; if (body) body.position.y = ai.baseY + 0.3; setTimeout(() => { if (group) group.rotation.x = 0; }, 1000); break;
    default: if (head) head.rotation.x = 0; if (body) body.position.y = ai.baseY + Math.sin(ai.bobbleTime * 2) * 0.01; break;
  }
  const maxRadius = 42; const distFromCenter = Math.sqrt(group.position.x * group.position.x + group.position.z * group.position.z);
  if (distFromCenter > maxRadius) { const angle = Math.atan2(group.position.z, group.position.x); group.position.x = Math.cos(angle) * maxRadius; group.position.z = Math.sin(angle) * maxRadius; ai.direction = new THREE.Vector3(-Math.cos(angle), 0, -Math.sin(angle)).normalize(); }
}

window.duplicateSelected = function() {
  if (!selectedObject || currentMode !== 'edit') return;
  const isNPC = npcs.find(n => n === selectedObject);
  if (isNPC) { const cost = 50; if (crystals < cost) return alert("💎 Cristais insuficientes!"); updateCrystals(-cost); createNPC(selectedObject.userData.npcType, NPC_COLORS[selectedObject.userData.npcType], selectedObject.position.x + 3, selectedObject.position.z); }
  else if (selectedCatalogItem?.createFn) { if (crystals < selectedCatalogItem.cost) return alert("💎 Cristais insuficientes!"); updateCrystals(-selectedCatalogItem.cost); selectedCatalogItem.createFn(selectedObject.position.x + 3, selectedObject.position.z); }
};

window.deleteSelected = function() {
  if (!selectedObject || currentMode !== 'edit') return;
  let refund = 10; const isNPC = npcs.find(n => n === selectedObject);
  if (isNPC) refund = 50; else if (selectedCatalogItem) refund = selectedCatalogItem.cost;
  updateCrystals(refund); scene.remove(selectedObject);
  placedObjects = placedObjects.filter(o => o !== selectedObject); npcs = npcs.filter(n => n !== selectedObject);

};

function animateAvatar(delta, isMoving, isRunning) {

  if (isMoving) { time += delta * speed; avatarParts.leftArm.rotation.x = Math.sin(time) * amplitude; avatarParts.rightArm.rotation.x = -Math.sin(time) * amplitude; avatarParts.leftLeg.rotation.x = -Math.sin(time) * amplitude; avatarParts.rightLeg.rotation.x = Math.sin(time) * amplitude; avatarParts.torso.position.y = 1.68 + Math.abs(Math.sin(time * 2)) * 0.06; avatarParts.head.position.y = 2.76 + Math.abs(Math.sin(time * 2)) * 0.06; }
  else { const breathe = Math.sin(time * 2) * 0.024; avatarParts.torso.position.y = 1.68 + breathe; avatarParts.head.position.y = 2.76 + breathe; avatarParts.leftArm.rotation.x *= 0.9; avatarParts.rightArm.rotation.x *= 0.9; avatarParts.leftLeg.rotation.x *= 0.9; avatarParts.rightLeg.rotation.x *= 0.9; }
}

function findNearestHouse(position) { let nearest = null; let minDist = Infinity; houses.forEach(house => { const dist = position.distanceTo(house.position); if (dist < minDist) { minDist = dist; nearest = house; } }); return nearest; }

/* ═══════════════════════════════════════════════════════════════════════════════

function updateNPCAI(npc, deltaTime) {
  const ai = npc.userData.ai; if (!ai) return;
  ai.timer -= deltaTime; ai.greetingCooldown -= deltaTime; ai.speechTimer -= deltaTime; ai.thoughtTimer -= deltaTime;
  const distanceFromCenter = Math.sqrt(npc.position.x * npc.position.x + npc.position.z * npc.position.z);
  if (distanceFromCenter > 40 && ai.state !== 'edge_panic' && ai.state !== 'going_to_house' && ai.state !== 'entering_house' && ai.state !== 'resting' && ai.state !== 'leaving_house') { ai.state = 'edge_panic'; ai.timer = 2; const profile = NPC_PROFILES[ai.type]; if (profile && profile.edge) { showSpeechBubble(npc, profile.edge[Math.floor(Math.random() * profile.edge.length)], 'panic'); } }
  switch (ai.state) {
    case 'idle': if (ai.parts.leftArmPivot) { ai.parts.leftArmPivot.rotation.x *= 0.9; ai.parts.rightArmPivot.rotation.x *= 0.9; ai.parts.leftLegPivot.rotation.x *= 0.9; ai.parts.rightLegPivot.rotation.x *= 0.9; } if (ai.parts.tailPivot) { ai.parts.tailPivot.rotation.z *= 0.9; } if (ai.fatigue >= ai.fatigueThreshold) { const nearestHouse = findNearestHouse(npc.position); if (nearestHouse) { ai.targetHouse = nearestHouse; ai.state = 'going_to_house'; } else { ai.state = 'resting'; ai.timer = 5; } } else if (ai.timer <= 0) { ai.direction = new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize(); ai.state = 'walking'; ai.timer = 3 + Math.random() * 4; } if (ai.type === 'npc_dog' && ai.timer <= 0) { let nearestNPC = null; let minDist = 8; npcs.forEach(other => { if (other !== npc && other.userData.npcType !== 'npc_dog') { const dist = npc.position.distanceTo(other.position); if (dist < minDist) { minDist = dist; nearestNPC = other; } } }); if (nearestNPC) { ai.followTarget = nearestNPC; ai.state = 'following'; } else { ai.state = 'wandering'; ai.timer = 3 + Math.random() * 3; } } break;
    case 'walking': npc.position.x += ai.direction.x * ai.speed * deltaTime; npc.position.z += ai.direction.z * ai.speed * deltaTime; const lookTarget = npc.position.clone().add(ai.direction); npc.lookAt(lookTarget.x, npc.position.y, lookTarget.z); if (ai.parts.leftArmPivot) { const walkCycle = Math.sin(Date.now() * 0.005 * ai.speed); ai.parts.leftArmPivot.rotation.x = walkCycle * 0.5; ai.parts.rightArmPivot.rotation.x = -walkCycle * 0.5; ai.parts.leftLegPivot.rotation.x = -walkCycle * 0.5; ai.parts.rightLegPivot.rotation.x = walkCycle * 0.5; } else if (ai.parts.legs) { const walkCycle = Math.sin(Date.now() * 0.008 * ai.speed); ai.parts.legs[0].rotation.x = walkCycle * 0.4; ai.parts.legs[1].rotation.x = -walkCycle * 0.4; ai.parts.legs[2].rotation.x = -walkCycle * 0.4; ai.parts.legs[3].rotation.x = walkCycle * 0.4; if (ai.parts.tailPivot) { ai.parts.tailPivot.rotation.z = Math.sin(Date.now() * 0.01) * 0.5; } } ai.fatigue += ai.fatigueRate * deltaTime; if (ai.thoughtTimer <= 0 && Math.random() < 0.3) { const profile = NPC_PROFILES[ai.type]; if (profile && profile.thoughts) { showSpeechBubble(npc, profile.thoughts[Math.floor(Math.random() * profile.thoughts.length)], 'thought'); ai.thoughtTimer = 12 + Math.random() * 8; } } if (ai.greetingCooldown <= 0) { let greeted = false; for (let other of npcs) { if (other !== npc && other.userData.ai.state !== 'resting') { const dist = npc.position.distanceTo(other.position); if (dist < 1.8 && other.userData.ai.greetingCooldown <= 0) { ai.state = 'greeting'; ai.greetingTarget = other; ai.timer = 2; other.userData.ai.state = 'greeting'; other.userData.ai.greetingTarget = npc; other.userData.ai.timer = 2; const profile = NPC_PROFILES[ai.type]; if (profile && profile.greetings) { showSpeechBubble(npc, profile.greetings[Math.floor(Math.random() * profile.greetings.length)], 'greeting'); } const otherProfile = NPC_PROFILES[other.userData.npcType]; if (otherProfile && otherProfile.greetings) { setTimeout(() => { showSpeechBubble(other, otherProfile.greetings[Math.floor(Math.random() * otherProfile.greetings.length)], 'greeting'); }, 1000); } ai.greetingCooldown = 5; other.userData.ai.greetingCooldown = 5; greeted = true; break; } } } if (greeted) break; } if (ai.fatigue >= ai.fatigueThreshold) { const nearestHouse = findNearestHouse(npc.position); if (nearestHouse) { ai.targetHouse = nearestHouse; ai.state = 'going_to_house'; } else { ai.state = 'resting'; ai.timer = 5; } } else if (ai.timer <= 0) { ai.state = 'idle'; ai.timer = 2 + Math.random() * 3; } break;
    case 'greeting': if (ai.greetingTarget && ai.parts.leftArmPivot) { const targetPos = ai.greetingTarget.position; npc.lookAt(targetPos.x, npc.position.y, targetPos.z); const waveTime = Date.now() * 0.005; ai.parts.rightArmPivot.rotation.x = -2.0 + Math.sin(waveTime) * 0.5; ai.parts.rightArmPivot.rotation.z = Math.sin(waveTime * 2) * 0.3; ai.parts.leftArmPivot.rotation.x *= 0.9; ai.parts.leftLegPivot.rotation.x *= 0.9; ai.parts.rightLegPivot.rotation.x *= 0.9; } if (ai.timer <= 0) { ai.state = 'idle'; ai.timer = 2; if (ai.parts.rightArmPivot) { ai.parts.rightArmPivot.rotation.z = 0; } } break;
    case 'going_to_house': case 'entering_house': case 'resting': case 'leaving_house': case 'reacting_to_dog': case 'edge_panic': case 'wandering': case 'following': case 'barking': break;
  }
  const maxRadius = 42; const distFromCenter = Math.sqrt(npc.position.x * npc.position.x + npc.position.z * npc.position.z);

}

function updateHouses(deltaTime) { houses.forEach(house => { const diff = house.targetDoorAngle - house.currentDoorAngle; if (Math.abs(diff) > 0.01) { house.currentDoorAngle += diff * deltaTime * 3; house.doorPivot.rotation.y = house.currentDoorAngle; } }); }

/* ═══════════════════════════════════════════════════════════════════════════════
   SISTEMA DE CICLO DIA/NOITE

function updateDayNight(delta) {
  dayTime += delta / 720; if (dayTime > 1) dayTime = 0;
  const nightStart = 0.0, nightEnd = 0.3, dayStart = 0.3, dayEnd = 1.0;
  let sunAngle, dayIntensity;
  if (dayTime >= nightStart && dayTime < nightEnd) { const nightProgress = (dayTime - nightStart) / (nightEnd - nightStart); sunAngle = Math.PI + nightProgress * Math.PI; dayIntensity = 0.3; }
  else { const dayProgress = (dayTime - dayStart) / (dayEnd - dayStart); sunAngle = dayProgress * Math.PI; dayIntensity = 0.3 + 0.7 * Math.sin(dayProgress * Math.PI); }
  const sunY = Math.sin(sunAngle); const sunX = Math.cos(sunAngle);
  sunMesh.position.set(sunX * 150, sunY * 120 + 20, -80); moonMesh.position.set(-sunX * 150, -sunY * 100 + 60, 80);
  skyMat.uniforms.sunPosition.value.copy(sunMesh.position); skyMat.uniforms.moonPosition.value.copy(moonMesh.position);
  const isDay = dayTime >= dayStart;
  if (isDay) { dirLight.intensity = 2.5 * dayIntensity; hemiLight.intensity = 1.5 * dayIntensity; ambientLight.intensity = 0.5 * dayIntensity; renderer.toneMappingExposure = 0.8 + 0.6 * dayIntensity; scene.background = new THREE.Color(0x87CEEB); starsMesh.material.opacity = 0; cloudParticles.material.opacity = 0.7; }
  else { dirLight.intensity = 0.8; hemiLight.intensity = 0.6; ambientLight.intensity = 0.4; renderer.toneMappingExposure = 0.7; scene.background = new THREE.Color(0x1a1a3e); starsMesh.material.opacity = 0.8; cloudParticles.material.opacity = 0.3; }
  document.getElementById('time-icon').textContent = isDay ? '☀️' : '🌙'; document.getElementById('time-text').textContent = isDay ? 'Dia' : 'Noite';
}

function animateAllWaterfalls() { allWaterfalls.forEach(wf => { if (wf.particleGeo) { const positions = wf.particleGeo.attributes.position.array; const velocities = wf.particleVel; for (let i = 0; i < wf.particleCount; i++) { positions[i * 3 + 1] -= velocities[i]; if (positions[i * 3 + 1] < oceanLevel) { positions[i * 3] = wf.x + (Math.random() - 0.5) * wf.width * 0.8; positions[i * 3 + 1] = wf.topY; positions[i * 3 + 2] = wf.depth / 2 + 0.3 + (Math.random() - 0.5) * wf.width * 0.5; } } wf.particleGeo.attributes.position.needsUpdate = true; } if (wf.mist) { const mistPos = wf.mist.geometry.attributes.position.array; for (let i = 0; i < mistPos.length; i += 3) { mistPos[i] += Math.sin(time * 2 + i) * 0.05; mistPos[i + 1] += Math.cos(time * 1.5 + i) * 0.03; mistPos[i + 2] += Math.sin(time * 1.8 + i) * 0.04; if (mistPos[i + 1] > oceanLevel + 8) { mistPos[i + 1] = oceanLevel + Math.random() * 3; } } wf.mist.geometry.attributes.position.needsUpdate = true; } }); }

/* ═══════════════════════════════════════════════════════════════════════════════
   LOOP PRINCIPAL DE ANIMAÇÃO
   ═══════════════════════════════════════════════════════════════════════════════ */

function animate() {
  const now = performance.now();
  const delta = Math.min((now - prevTime) / 1000, 0.1);
  time += delta;
  updateDayNight(delta);
  animateAllWaterfalls();
  updateHouses(delta);
  updateTeleportPortals(delta);
  npcs.forEach(npc => updateNPCAI(npc, delta));
  animals.forEach(animal => updateAnimalAI(animal, delta));
  updateSpeechBubblePosition();

  nearNPC = null; currentHorse = null; let minHorseDist = Infinity;
  npcs.forEach(npc => { if (avatar.position.distanceTo(npc.position) < 3.5) nearNPC = npc; });
  animals.forEach(animal => { if (animal.userData.animalType === 'horse') { const d = avatar.position.distanceTo(animal.position); if (d < 5.0 && d < minHorseDist) { minHorseDist = d; currentHorse = animal; } } });

  if (!isRidingHorse) checkTeleportCollision(avatar);

  const prompt = document.getElementById('interaction-prompt');
  if (nearNPC && !isRidingHorse) { prompt.style.display = 'block'; const vector = nearNPC.position.clone(); vector.y += 3.0; vector.project(camera); if (vector.z < 1) { prompt.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`; prompt.style.top = `${(-vector.y * 0.5 + 0.5) * window.innerHeight - 40}px`; } } else { prompt.style.display = 'none'; }

    placedObjects.forEach(obj => { if (obj.children) { obj.children.forEach(child => { if (child.userData && child.userData.isLeaves) { child.position.x += Math.sin(time * 1.5 + child.position.y * 2) * 0.002; child.position.z += Math.cos(time * 1.2 + child.position.y * 1.5) * 0.002; } }); } });
    const isMoving = avatarMoveState.forward || avatarMoveState.backward || avatarMoveState.left || avatarMoveState.right; const speed = avatarMoveState.run ? AVATAR_RUN_SPEED : AVATAR_SPEED;

    else if (cameraMode === 'first' && isMoving) { avatarVelocity.x -= avatarVelocity.x * 10.0 * delta; avatarVelocity.z -= avatarVelocity.z * 10.0 * delta; avatarDirection.z = Number(avatarMoveState.forward) - Number(avatarMoveState.backward); avatarDirection.x = Number(avatarMoveState.right) - Number(avatarMoveState.left); avatarDirection.normalize(); if (avatarMoveState.forward || avatarMoveState.backward) avatarVelocity.z -= avatarDirection.z * 120 * delta; if (avatarMoveState.left || avatarMoveState.right) avatarVelocity.x -= avatarDirection.x * 120 * delta; pointerLockControls.moveRight(-avatarVelocity.x * delta); pointerLockControls.moveForward(-avatarVelocity.z * delta); }

    if (cameraMode === 'avatar' && !cameraZooming) { const cameraOffset = new THREE.Vector3(0, 6, 12); const targetCameraPos = avatar.position.clone().add(cameraOffset); camera.position.lerp(targetCameraPos, 0.1); camera.lookAt(avatar.position.x, avatar.position.y + 2.4, avatar.position.z); }
    if (cameraMode === 'third') orbitControls.update();
  }

  prevTime = now;
  composer.render();
  labelRenderer.render(scene, camera);
  requestAnimationFrame(animate);
}
