

<!-- Diálogo -->
<dialog 
  id="meuDialog_faltas_{{aluno.id}}_{{gestao_turma.grade.id}}_{{gestao_turma.trimestre.id}}" 
  class="dialog-faltas">
  <div class="dialog-header">
    <h5 class="mb-0 text-light">
      FALTAS: {{gestao_turma.grade}} - {{gestao_turma.trimestre}}
    </h5>
  </div>

  <div class="dialog-body">
    <p>
      <i class="fa-solid fa-pen-to-square me-1"></i>
      Lance ou atualize as <b>faltas</b> do aluno para o 
      <span class="text-uppercase">{{gestao_turma.trimestre}}</span>.
    </p>

    <input 
      id="faltasAluno_{{aluno.id}}_{{gestao_turma.grade.id}}_{{gestao_turma.trimestre.id}}"
      type="number"
      class="form-control"
      placeholder="{{ gestao_turma.faltas }}"
      min="0"
      max="200"
      step="1"
      oninput="this.value = this.value.replace(/[^0-9]/g, '');">
  </div>

  <div class="dialog-footer flex gap-2">
    <button 
      type="button"
      id="fecharDialog_faltas_{{aluno.id}}_{{gestao_turma.grade.id}}_{{gestao_turma.trimestre.id}}"
      class="btn btn-secondary fechar-dialog-faltas">
      Fechar
    </button>

    <button 
      type="button"
      class="btn btn-primary salvar-falta"
      data-aluno="{{aluno.id}}"
      data-grade="{{gestao_turma.grade.id}}"
      data-trimestre="{{gestao_turma.trimestre.id}}">
      Salvar faltas
    </button>
  </div>
</dialog>

<!-- Estilos -->
<style>
  dialog {
    border: none;
    border-radius: 1rem;
    padding: 0;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    opacity: 0;
    transform: translateY(-20px);
    transition: all 0.4s ease;
    z-index: 1000;
  }
  dialog[open] {
    opacity: 1;
    transform: translateY(0);
  }
  .dialog-header {
    background: #fd0da1ff;
    color: white;
    padding: 1rem;
    border-radius: 1rem 1rem 0 0;
  }
  .dialog-body {
    padding: 1rem;
  }
  .dialog-footer {
    padding: 0.75rem 1rem;
    text-align: right;
    border-top: 1px solid #ddd;
    border-radius: 0 0 1rem 1rem;
  }
</style>

<!-- Script: controle de todos os diálogos -->
<script>
document.querySelectorAll('.abrir-dialog-faltas').forEach(botaoAbrir => {
  const ids = botaoAbrir.id.split('_'); // ['abrirDialog','faltas', aluno, grade, trimestre]
  const alunoId = ids[2];
  const gradeId = ids[3];
  const trimestreId = ids[4];

  const dialog = document.getElementById(`meuDialog_faltas_${alunoId}_${gradeId}_${trimestreId}`);
  const fechar = document.getElementById(`fecharDialog_faltas_${alunoId}_${gradeId}_${trimestreId}`);

  if (dialog && fechar) {
    botaoAbrir.addEventListener('click', () => dialog.show());
    fechar.addEventListener('click', () => dialog.close());
  }
});
</script>

<!-- Script: salvar faltas -->
<script>
document.querySelectorAll('.salvar-falta').forEach(btn => {
  btn.addEventListener('click', function() {
    const alunoId = this.dataset.aluno;
    const gradeId = this.dataset.grade;
    const trimestreId = this.dataset.trimestre;

    const input = document.getElementById(`faltasAluno_${alunoId}_${gradeId}_${trimestreId}`);
    const falta = input.value.trim();

    // 🔹 validação: só aceita inteiros
    if (!/^\d+$/.test(falta)) {
      // Usa confirm() em vez de alert(), para permitir Cancelar
      const confirmar = confirm("⚠️ Digite um número inteiro válido para as faltas.\n\nClique em OK para tentar novamente ou Cancelar para sair.");
      if (confirmar) {
        input.focus();
      } else {
        input.value = ""; // limpa o campo se quiser
      }
      return;
    }

    // 🔹 Monta URL dinamicamente com namespace Django
    const urlBase = "{% url 'Gestao_Escolar:faltas_usa_dialog' 0 0 0 'FALTAS' %}";
    const url = urlBase.replace('/0/0/0/FALTAS/', `/${alunoId}/${gradeId}/${trimestreId}/${falta}/`);

    window.location.href = url;
  });
});
</script>
