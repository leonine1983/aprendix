<style>
  dialog {
    border: none;
    border-radius: 1rem;
    padding: 0;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    opacity: 0;
    transform: translateY(-20px);
    transition: all 0.4s ease;
    z-index: 1000;
  }

  dialog[open] {
    opacity: 1;
    transform: translateY(0);
  }

  .dialog-header {
    background: #fd0da1ff;
    color: white;
    padding: 1rem;
    border-radius: 1rem 1rem 0 0;
  }

  .dialog-body {
    padding: 1rem;
  }

  .dialog-footer {
    padding: 0.75rem 1rem;
    text-align: right;
    border-top: 1px solid #ddd;
    border-radius: 0 0 1rem 1rem;
  }

  .text {
    font-size: 0.50rem;
    border: 0.1rem solid blue;
    width: 100%;
  }
</style>

<dialog id="meuDialog_faltas_{{aluno.id}}_{{gestao_turma.grade.id}}_{{gestao_turma.trimestre_id}}">
  <div class="dialog-header">
    <h5 class="mb-0 text-light">
      FALTAS: {{gestao_turma.grade}} - {{gestao_turma.trimestre}}
    </h5>
  </div>

  <div class="dialog-body">
    <p>
      <i class="fa-solid fa-pen-to-square me-1"></i>
      Lance ou atualize as <b>FALTAS</b> do aluno para o
      <span class="text-uppercase">{{gestao_turma.trimestre}}</span>.
    </p>

    <input id="faltasAluno_{{aluno.id}}_{{gestao_turma.grade.id}}_{{gestao_turma.trimestre_id}}"
       type="number"
       class="form-control"
       placeholder="{{ gestao_turma.faltas }}"
       min="0"
       max="200"
       step="1" 
       oninput="this.value = this.value.replace(/[^0-9]/g, '');">

  </div>

  <div class="dialog-footer flex gap-2">
    <button type="button"
            id="fecharDialog_faltas_{{aluno.id}}_{{gestao_turma.grade.id}}_{{gestao_turma.trimestre_id}}"
            class="btn btn-secondary">
      Fechar
    </button>

    <button type="button"
            class="btn btn-primary salvar-falta"
            data-aluno="{{aluno.id}}"
            data-grade="{{gestao_turma.grade.id}}"
            data-trimestre="{{gestao_turma.trimestre_id}}">
      Salvar faltas
    </button>
  </div>
</dialog>

<script>
document.querySelectorAll('.salvar-falta').forEach(btn => {
  btn.addEventListener('click', function() {
    const alunoId = this.dataset.aluno;
    const gradeId = this.dataset.grade;
    const trimestreId = this.dataset.trimestre;
    const input = document.getElementById(`faltasAluno_${alunoId}_${gradeId}_${trimestreId}`);
    const falta = input.value.trim();

    // 🔹 validação: só aceita inteiros
    if (!/^\d+$/.test(falta)) {
      alert("Digite um número inteiro válido para as faltas.");
      input.focus();
      return;
    }

    const url = `{% url "Gestao_Escolar:faltas_usa_dialog" "ALUNO" "GRADE" "TRI" "VALOR_FALTA" %}`
      .replace("ALUNO", alunoId)
      .replace("GRADE", gradeId)
      .replace("TRI", trimestreId)
      .replace("VALOR_FALTA", encodeURIComponent(falta));

    window.location.href = url;
  });
});

</script>

<script>
const dialog = document.getElementById('meuDialog_faltas_{{aluno.id}}_{{gestao_turma.grade.id}}_{{gestao_turma.trimestre_id}}');
const abrirBtn = document.getElementById('abrirDialog_faltas_{{aluno.id}}_{{gestao_turma.grade.id}}_{{gestao_turma.trimestre_id}}');
const fecharBtn = document.getElementById('fecharDialog_faltas_{{aluno.id}}_{{gestao_turma.grade.id}}_{{gestao_turma.trimestre_id}}');

abrirBtn.addEventListener('click', () => dialog.show());
fecharBtn.addEventListener('click', () => dialog.close());
</script>
