<style>
.pcss3t{min-width:70vw!important}

</style>
{% load static %}
<div class="modal fade show" id="modal_escola" style="display: block; background: #0000003f; height: 100vh; width: 100vw; padding: 0; margin: 0;">
    {% include 'Escola/partials/mensagens.html' %}
    <div class="modal-dialog m-0 p-0" style="height: 100%; width: 100%; max-width: 100%;">
        <div class="modal-content bg-transparent d-flex justify-content-center align-items-center p-0 ">
            <div class="{% if titulo_page == 'Selecione o ano letivo' %} card {% elif  titulo_page == 'Selecione uma escola' %} card {% else %}fullscreen-card{% endif %}  w-100 h-100">
                <div class="w-100 d-flex justify-content-between align-items-center flex-wrap gap-2 bg-green" >
                  <h2 class="text-light">{{svg|safe}}{{ title_page|safe }} {{ titulo_page|safe }}</h2>   
                  <div class="d-flex justify-content-between gap-2">
                    <span class="fechar btn btn-sm d-flex pt-3  btn-light" onclick="fecharModal()">&times; Fechar a janela</span>             
                        <form id="logoutForm" method="post" action="{% url 'admin_acessos:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-secondary">
                                <i class="fa-thin fa-door-closed "></i> Sair do Sistema | Deslogar
                            </button>
                        </form>
                    </div>    
                </div>                
                <div class="bg-light" style='80vw!important' >
                    <script>
                        function fecharModal() {
                        document.getElementById("modal_escola").style.display = "none";
                        }
                    </script>
