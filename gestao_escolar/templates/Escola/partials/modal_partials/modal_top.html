<style>
.pcss3t{
    min-width:90vw!important;
}
.escolaEano{
    background-color: rgba(0, 0, 0, 0.555);
}

</style>
{% load static %}
<div class="modal  show" id="modal_escola">    
    <div class="modal-dialog m-0 p-0" style="width: 100%; max-width: 100%;">        
        <div class="modal-content d-flex  align-items-center p-2  {% if titulo_page == 'Selecione o ano letivo' %} escolaEano {% elif  titulo_page == 'Selecione uma escola' %} escolaEano {% else %}fullscreen-card{% endif %}"  >
            <div class="{% if titulo_page == 'Selecione o ano letivo' %} card {% elif  titulo_page == 'Selecione uma escola' %} card {% else %}fullscreen-card{% endif %}  w-100 h-100">
                <div class="w-100 d-flex justify-content-between align-items-center flex-wrap gap-2 bg-green p-2" >
                     {% if messages %}                
        {% include 'Escola/partials/mensagens.html' %}          
    {% endif %}
                  <h2 class="text-light">{{svg|safe}}{{ title_page|safe }} {{ titulo_page|safe }}</h2>   
                  <div class="d-flex justify-content-between gap-2">
                    <span class="fechar btn btn-sm d-flex pt-3  btn-light" onclick="fecharModal()">&times; Fechar a janela</span>             
                        <form id="logoutForm" method="post" action="{% url 'admin_acessos:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-secondary">
                                <i class="fa-thin fa-door-closed "></i> Sair do Sistema | Deslogar
                            </button>
                        </form>
                    </div>    
                </div>                
                <div class="bg-light" >
                    <script>
                        function fecharModal() {
                        document.getElementById("modal_escola").style.display = "none";
                        }
                    </script>
