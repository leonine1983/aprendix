{% load static %}
 <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    :root{
      --bg:#f5f7fb;
      --card:#fff;
      --primary:#3b82f6;
      --accent:#10b981;
      --muted:#64748b;
      --radius:12px;
      --shadow: 0 6px 20px rgba(2,6,23,0.06);
      --glass: rgba(255,255,255,0.45);
    }
    body{background:var(--bg); font-family:Inter,sans-serif; margin:0; padding:0;}
    .board{background:var(--card); border-radius:var(--radius); padding:12px; margin-bottom:16px; box-shadow:var(--shadow);}
    .board h4{display:flex; justify-content:space-between; font-size:1rem; margin-bottom:8px;}
    .columns{display:flex; gap:8px;}
    .column{flex:1; min-height:120px; background:#f0f4f8; padding:8px; border-radius:8px;}
    .task{background:#fff; padding:8px; margin-bottom:8px; border-radius:6px; cursor:grab; box-shadow:0 2px 6px rgba(0,0,0,0.08);}
    .column.drag-over{background:#dbeafe;}
    .comment-section{display:none; margin-top:8px;}
    .comment-row{display:flex; gap:4px; margin-bottom:4px;}
    .comments-list p{margin:2px 0; font-size:0.85rem;}
  </style>

<main class="container ">
  <h2>Kanban / Planejamento de Aula</h2>
  <button id="btn-add-board" class="btn btn-primary mb-3">+ Novo Planejamento</button>
  <div id="boardsContainer"></div>
</main>

<script>
  const boardsContainer = document.getElementById('boardsContainer');
  let dragged = null;

  function createTaskElement(text){
    const el = document.createElement('div');
    el.className = 'task';
    el.draggable = true;
    el.textContent = text;
    el.addEventListener('dragstart', ()=> { dragged = el; el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=> { el.classList.remove('dragging'); dragged = null; });
    return el;
  }

  function activateColumn(column){
    column.addEventListener('dragover', e=>{
      e.preventDefault();
      column.classList.add('drag-over');
      const after = getDragAfterElement(column, e.clientY);
      if(!dragged) return;
      if(after==null) column.appendChild(dragged);
      else column.insertBefore(dragged, after);
    });
    column.addEventListener('dragleave', ()=> column.classList.remove('drag-over'));
    column.addEventListener('drop', e=>{ e.preventDefault(); column.classList.remove('drag-over'); });
  }

  function getDragAfterElement(container, y){
    const draggableElements = [...container.querySelectorAll('.task:not(.dragging)')];
    return draggableElements.reduce((closest, child)=>{
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if(offset < 0 && offset > closest.offset) return { offset: offset, element: child };
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  function createBoard(name){
    const board = document.createElement('div');
    board.className = 'board';
    board.dataset.boardId = 'board-' + Date.now();
    board.innerHTML = `
      <h4>${name} <button data-delete-board style="background:transparent;border:0;color:#ff4d4f;cursor:pointer">Excluir</button></h4>
      <div class="controls mb-2"><button data-add-task class="btn btn-sm btn-outline-primary">+ Nova tarefa</button></div>
      <div class="columns">
        <div class="column" data-status="todo"></div>
        <div class="column" data-status="doing"></div>
        <div class="column" data-status="done"></div>
      </div>`;
    boardsContainer.appendChild(board);

    board.querySelectorAll('.column').forEach(activateColumn);
    board.querySelector('[data-add-task]').addEventListener('click', ()=>{
      const text = prompt('Descrição da nova tarefa:');
      if(!text) return;
      const todo = board.querySelector('.column[data-status="todo"]');
      todo.appendChild(createTaskElement(text));
    });
    board.querySelector('[data-delete-board]').addEventListener('click', ()=>{
      if(confirm('Excluir este planejamento?')) board.remove();
    });

    // exemplo inicial
    const todoCol = board.querySelector('.column[data-status="todo"]');
    if(todoCol.children.length===0){
      todoCol.appendChild(createTaskElement('Preparar Aula de Ciências'));
      todoCol.appendChild(createTaskElement('Criar Atividade de Matemática'));
    }
  }

  document.getElementById('btn-add-board').addEventListener('click', ()=>{
    const name = prompt('Nome do novo planejamento:');
    if(!name) return;
    createBoard(name);
  });

  // Inicializa um board padrão
  if(boardsContainer && document.querySelectorAll('.board').length===0){
    createBoard('Planejamento Inicial');
  }
</script>
