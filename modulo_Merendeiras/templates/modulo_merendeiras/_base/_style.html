<style>

    /* ── 1. TOKENS ─────────────────────────────────────────────── */
    :root {
      --color-primary:        #1b6b3a;
      --color-primary-hover:  #145530;
      --color-primary-light:  #e8f5ec;
      --color-primary-mid:    #2e9456;
      --color-secondary:      #4caf50;
      --color-accent:         #00c853;

      --color-success:        #2e7d32;
      --color-success-light:  #e8f5e9;
      --color-warning:        #e65100;
      --color-warning-light:  #fff3e0;
      --color-danger:         #c62828;
      --color-danger-light:   #ffebee;
      --color-info:           #0277bd;
      --color-info-light:     #e1f5fe;

      /* ── Sidebar ── */
      --sb-bg:                #f4f8f5;
      --sb-bg-2:              #e8f3ec;
      --sb-border:            #dfe9e3;
      --sb-section-label:     #7a8f83;
      --sb-text:              #4f6b5b;
      --sb-text-hover:        #1a2e20;
      --sb-text-active:       #1b6b3a;
      --sb-icon:              #7a8f83;
      --sb-icon-active:       #1b6b3a;
      --sb-item-hover-bg:     #e6f2ea;
      --sb-item-active-bg:    #d8ebe0;
      --sb-item-active-bar:   #1b6b3a;
      --sb-width:             264px;
      --sb-collapsed-width:   64px;

      /* ── Geral ── */
      --color-bg:             #f0f4f1;
      --color-surface:        #ffffff;
      --color-surface-2:      #f7faf8;
      --color-border:         #e1e8e3;
      --color-border-sub:     #eef2ef;

      --color-text:           #1a2e20;
      --color-text-2:         #4a6150;
      --color-text-3:         #8aa090;

      --hdr-bg:               rgba(255,255,255,0.92);
      --hdr-border:           rgba(220,232,224,0.8);
      --hdr-h:                60px;

      --r-xs:   4px;
      --r-sm:   8px;
      --r-md:   12px;
      --r-lg:   16px;
      --r-xl:   24px;
      --r-pill: 9999px;

      --sh-xs:    0 1px 2px rgba(0,0,0,0.04);
      --sh-sm:    0 2px 8px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.03);
      --sh-md:    0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --sh-lg:    0 8px 32px rgba(0,0,0,0.10), 0 3px 8px rgba(0,0,0,0.05);
      --sh-xl:    0 20px 60px rgba(0,0,0,0.13), 0 6px 14px rgba(0,0,0,0.07);
      --sh-green: 0 4px 18px rgba(27,107,58,0.22);
      --sh-panel: 0 16px 50px rgba(10,30,15,0.14), 0 4px 12px rgba(0,0,0,0.07);

      --ease:        cubic-bezier(0.4,0,0.2,1);
      --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
      --t-fast:  0.12s var(--ease);
      --t-base:  0.2s  var(--ease);
      --t-slow:  0.32s var(--ease);

      --z-overlay:  100;
      --z-sidebar:  200;
      --z-header:   300;
      --z-dropdown: 400;
    }


    /* ── 2. RESET & BASE ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    ul, ol { list-style: none; }
    svg { display: block; }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; border-radius: var(--r-xs); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    .skip-link { position: absolute; top: -100px; left: 16px; background: var(--color-primary); color: #fff; padding: 8px 16px; border-radius: 0 0 var(--r-sm) var(--r-sm); font-size: 13px; font-weight: 600; z-index: 9999; transition: top var(--t-fast); }
    .skip-link:focus { top: 0; }


    /* ── 3. LAYOUT SHELL ───────────────────────────────────────── */
    .shell { display: flex; flex-direction: column; min-height: 100vh; margin-left: var(--sb-width); transition: margin-left var(--t-slow); }
    .shell--collapsed { margin-left: var(--sb-collapsed-width); }


    /* ── 4. OVERLAY ────────────────────────────────────────────── */
    .overlay { position: fixed; inset: 0; background: rgba(5,15,8,0.55); backdrop-filter: blur(4px); z-index: var(--z-overlay); opacity: 0; pointer-events: none; transition: opacity var(--t-slow); }
    .overlay--visible { opacity: 1; pointer-events: auto; }


    /* ══════════════════════════════════════════════════════════════
       5. SIDEBAR — Dark forest, premium institutional
    ══════════════════════════════════════════════════════════════ */
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sb-width);
      background: var(--sb-bg);
      display: flex;
      flex-direction: column;
      z-index: var(--z-sidebar);
      transition: width var(--t-slow), transform var(--t-slow);
      overflow: hidden;
      box-shadow: 4px 0 24px rgba(0,0,0,0.25);

      /* Subtle texture overlay */
      background-image:
      radial-gradient(ellipse 80% 60% at 50% -20%, rgba(27,107,58,0.05) 0%, transparent 70%),
      linear-gradient(180deg, #f4f8f5 0%, #eaf4ee 100%);
    }

    /* ── Brand / Logo Area ── */
    .sb-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      height: var(--hdr-h);
      border-bottom: 1px solid var(--sb-border);
      flex-shrink: 0;
      position: relative;
    }
    .sb-brand::after {
      content: '';
      position: absolute;
      bottom: 0; left: 18px; right: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,200,83,0.3), transparent);
    }

    .sb-logo {
      width: 34px; height: 34px;
      border-radius: var(--r-md);
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0,200,83,0.3), 0 4px 16px rgba(0,200,83,0.2);
    }

    .sb-brand-text {
      display: flex; flex-direction: column;
      overflow: hidden; white-space: nowrap;
      transition: opacity var(--t-base), width var(--t-slow);
      min-width: 0;
    }


    .sb-brand-sub {
      font-size: 10px; font-weight: 500;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .sb-pin {
      margin-left: auto; flex-shrink: 0;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.25); border-radius: var(--r-sm);
      transition: color var(--t-base), background var(--t-base);
    }
    .sb-pin:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.08); }

    /* ── User Card ── */
    .sb-user {
      margin: 14px 12px 4px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--r-md);
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0; overflow: hidden; white-space: nowrap;
      cursor: pointer;
      transition: background var(--t-base), border-color var(--t-base);
    }
    .sb-user:hover { background: rgba(255,255,255,0.09); border-color: rgba(0,200,83,0.2); }

    .sb-user__av {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(0,200,83,0.25);
    }
    .sb-user__info { flex: 1; min-width: 0; overflow: hidden; }
    .sb-user__name { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-user__role { font-size: 11px; color: rgba(255,255,255,0.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-user__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; box-shadow: 0 0 6px var(--color-accent); animation: pulse-dot 2.4s ease-in-out infinite; }

    /* ── Nav ── */
    .sb-nav {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 8px 10px 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .sb-section {
      font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--sb-section-label);
      padding: 16px 10px 6px;
      white-space: nowrap; overflow: hidden;
      display: flex; align-items: center; gap: 8px;
    }
    .sb-section::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
      border-radius: 1px;
    }

    .sb-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: var(--r-md);
      font-size: 13.5px; font-weight: 500;
      color: var(--sb-text);
      cursor: pointer; position: relative;
      margin-bottom: 1px; white-space: nowrap; overflow: hidden;
      transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast);
      border-left: 2px solid transparent;
    }
    .sb-item:hover {
      background: var(--sb-item-hover-bg);
      color: var(--sb-text-hover);
      transform: translateX(2px);
    }
    .sb-item--active {
      background: var(--sb-item-active-bg);
      color: var(--sb-text-active);
      font-weight: 600;
      border-left-color: var(--color-accent);
    }

    .sb-item__icon {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      color: var(--sb-icon); flex-shrink: 0;
      transition: color var(--t-fast);
    }
    .sb-item:hover .sb-item__icon { color: rgba(255,255,255,0.7); }
    .sb-item--active .sb-item__icon { color: var(--color-accent); }
    .sb-item__label { flex: 1; }

    .sb-item__badge {
      flex-shrink: 0; font-size: 10px; font-weight: 700;
      font-family: 'DM Mono', monospace;
      padding: 1px 7px; border-radius: var(--r-pill);
      background: rgba(0,200,83,0.15);
      color: var(--color-accent);
      border: 1px solid rgba(0,200,83,0.2);
    }
    .sb-item__badge--warn { background: rgba(230,81,0,0.15); color: #ff8a50; border-color: rgba(230,81,0,0.2); }
    .sb-item__badge--danger { background: rgba(198,40,40,0.18); color: #ef9a9a; border-color: rgba(198,40,40,0.25); }

    .sb-item__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; box-shadow: 0 0 5px var(--color-accent); animation: pulse-dot 2.4s ease-in-out infinite; }

    /* Submenu */
    .sb-submenu { overflow: hidden; max-height: 0; transition: max-height var(--t-slow); padding-left: 30px; }
    .sb-submenu--open { max-height: 200px; }
    .sb-sub-item { display: block; font-size: 13px; font-weight: 400; color: var(--sb-text); padding: 7px 10px; border-radius: var(--r-sm); margin-bottom: 1px; border-left: 2px solid transparent; transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast); white-space: nowrap; }
    .sb-sub-item:hover { color: rgba(255,255,255,0.9); background: var(--sb-item-hover-bg); border-left-color: rgba(0,200,83,0.4); }

    .sb-chevron { color: var(--sb-icon); flex-shrink: 0; transition: transform var(--t-base), color var(--t-fast); }
    .sb-item--expanded .sb-chevron { transform: rotate(90deg); }
    .sb-item--expanded .sb-item__icon { color: rgba(255,255,255,0.7); }

    /* ── Sidebar Divider ── */
    .sb-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
      margin: 6px 10px;
    }

    /* ── Sidebar Footer ── */
    .sb-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--sb-border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; overflow: hidden;
      background: rgba(27, 68, 4, 0.88);
    }
    .sb-footer__status { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .sb-footer__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); box-shadow: 0 0 6px var(--color-accent); animation: pulse-dot 2.4s ease-in-out infinite; flex-shrink: 0; }
    .sb-footer__text { font-size: 11.5px; color: rgb(255, 255, 255); font-weight: 500; }
    .sb-footer__version { font-family: 'DM Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.15); }

    /* ── Collapsed sidebar ── */
    .sidebar--collapsed { width: var(--sb-collapsed-width); }
    .sidebar--collapsed .sb-brand-text,
    .sidebar--collapsed .sb-pin,
    .sidebar--collapsed .sb-user__info,
    .sidebar--collapsed .sb-user__dot,
    .sidebar--collapsed .sb-section,
    .sidebar--collapsed .sb-item__label,
    .sidebar--collapsed .sb-item__badge,
    .sidebar--collapsed .sb-item__dot,
    .sidebar--collapsed .sb-chevron,
    .sidebar--collapsed .sb-submenu,
    .sidebar--collapsed .sb-footer__text,
    .sidebar--collapsed .sb-footer__version,
    .sidebar--collapsed .sb-divider { opacity: 0; pointer-events: none; width: 0; overflow: hidden; }
    .sidebar--collapsed .sb-item { justify-content: center; padding: 10px; border-left-color: transparent !important; }
    .sidebar--collapsed .sb-item--active { background: var(--sb-item-active-bg); }
    .sidebar--collapsed .sb-item--active .sb-item__icon { color: var(--color-accent); }
    .sidebar--collapsed .sb-user { justify-content: center; padding: 8px; }
    .sidebar--collapsed .sb-footer { justify-content: center; }

    /* Tooltip on collapsed */
    .sidebar--collapsed .sb-item::after {
      content: attr(title);
      position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%);
      background: #1a2e20; color: #fff;
      font-size: 12px; font-weight: 500;
      padding: 6px 12px; border-radius: var(--r-sm);
      white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity var(--t-base);
      z-index: 999; box-shadow: var(--sh-md);
      border: 1px solid rgba(0,200,83,0.15);
    }
    .sidebar--collapsed .sb-item:hover::after { opacity: 1; }


    /* ── 6. HEADER ─────────────────────────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: var(--z-header);
      height: var(--hdr-h);
      background: var(--hdr-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--hdr-border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; gap: 16px;
      box-shadow: var(--sh-xs);
    }
    .header__start { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .header__end   { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .hdr-toggle { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-sm); color: var(--color-text-2); flex-shrink: 0; transition: background var(--t-fast), color var(--t-fast); }
    .hdr-toggle:hover { background: var(--color-surface-2); color: var(--color-text); }

    /* App stamp */
    .app-stamp { display:flex; align-items:center; gap:10px; padding:6px 12px; border-radius:var(--r-md); background: rgba(27,107,58,0.06); border:1px solid rgba(27,107,58,0.12); width: fit-content; }
    .app-stamp__logo { height:30px; width:auto; object-fit:contain; }
    .app-stamp__text { display:flex; flex-direction:column; line-height:1.2; }
    
    .app-stamp__org { font-size:10px; font-weight:500; color: var(--color-text-3); letter-spacing:0.04em; }
    .app-stamp__app { font-size:13px; font-weight:800; color: var(--color-primary); letter-spacing:-0.02em; }
    .app-stamp__app .plus { color: var(--color-accent); }

    /* Header action buttons */
    .hdr-btn { position: relative; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-sm); color: var(--color-text-2); transition: background var(--t-fast), color var(--t-fast); }
    .hdr-btn:hover { background: var(--color-surface-2); color: var(--color-text); }
    .hdr-badge { position: absolute; top: 5px; right: 5px; width: 17px; height: 17px; background: var(--color-danger); color: #fff; font-size: 9.5px; font-weight: 700; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; line-height: 1; }
    .hdr-badge--green { background: var(--color-primary); }
    .hdr-divider { width: 1px; height: 22px; background: var(--color-border); margin: 0 4px; }

    .hdr-user { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: var(--r-pill); border: 1px solid transparent; transition: background var(--t-fast), border-color var(--t-fast); cursor: pointer; }
    .hdr-user:hover { background: var(--color-surface-2); border-color: var(--color-border); }
    .hdr-user__av { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-mid)); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0; box-shadow: 0 2px 8px rgba(27,107,58,0.22); text-transform: uppercase; }
    .hdr-user__name { font-size: 13.5px; font-weight: 600; color: var(--color-text); text-transform: capitalize; }
    .hdr-user__chevron { color: var(--color-text-3); transition: transform var(--t-base); }
    .hdr-user--open .hdr-user__chevron { transform: rotate(180deg); }


    /* ── 7. DROPDOWN PANELS ────────────────────────────────────── */
    .widget { position: relative; }
    .panel { position: absolute; top: calc(100% + 10px); right: 0; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--r-lg); box-shadow: var(--sh-panel); z-index: var(--z-dropdown); overflow: hidden; width: 320px; opacity: 0; transform: translateY(-8px) scale(0.96); transform-origin: top right; pointer-events: none; transition: opacity var(--t-base), transform var(--t-base); }
    .widget--open .panel { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .panel__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--color-border-sub); }
    .panel__title { font-size: 14px; font-weight: 700; color: var(--color-text); }
    .panel__action { font-size: 12px; font-weight: 600; color: var(--color-primary); padding: 3px 8px; border-radius: var(--r-sm); transition: background var(--t-fast); }
    .panel__action:hover { background: var(--color-primary-light); }
    .panel__list { max-height: 300px; overflow-y: auto; }
    .panel__footer { padding: 10px 18px; border-top: 1px solid var(--color-border-sub); text-align: center; }
    .panel__footer-link { font-size: 13px; font-weight: 600; color: var(--color-primary); transition: color var(--t-fast); }
    .panel__footer-link:hover { color: var(--color-primary-hover); }

    .notif-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 18px; cursor: pointer; transition: background var(--t-fast); position: relative; }
    .notif-item:hover { background: var(--color-surface-2); }
    .notif-item--unread { background: #f3fbf5; }
    .notif-item--unread:hover { background: #e9f7ec; }
    .notif-icon { width: 34px; height: 34px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .notif-icon--success { background: var(--color-success-light); color: var(--color-success); }
    .notif-icon--warning { background: var(--color-warning-light); color: var(--color-warning); }
    .notif-icon--danger  { background: var(--color-danger-light);  color: var(--color-danger); }
    .notif-icon--info    { background: var(--color-info-light);    color: var(--color-info); }
    .notif-icon--green   { background: var(--color-primary-light); color: var(--color-primary); }
    .notif-body { flex: 1; min-width: 0; }
    .notif-text { font-size: 12.5px; color: var(--color-text-2); line-height: 1.5; }
    .notif-text strong { color: var(--color-text); }
    .notif-time { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--color-text-3); margin-top: 3px; display: block; }
    .notif-item--unread .notif-text { font-weight: 500; color: var(--color-text); }
    .notif-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-primary); flex-shrink: 0; margin-top: 5px; }

    .user-panel { width: 256px; }
    .user-panel__profile { display: flex; align-items: center; gap: 12px; padding: 16px 18px; }
    .user-panel__av { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-mid)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #fff; flex-shrink: 0; box-shadow: 0 3px 14px rgba(27,107,58,0.28); }
    .user-panel__name { font-size: 14px; font-weight: 700; color: var(--color-text); line-height: 1.3; }
    .user-panel__email { font-size: 11.5px; color: var(--color-text-3); font-family: 'DM Mono', monospace; }
    .user-panel__badge { display: inline-flex; margin-top: 4px; font-size: 10px; font-weight: 700; background: var(--color-primary-light); color: var(--color-primary); border: 1px solid rgba(27,107,58,0.15); padding: 1px 8px; border-radius: var(--r-pill); }
    .panel__divider { height: 1px; background: var(--color-border-sub); }
    .user-panel__item { display: flex; align-items: center; gap: 12px; padding: 10px 18px; font-size: 13.5px; color: var(--color-text-2); transition: background var(--t-fast), color var(--t-fast); }
    .user-panel__item svg { color: var(--color-text-3); flex-shrink: 0; transition: color var(--t-fast); }
    .user-panel__item:hover { background: var(--color-surface-2); color: var(--color-text); }
    .user-panel__item:hover svg { color: var(--color-primary); }
    .user-panel__item--logout { color: var(--color-danger); }
    .user-panel__item--logout svg { color: var(--color-danger); }
    .user-panel__item--logout:hover { background: var(--color-danger-light); }
    .user-panel__session { padding: 10px 18px; display: flex; align-items: center; gap: 8px; }
    .session-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-secondary); flex-shrink: 0; animation: pulse-dot 2.4s ease-in-out infinite; }
    .session-text { font-size: 11.5px; font-family: 'DM Mono', monospace; color: var(--color-text-3); }


    /* ── 8. MAIN CONTENT ───────────────────────────────────────── */
    .main { flex: 1; padding: 32px 32px calc(32px + 80px); max-width: 1440px; width: 100%; margin: 0 auto; }

    /* Page Header */
    .page-hdr { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .page-hdr__eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-primary); margin-bottom: 4px; }
    .page-hdr__title { font-size: 26px; font-weight: 800; letter-spacing: -0.04em; color: var(--color-text); line-height: 1.2; }
    .page-hdr__desc { font-size: 14px; color: var(--color-text-2); margin-top: 3px; }
    .page-hdr__actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }


    /* ── 9. ALERT MESSAGES ─────────────────────────────────────── */
    .alert-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .alert-message { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-radius: var(--r-md); border: 1px solid; font-size: 13.5px; font-weight: 500; flex: 1; min-width: 220px; animation: slide-up 0.4s var(--ease) both; }
    .alert-message svg { flex-shrink: 0; margin-top: 1px; }
    .alert-message .alert-close { margin-left: auto; padding: 2px; border-radius: var(--r-xs); opacity: 0.5; transition: opacity var(--t-fast); flex-shrink: 0; color: inherit; }
    .alert-message .alert-close:hover { opacity: 1; }
    .alert-message.success { background: var(--color-success-light); color: var(--color-success); border-color: rgba(46,125,50,0.2); }
    .alert-message.error { background: var(--color-danger-light); color: var(--color-danger); border-color: rgba(198,40,40,0.2); }
    .alert-message.warning { background: var(--color-warning-light); color: var(--color-warning); border-color: rgba(230,81,0,0.2); }
    .alert-message.info { background: var(--color-info-light); color: var(--color-info); border-color: rgba(2,119,189,0.2); }


    /* ── 10. KPI CARDS ─────────────────────────────────────────── */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .kpi { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--r-lg); padding: 20px 22px; box-shadow: var(--sh-sm); position: relative; overflow: hidden; transition: transform var(--t-base), box-shadow var(--t-base); animation: slide-up 0.4s var(--ease) both; }
    .kpi:nth-child(1) { animation-delay: 0.05s; }
    .kpi:nth-child(2) { animation-delay: 0.10s; }
    .kpi:nth-child(3) { animation-delay: 0.15s; }
    .kpi:nth-child(4) { animation-delay: 0.20s; }
    .kpi:hover { transform: translateY(-3px); box-shadow: var(--sh-md); }
    .kpi::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: transparent; border-radius: var(--r-lg) var(--r-lg) 0 0; transition: background var(--t-base); }
    .kpi:hover::after { background: linear-gradient(90deg, var(--color-primary), var(--color-secondary)); }
    .kpi--primary { background: linear-gradient(145deg, var(--color-primary) 0%, #145530 100%); border-color: transparent; }
    .kpi--primary::after { display: none; }
    .kpi--primary .kpi__label { color: rgba(255,255,255,0.7); }
    .kpi--primary .kpi__value { color: #fff; }
    .kpi--primary .kpi__icon-wrap { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9); }
    .kpi--primary .kpi__delta { color: rgba(255,255,255,0.85); }
    .kpi--primary .kpi__period { color: rgba(255,255,255,0.5); }
    .kpi__top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .kpi__label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-text-3); }
    .kpi__icon-wrap { width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--color-primary-light); color: var(--color-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .kpi__value { font-size: 30px; font-weight: 800; letter-spacing: -0.05em; color: var(--color-text); line-height: 1.1; margin-bottom: 8px; }
    .kpi__unit { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .kpi__footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .kpi__delta { font-size: 12px; font-weight: 700; font-family: 'DM Mono', monospace; }
    .kpi__delta--up { color: var(--color-success); }
    .kpi__delta--down { color: var(--color-danger); }
    .kpi__delta--flat { color: var(--color-text-3); }
    .kpi__period { font-size: 12px; color: var(--color-text-3); }
    .kpi__prog { display: block; width: 100%; height: 5px; background: rgba(0,0,0,0.08); border-radius: var(--r-pill); overflow: hidden; margin-top: 8px; }
    .kpi__prog-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--color-primary), var(--color-secondary)); border-radius: var(--r-pill); transition: width 1.2s var(--ease); }
    .kpi--primary .kpi__prog { background: rgba(255,255,255,0.2); }


    /* ── 11. LAYOUT GRIDS ──────────────────────────────────────── */
    .content-layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-bottom: 24px; }


    /* ── 12. CARD COMPONENT ────────────────────────────────────── */
    .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--r-lg); box-shadow: var(--sh-sm); overflow: hidden; animation: slide-up 0.4s var(--ease) both; animation-delay: 0.25s; }
    .card__head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--color-border-sub); gap: 12px; flex-wrap: wrap; }
    .card__title { font-size: 14.5px; font-weight: 700; color: var(--color-text); display: flex; align-items: center; gap: 8px; }
    .card__title svg { color: var(--color-primary); }
    .card__subtitle { font-size: 12px; color: var(--color-text-3); }
    .card__body { padding: 20px; }
    .card__body--flush { padding: 0; }
    .card__head-right { display: flex; align-items: center; gap: 8px; }
    .card__link { font-size: 13px; font-weight: 600; color: var(--color-primary); padding: 4px 10px; border-radius: var(--r-sm); transition: background var(--t-fast); }
    .card__link:hover { background: var(--color-primary-light); }
    .card__foot { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--color-border-sub); flex-wrap: wrap; gap: 12px; }
    .card__count { font-size: 12.5px; color: var(--color-text-3); }


    /* ── 13. TABLE ─────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .table th { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-text-3); padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--color-border); background: var(--color-surface-2); white-space: nowrap; }
    .table td { padding: 12px 16px; color: var(--color-text-2); border-bottom: 1px solid var(--color-border-sub); vertical-align: middle; white-space: nowrap; }
    .table tbody tr { transition: background var(--t-fast); }
    .table tbody tr:hover td { background: var(--color-surface-2); }
    .table tbody tr:last-child td { border-bottom: none; }
    .tbl-code { font-family: 'DM Mono', monospace; font-size: 12.5px; font-weight: 500; color: var(--color-primary); }
    .tbl-user { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--color-text); }
    .tbl-av { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-mid)); display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 800; color: #fff; }
    .tbl-av--b { background: linear-gradient(135deg, #0277bd, #26c6da); }
    .tbl-av--c { background: linear-gradient(135deg, #6a1b9a, #ba68c8); }
    .tbl-av--d { background: linear-gradient(135deg, #e65100, #ff8f00); }
    .pill { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: var(--r-pill); }
    .pill--ok      { background: var(--color-success-light); color: var(--color-success); }
    .pill--warn    { background: var(--color-warning-light); color: var(--color-warning); }
    .pill--danger  { background: var(--color-danger-light);  color: var(--color-danger); }
    .pill--info    { background: var(--color-info-light);    color: var(--color-info); }
    .pill--neutral { background: var(--color-surface-2); color: var(--color-text-2); border: 1px solid var(--color-border); }
    .tbl-action { font-size: 12.5px; font-weight: 600; color: var(--color-primary); padding: 4px 12px; border-radius: var(--r-sm); border: 1px solid rgba(27,107,58,0.2); background: var(--color-primary-light); transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast); }
    .tbl-action:hover { background: #c8e6c9; border-color: rgba(27,107,58,0.35); transform: translateY(-1px); }
    .pager { display: flex; align-items: center; gap: 2px; }
    .pg { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-sm); font-size: 12.5px; font-weight: 500; color: var(--color-text-2); transition: background var(--t-fast), color var(--t-fast); }
    .pg:hover:not(:disabled) { background: var(--color-surface-2); color: var(--color-text); }
    .pg:disabled { opacity: 0.4; cursor: not-allowed; }
    .pg--active { background: var(--color-primary); color: #fff; font-weight: 700; }
    .pg--active:hover { background: var(--color-primary-hover); }


    /* ── 14. SIDE CARDS ────────────────────────────────────────── */
    .side-col { display: flex; flex-direction: column; gap: 16px; }
    .donut-wrap { display: flex; justify-content: center; flex-direction: column; align-items: center; gap: 16px; }
    .donut-svg { width: 120px; height: 120px; }
    .donut-val { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 800; fill: var(--color-text); }
    .donut-sub { font-family: 'Outfit', sans-serif; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; fill: var(--color-text-3); }
    .donut-legend { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .dleg { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text-2); }
    .dleg__dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .dleg strong { margin-left: auto; font-weight: 700; font-family: 'DM Mono', monospace; font-size: 12.5px; color: var(--color-text); }
    .q-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .q-action { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 10px; border-radius: var(--r-md); border: 1px solid var(--color-border); background: var(--color-surface-2); font-size: 12px; font-weight: 600; color: var(--color-text-2); text-align: center; cursor: pointer; transition: all var(--t-base); }
    .q-action:hover { background: var(--color-primary-light); border-color: rgba(27,107,58,0.2); color: var(--color-primary); transform: translateY(-2px); box-shadow: var(--sh-sm); }
    .q-action__ico { width: 38px; height: 38px; border-radius: var(--r-sm); background: var(--color-surface); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; color: var(--color-primary); box-shadow: var(--sh-xs); transition: all var(--t-base); }
    .q-action:hover .q-action__ico { background: var(--color-primary); color: #fff; border-color: var(--color-primary); box-shadow: var(--sh-green); }


    /* ── 15. BUTTONS ───────────────────────────────────────────── */
    .btn { display: inline-flex; align-items: center; gap: 7px; font-family: 'Outfit', sans-serif; font-weight: 600; border-radius: var(--r-sm); cursor: pointer; transition: all var(--t-base); white-space: nowrap; border: 1px solid transparent; }
    .btn--sm  { font-size: 13px; padding: 7px 14px; }
    .btn--md  { font-size: 14px; padding: 9px 18px; }
    .btn--lg  { font-size: 15px; padding: 11px 22px; }
    .btn--primary { background: var(--color-primary); color: #fff; box-shadow: var(--sh-green); }
    .btn--primary:hover { background: var(--color-primary-hover); box-shadow: 0 6px 22px rgba(27,107,58,0.35); transform: translateY(-1px); }
    .btn--outline { background: transparent; color: var(--color-text-2); border-color: var(--color-border); }
    .btn--outline:hover { background: var(--color-surface-2); color: var(--color-text); border-color: #c0ceC4; }
    .btn--ghost { background: transparent; color: var(--color-text-2); }
    .btn--ghost:hover { background: var(--color-surface-2); color: var(--color-text); }
    .btn--danger { background: var(--color-danger-light); color: var(--color-danger); border-color: rgba(198,40,40,0.2); }
    .btn--danger:hover { background: var(--color-danger); color: #fff; }
    .btn--danger-strong { background: var(--color-danger); color: #fff; box-shadow: 0 6px 22px rgba(198,40,40,0.25); }
    .btn--danger-strong:hover { background: #a91e1e; transform: translateY(-1px); }
    .btn--icon { width: 34px; height: 34px; padding: 0; justify-content: center; color: var(--color-text-2); }
    .btn--icon:hover { background: var(--color-surface-2); color: var(--color-text); }


    /* ── 16. FORMS ─────────────────────────────────────────────── */
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-3); }
    .form-control, .form-select { height: 38px; border-radius: var(--r-sm); border: 1px solid var(--color-border); background: var(--color-surface); padding: 0 12px; font-family: 'Outfit', sans-serif; font-size: 13.5px; color: var(--color-text); transition: all var(--t-base); }
    .form-control:focus, .form-select:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(27,107,58,0.12); outline: none; }
    .filter-grid { display: grid; grid-template-columns: 2fr 1fr 1.5fr 1.5fr; gap: 12px; align-items: end; }
    .filter-actions { display: flex; gap: 8px; }
    .field-feedback { font-size: 12px; margin-top: 4px; }
    .form-layout { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; }


    /* ── 17. STATUS COMPONENTS ─────────────────────────────────── */
    .badge-status { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: var(--r-pill); }
    .badge-status--danger { background: var(--color-danger-light); color: var(--color-danger); }
    .badge-status--warn { background: var(--color-warning-light); color: var(--color-warning); }
    .badge-status--ok { background: var(--color-success-light); color: var(--color-success); }

    .context-card { border: 1px solid var(--color-border); border-radius: var(--r-lg); background: var(--color-surface); box-shadow: var(--sh-sm); overflow: hidden; }
    .context-card__head { padding: 14px 16px; background: var(--color-danger-light); border-bottom: 1px solid rgba(198,40,40,0.15); font-weight: 700; color: var(--color-danger); display: flex; align-items: center; gap: 8px; }
    .context-card__body { padding: 16px; }
    .info-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .info-table td { padding: 10px 0; border-bottom: 1px solid var(--color-border-sub); }
    .info-table td:first-child { color: var(--color-text-3); font-weight: 600; width: 40%; }
    .info-table td:last-child { font-weight: 600; color: var(--color-text); }
    .info-highlight { background: var(--color-primary-light); padding: 8px 10px; border-radius: var(--r-sm); }
    .impact-alert { display: flex; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--color-warning-light); border: 1px solid rgba(230,81,0,0.2); font-size: 13px; }

    .page-header-box { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .page-header-title { display: flex; flex-direction: column; }
    .page-header-title h4 { font-size: 20px; font-weight: 800; color: var(--color-text); }
    .page-header-title small { color: var(--color-text-3); }
    .page-header-critical { display: flex; flex-direction: column; gap: 4px; }
    .page-header-critical h1 { font-size: 20px; font-weight: 800; color: var(--color-danger); }


    /* ── 18. SCHOOL CONTEXT HEADER ─────────────────────────────── */
    .school-context-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-primary);
      border-radius: var(--r-lg);
      box-shadow: var(--sh-sm);
      padding: 16px 20px;
      margin: 0 0 24px 0;
      animation: slide-up 0.4s var(--ease) both;
      animation-delay: 0.1s;
    }
    .school-context__brand { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
    .school-context__icon { width: 44px; height: 44px; border-radius: var(--r-md); background: linear-gradient(135deg, var(--color-primary-light) 0%, rgba(27,107,58,0.08) 100%); border: 1px solid rgba(27,107,58,0.15); display: flex; align-items: center; justify-content: center; color: var(--color-primary); flex-shrink: 0; box-shadow: 0 2px 8px rgba(27,107,58,0.12); }
    .school-context__info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .school-context__label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-3); }
    .school-context__name { font-size: 18px; font-weight: 700; color: var(--color-text); letter-spacing: -0.02em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .school-context__badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--color-success); background: var(--color-success-light); border: 1px solid rgba(46,125,50,0.15); padding: 6px 12px; border-radius: var(--r-pill); flex-shrink: 0; }
    .context-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-success); animation: pulse-dot 2.4s ease-in-out infinite; }


    /* ── 19. MESSAGES OVERLAY ──────────────────────────────────── */
    .messages-overlay { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
    .messages-container { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
    .messages-container .alert { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-radius: var(--r-md); font-size: 14px; font-weight: 500; font-family: 'Outfit', sans-serif; box-shadow: var(--sh-lg); border: 1px solid transparent; min-width: 280px; max-width: 480px; animation: slide-down 0.3s var(--ease-spring) both; }
    .messages-container .alert-text { flex: 1; line-height: 1.5; }
    .messages-container .alert-close { flex-shrink: 0; font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: var(--r-xs); opacity: 0.5; transition: opacity var(--t-fast); cursor: pointer; background: none; border: none; color: inherit; }
    .messages-container .alert-close:hover { opacity: 1; }
    .alert-success { background: var(--color-success-light); color: var(--color-success); border-color: rgba(46,125,50,0.2); }
    .alert-error, .alert-danger { background: var(--color-danger-light); color: var(--color-danger); border-color: rgba(198,40,40,0.2); }
    .alert-warning { background: var(--color-warning-light); color: var(--color-warning); border-color: rgba(230,81,0,0.2); }
    .alert-info { background: var(--color-info-light); color: var(--color-info); border-color: rgba(2,119,189,0.2); }


    /* ── 20. FOOTER ────────────────────────────────────────────── */
    .main-footer { margin-top: auto; background: var(--color-surface); border-top: 1px solid var(--color-border); padding: 24px 32px; box-shadow: 0 -4px 20px rgba(0,0,0,0.03); }
    .footer-container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; max-width: 1440px; margin: 0 auto; }
