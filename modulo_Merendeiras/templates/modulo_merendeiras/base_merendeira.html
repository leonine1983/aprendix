{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGAME | Controle de Merenda</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

/* =========================================================
   🎨 1. DESIGN SYSTEM (TOKENS INSTITUCIONAIS)
========================================================= */
:root{
    --primary:#1f6f5c;
    --primary-dark:#174f42;
    --primary-light:#e8f3f1;

    --accent:#2c7be5;
    --danger:#d64545;
    --warning:#d9a441;

    --bg:#f5f7f9;
    --card:#ffffff;
    --border:#e4e9ee;

    --text:#1e2a2a;
    --muted:#6b7b7a;

    --radius:12px;
    --shadow:0 4px 14px rgba(0,0,0,0.05);
}

/* =========================================================
   🧱 2. LAYOUT BASE
========================================================= */
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Inter',system-ui;
    background:var(--bg);
    color:var(--text);
    display:flex;
}

/* =========================================================
   📌 3. SIDEBAR
========================================================= */
.sidebar{
    width:260px;
    height:100vh;
    background:linear-gradient(180deg,var(--primary-dark),var(--primary));
    color:#fff;
    padding:24px 18px;
    position:fixed;
}

.logo{
    font-weight:700;
    font-size:1.2rem;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:32px;
}

.nav{ list-style:none; }

.nav a{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-radius:8px;
    text-decoration:none;
    color:rgba(255,255,255,0.85);
    margin-bottom:6px;
    font-size:0.9rem;
    transition:.2s;
}

.nav a:hover{ background:rgba(255,255,255,0.15); }

.nav a.active{
    background:#fff;
    color:var(--primary-dark);
    font-weight:600;
}

/* SUBMENU */
.nav-group{}
.nav-toggle{ /* botão grupo */ }
.nav-sub{ display:none; }
.nav-group.active .nav-sub{ display:block; }

/* =========================================================
   🧭 4. HEADER
========================================================= */
.main{
    margin-left:260px;
    width:100%;
}

.header{
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* =========================================================
   📄 5. CONTENT AREA
========================================================= */
.content{
    padding:30px;
}

/* =========================================================
   🧩 6. COMPONENTES
========================================================= */

/* CARDS */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:var(--card);
    padding:20px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--border);
}

/* TABELA */
.table-box{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
}

/* BADGES */
.badge{
    padding:6px 10px;
    border-radius:20px;
    font-size:0.75rem;
}

/* =========================================================
   👤 7. USER MENU (DROPDOWN)
========================================================= */
.user-menu{ position:relative; }
.dropdown-menu{ display:none; }
.user-menu.active .dropdown-menu{ display:block; }

/* =========================================================
   📱 8. RESPONSIVO
========================================================= */
.menu-toggle{ display:none; }


/* =========================================================
   SIDEBAR PREMIUM UX
========================================================= */
/* =========================
   SIDEBAR BASE
========================= */

.sidebar{
    width:260px;
    height:100vh;
    position:fixed;
    background:linear-gradient(180deg,var(--primary-dark),#0f3f35);
    color:#fff;
    display:flex;
    flex-direction:column;
    transition:.3s;
}

/* COLAPSADO */
.sidebar.collapsed{
    width:80px;
}

/* HEADER */
.sidebar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px;
}

/* LOGO */
.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-text{
    transition:.3s;
}

.sidebar.collapsed .logo-text{
    opacity:0;
    width:0;
    overflow:hidden;
}

/* BOTÃO */
.collapse-btn{
    background:none;
    border:none;
    color:#fff;
    cursor:pointer;
}

/* NAV */
.nav{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:10px;
}

/* ITEM */
.nav-item, .nav-toggle{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px;
    border-radius:10px;
    color:rgba(255,255,255,0.85);
    text-decoration:none;
    transition:.25s;
    position:relative;
}

/* ÍCONE */
.icon svg{
    width:22px;
    height:22px;
    fill:currentColor;
}

/* LABEL */
.label{
    transition:.3s;
}

.sidebar.collapsed .label{
    opacity:0;
    width:0;
    overflow:hidden;
}

/* HOVER */
.nav-item:hover, .nav-toggle:hover{
    background:rgba(255,255,255,0.12);
}

/* ACTIVE */
.nav-item.active{
    background:#fff;
    color:var(--primary-dark);
}

/* SUBMENU */
.nav-sub{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
}

.nav-group.active .nav-sub{
    max-height:200px;
}

/* TOOLTIP */
.sidebar.collapsed .nav-item::after,
.sidebar.collapsed .nav-toggle::after{
    content:attr(data-tooltip);
    position:absolute;
    left:90px;
    background:#000;
    color:#fff;
    padding:6px 10px;
    border-radius:6px;
    font-size:0.75rem;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

.sidebar.collapsed .nav-item:hover::after,
.sidebar.collapsed .nav-toggle:hover::after{
    opacity:1;
}
</style>
</head>

<body>
    <!-- =====================================================
        📌 SIDEBAR
    ===================================================== -->
    <aside class="sidebar" id="sidebar">

        <!-- HEADER -->
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">🏫</span>
                <span class="logo-text">SIGAME</span>
            </div>

            <button class="collapse-btn" id="collapseBtn">⇤</button>
        </div>

        <!-- NAV -->
        <nav class="nav">

            <!-- ITEM -->
            <a href="#" class="nav-item active" data-tooltip="Painel">
                <span class="icon">
                    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-10h8V3h-8v8z"/></svg>
                </span>
                <span class="label">Painel</span>
            </a>

            <!-- GRUPO -->
            <div class="nav-group">

                <button class="nav-toggle" data-tooltip="Estoque">
                    <div class="nav-left">
                        <span class="icon">
                            <svg viewBox="0 0 24 24"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5z"/></svg>
                        </span>
                        <span class="label">Estoque</span>
                    </div>
                    <span class="chevron">▾</span>
                </button>

                <div class="nav-sub">

                    <a href="{% url 'modulo_merendeiras:estoque_list_escola' %}" class="nav-sub-item">
                        📦 Visão Geral
                    </a>

                    <a href="{% url 'modulo_merendeiras:lista_descartes_escola' %}" class="nav-sub-item">
                        🗑️ Descartes
                    </a>

                </div>
            </div>

            <!-- ITEM -->
            <a href="{% url 'modulo_merendeiras:transferencias_recebidas' %}" class="nav-item" data-tooltip="Transferências">
                <span class="icon">
                    <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M7 23l-4-4 4-4"/></svg>
                </span>
                <span class="label">Transferências</span>
            </a>

        </nav>

    </aside>

    <!-- =====================================================
     📄 MAIN LAYOUT
    ===================================================== -->
    <div class="main">

        <!-- =================================================
            🧭 HEADER
        ================================================= -->
        <header class="header">

            <div class="header-left">
                <button class="menu-toggle">☰</button>

                <img height="50" src='{% static "prefeitura.png" %}'>

                <div>
                    <div class="header-title">Controle de Estoque</div>
                    <div class="header-subtitle">{{escola_usuario}}</div>
                </div>
            </div>

            <!-- USER MENU -->
            <div class="user-menu">
                <button class="user-trigger">
                    <img src="{% static 'img/user-default.png' %}" class="avatar">
                    <span class="chevron">▾</span>
                </button>

                <div class="dropdown-menu">

                    <div class="dropdown-header">
                        <strong>{{usuario_nome}}</strong>
                        <small>{{grupo_principal}}</small>
                    </div>

                    <a href="#" class="dropdown-item">👤 Perfil</a>
                    <a href="#" class="dropdown-item">⚙️ Conta</a>

                    <div class="dropdown-divider"></div>

                    <form method="post" action="{% url 'admin_acessos:logout' %}">
                        {% csrf_token %}
                        <button type="submit">Sair</button>
                    </form>

                </div>
            </div>

        </header>

        <!-- =================================================
            📦 CONTENT
        ================================================= -->
        <main class="content">
            {% block content %}{% endblock %}
        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const menu = document.querySelector(".user-menu");
    const trigger = document.querySelector(".user-trigger");

    trigger.addEventListener("click", function (e) {
        e.stopPropagation();
        menu.classList.toggle("active");
    });

    document.addEventListener("click", function () {
        menu.classList.remove("active");
    });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const sidebar = document.getElementById("sidebar");
    const collapseBtn = document.getElementById("collapseBtn");

    /* =========================
       ESTADO PERSISTENTE
    ========================= */
    if(localStorage.getItem("sidebar-collapsed") === "true"){
        sidebar.classList.add("collapsed");
    }

    collapseBtn.addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");

        localStorage.setItem(
            "sidebar-collapsed",
            sidebar.classList.contains("collapsed")
        );
    });

    /* =========================
       SUBMENU
    ========================= */
    document.querySelectorAll(".nav-toggle").forEach(toggle => {

        toggle.addEventListener("click", () => {
            const group = toggle.parentElement;

            document.querySelectorAll(".nav-group").forEach(g => {
                if(g !== group) g.classList.remove("active");
            });

            group.classList.toggle("active");
        });

    });

    /* =========================
       ATIVO POR URL
    ========================= */
    document.querySelectorAll(".nav-item, .nav-sub-item").forEach(link => {

        if(link.href === window.location.href){
            link.classList.add("active");

            const group = link.closest(".nav-group");
            if(group) group.classList.add("active");
        }

    });

});
</script>

</html>
