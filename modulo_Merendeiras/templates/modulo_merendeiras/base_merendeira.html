{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGAME | Controle de Merenda</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ========================
   🎨 DESIGN SYSTEM REFINADO
======================== */

:root{
    --primary:#1f6f5c;
    --primary-dark:#174f42;
    --primary-light:#e8f3f1;

    --accent:#2c7be5;
    --danger:#d64545;
    --warning:#d9a441;

    --bg:#f5f7f9;
    --card:#ffffff;
    --border:#e4e9ee;

    --text:#1e2a2a;
    --muted:#6b7b7a;

    --radius:12px;
    --shadow:0 4px 14px rgba(0,0,0,0.05);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Inter',system-ui;
    background:var(--bg);
    color:var(--text);
    display:flex;
}

/* ========================
   SIDEBAR INSTITUCIONAL
======================== */

.sidebar{
    width:260px;
    height:100vh;
    background:linear-gradient(180deg,var(--primary-dark),var(--primary));
    color:#fff;
    padding:24px 18px;
    position:fixed;
}

.logo{
    font-weight:700;
    font-size:1.2rem;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:32px;
}

.nav{
    list-style:none;
}

.nav a{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-radius:8px;
    text-decoration:none;
    color:rgba(255,255,255,0.85);
    margin-bottom:6px;
    font-size:0.9rem;
    transition:all .2s ease;
}

.nav a:hover{
    background:rgba(255,255,255,0.15);
}

.nav a.active{
    background:#fff;
    color:var(--primary-dark);
    font-weight:600;
}

/* ========================
   MAIN
======================== */

.main{
    margin-left:260px;
    width:100%;
}

/* HEADER */

.header{
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    font-size:1.2rem;
}

.header-subtitle{
    color:var(--muted);
    font-size:0.85rem;
    margin-top:4px;
}

.user-box{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
}

.btn-logout{
    font-size:0.8rem;
    text-decoration:none;
    color:var(--danger);
    border:1px solid var(--danger);
    padding:6px 12px;
    border-radius:6px;
    transition:.2s;
}

.btn-logout:hover{
    background:var(--danger);
    color:#fff;
}

/* CONTENT */

.content{
    padding:30px;
}

/* ALERT */

.alert{
    background:#fff;
    border-left:5px solid var(--danger);
    padding:16px 18px;
    border-radius:var(--radius);
    margin-bottom:25px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:var(--shadow);
    font-size:0.9rem;
}

/* ========================
   CARDS MAIS INTELIGENTES
======================== */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:var(--card);
    padding:20px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
}

.card-header{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.8rem;
    color:var(--muted);
    margin-bottom:8px;
}

.card h2{
    font-size:1.6rem;
    font-weight:700;
}

/* ========================
   TABELA PROFISSIONAL
======================== */

.table-box{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
}

.table-header{
    padding:18px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.search{
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    outline:none;
    width:220px;
}

.search:focus{
    border-color:var(--primary);
}

/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f8fafb;
    padding:12px;
    font-size:0.75rem;
    text-transform:uppercase;
    color:var(--muted);
}

td{
    padding:14px;
    border-top:1px solid var(--border);
    font-size:0.9rem;
}

tr:hover{
    background:#f9fbfb;
}

/* STATUS */

.badge{
    padding:6px 10px;
    border-radius:20px;
    font-size:0.75rem;
    font-weight:600;
}

.ok{background:#e6f4ef;color:var(--primary);}
.warn{background:#fff4e0;color:var(--warning);}
.crit{background:#fdeaea;color:var(--danger);}

/* BUTTON */

.btn{
    padding:8px 14px;
    border-radius:6px;
    border:1px solid var(--primary);
    background:#fff;
    color:var(--primary);
    cursor:pointer;
    font-size:0.85rem;
    transition:.2s;
}

.btn:hover{
    background:var(--primary);
    color:#fff;
}

/* ========================
   RESPONSIVO
======================== */

.table-box{
    overflow-x:auto;
}


/* ========================
   USER DROPDOWN (ALTO NÍVEL)
======================== */

.user-menu{
    position:relative;
}

.user-trigger{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:6px 10px;
    cursor:pointer;
    transition:.2s;
}

.user-trigger:hover{
    box-shadow:var(--shadow);
}

.avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--primary-light);
}

.user-info{
    display:flex;
    flex-direction:column;
    text-align:left;
    line-height:1.1;
}

.user-info strong{
    font-size:0.85rem;
}

.user-info small{
    font-size:0.75rem;
    color:var(--muted);
}

.chevron{
    font-size:0.7rem;
    color:var(--muted);
}

/* DROPDOWN */

.dropdown-menu{
    position:absolute;
    right:0;
    top:110%;
    width:220px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:8px;
    display:none;
    z-index:100;
}

.user-menu.active .dropdown-menu{
    display:block;
}

/* HEADER DO MENU */

.dropdown-header{
    padding:10px;
    border-bottom:1px solid var(--border);
    margin-bottom:6px;
}

.dropdown-header small{
    display:block;
    color:var(--muted);
    font-size:0.75rem;
}

/* ITENS */

.dropdown-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    border-radius:6px;
    text-decoration:none;
    color:var(--text);
    font-size:0.85rem;
    transition:.2s;
}

.dropdown-item:hover{
    background:#f5f7f9;
}

.dropdown-item.danger{
    color:var(--danger);
}

.dropdown-item.danger:hover{
    background:#fdeaea;
}

/* DIVIDER */

.dropdown-divider{
    height:1px;
    background:var(--border);
    margin:6px 0;
}




/* SIDEBR*/
/* BOTÃO MENU */

.menu-toggle{
    display:none;
    font-size:1.2rem;
    background:none;
    border:none;
    cursor:pointer;
    margin-right:8px;
}

/* OVERLAY */

.sidebar-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    opacity:0;
    visibility:hidden;
    transition:.2s;
    z-index:90;
}

/* ========================
   MOBILE SIDEBAR
======================== */

@media (max-width: 768px){

    .menu-toggle{
        display:block;
    }

    .sidebar{
        position:fixed;
        left:-260px;
        top:0;
        height:100vh;
        width:260px;
        z-index:100;
        transition:.3s ease;
    }

    .sidebar.active{
        left:0;
    }

    .sidebar-overlay.active{
        opacity:1;
        visibility:visible;
    }

    /* MAIN não empurra mais */
    .main{
        margin-left:0;
    }
}

</style>
</head>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main">

                👤 Meu Perfil

                ⚙️ Minha Conta
            </a>

                {% csrf_token %}
                <button type="submit" style="background:none;border:none;color:inherit;cursor:pointer;">
                    Sair
                </button>
            </form>
        </div>

    </div>

</header>

<main class="content">
    {% block content %}{% endblock content %}
</main>
</div>

</body>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const menu = document.querySelector(".user-menu");
    const trigger = document.querySelector(".user-trigger");

    trigger.addEventListener("click", function (e) {
        e.stopPropagation();
        menu.classList.toggle("active");
    });

    document.addEventListener("click", function () {
        menu.classList.remove("active");
    });
});
</script>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    const toggle = document.querySelector(".menu-toggle");

    toggle.addEventListener("click", function () {
        sidebar.classList.toggle("active");
        overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", function () {
        sidebar.classList.remove("active");
        overlay.classList.remove("active");
    });

});
</script>
</html>
