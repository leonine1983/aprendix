<h1>📦 Estoque da Escola</h1>

<table>
<thead>
<tr>
    <th>Produto</th>
    <th>Lote</th>
    <th>Quantidade</th>
</tr>
</thead>

<tbody>
{% for item in estoques %}
<tr>
    <td>{{ item.produto.nome }}</td>
    <td>{{ item.lote }}</td>
    <td>{{ item.quantidade }}</td>
</tr>
{% endfor %}
</tbody>
</table>
