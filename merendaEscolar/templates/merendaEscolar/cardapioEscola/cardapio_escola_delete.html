{% extends "merendaEscolar/estoque_base.html" %}
{% block content %}

<h2>⚠️ Confirmar exclusão</h2>

<p>
Deseja remover o vínculo entre:
</p>

<ul>
    <li><strong>Cardápio:</strong> {{ object.cardapio }}</li>
    <li><strong>Escola:</strong> {{ object.escola }}</li>
</ul>

<form method="post">
    {% csrf_token %}
    
    <button class="btn btn-danger">Sim, excluir</button>
    <a href="{% url 'merendaEscolar:cardapio_escola_list' %}">
        Cancelar
    </a>
</form>

{% endblock %}
