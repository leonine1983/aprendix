{% extends "estoque_base.html" %}

{% block content %}
<h2>Entrada de Produto no Estoque Central</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Registrar Entrada</button>
</form>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

{% endblock %}
