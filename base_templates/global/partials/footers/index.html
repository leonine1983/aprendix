<style>
<!-- ════ ESTILOS ════ -->
.sf2,.sf2 *,.sf2 *:before,.sf2 *:after{box-sizing:border-box;margin:0;padding:0}

.sf2{
--blue:#60a5fa;--blue-mid:#3b82f6;--blue-light:rgba(59,130,246,.15);--blue-glow:rgba(96,165,250,.18);
--text:#f8fafc;--text-sec:#e2e8f0;--muted:#cbd5e1;
--bg:#0f172a;--bg-alt:#0b1220;--surface:#1e293b;--border:#334155;
--tr:.25s ease;
position:relative;overflow:hidden;
font-family:'Nunito','Segoe UI',sans-serif;
background:linear-gradient(135deg,#0f172a 0%,#16213e 50%,#0f172a 100%);
border-top:3px solid var(--blue-mid)
}

.sf2:before{
content:"";position:absolute;inset:0;pointer-events:none;
background:
radial-gradient(circle at top right,rgba(59,130,246,.12),transparent 35%),
radial-gradient(circle at bottom left,rgba(99,102,241,.10),transparent 40%)
}

.sf2-accent{display:flex;height:3px}
.sf2-accent span{flex:1}
.sf2-accent span:nth-child(1){background:linear-gradient(90deg,#2563eb,#3b82f6)}
.sf2-accent span:nth-child(2){background:linear-gradient(90deg,#3b82f6,#6366f1)}
.sf2-accent span:nth-child(3){background:linear-gradient(90deg,#6366f1,#8b5cf6)}

#sf2-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

.sf2-main{
position:relative;z-index:1;
max-width:1280px;margin:auto;
padding:22px 40px;
display:grid;
grid-template-columns:auto 1px 1fr;
gap:0 28px;
align-items:center
}

.sf2-vdiv{
width:1px;height:60px;
background:linear-gradient(180deg,transparent,var(--border),transparent)
}

.sf2-logos{display:flex;align-items:center;gap:14px}

.sf2-logo-item{
display:flex;
align-items:center;
gap:10px;
padding:8px 12px;
border-radius:14px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(8px);
transition:var(--tr)
}

.sf2-logo-item:hover{
background:rgba(255,255,255,.08);
border-color:rgba(96,165,250,.35);
transform:translateY(-2px)
}

.sf2-logo-box{
width:68px;height:68px;
border-radius:12px;
background:#fff;
border:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
transition:var(--tr)
}

.sf2-logo-box:hover{
border-color:var(--blue);
transform:translateY(-2px)
}

.sf2-logo-box img{
width:60px;
height:60px;
object-fit:contain
}

.sf2-logo-txt strong{
display:block;
color:var(--text);
font-size:.78rem;
font-weight:800
}

.sf2-logo-txt span{
color:var(--muted);
font-size:.65rem
}

.sf2-conn{
display:flex;
flex-direction:column;
align-items:center;
gap:4px
}

.sf2-conn-line{
width:1px;
height:12px;
background:var(--border)
}

.sf2-conn-dot{
width:6px;
height:6px;
border-radius:50%;
background:var(--blue)
}

.sf2-nav{
display:flex;
flex-wrap:wrap;
gap:8px
}

.sf2-nav a{
display:flex;
align-items:center;
gap:6px;
padding:7px 12px;
border-radius:8px;
text-decoration:none;
color:var(--muted);
font-size:.75rem;
font-weight:700;
transition:var(--tr)
}

.sf2-nav a i{
color:var(--blue);
font-size:.7rem
}

.sf2-nav a:hover{
background:var(--surface);
color:var(--blue)
}

.sf2-bottom{
position:relative;
z-index:1;
background:var(--bg-alt);
border-top:1px solid var(--border)
}

.sf2-bottom-inner{
max-width:1280px;
margin:auto;
padding:12px 40px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
flex-wrap:wrap
}

.sf2-copy{
display:flex;
align-items:center;
gap:6px;
font-size:.75rem;
color:var(--muted)
}

.sf2-copy i{color:var(--blue)}
.sf2-copy strong{color:var(--text-sec)}

.sf2-bottom-right{
display:flex;
align-items:center;
gap:10px
}

.sf2-bottom-right span{
color:var(--muted);
font-size:.75rem
}

.sf2-bottom-right strong{color:var(--text)}
.sf2-bottom-right i{color:var(--blue)}
.sf2-dot{color:#475569}

.sf2-badges{
display:flex;
gap:6px
}

.sf2-badge{
display:flex;
align-items:center;
gap:5px;
padding:4px 10px;
border-radius:999px;
background:var(--blue-light);
border:1px solid rgba(96,165,250,.25);
color:#93c5fd;
font-size:.68rem;
font-weight:700
}

.sf2-badge i{font-size:.65rem}

.sf2-dev{
display:flex;
align-items:center;
gap:10px
}

.sf2-dev-name{
display:flex;
align-items:center;
gap:6px;
color:var(--muted);
font-size:.75rem
}

.sf2-dev-name strong{color:var(--text)}

.sf2-dev-social{
display:flex;
align-items:center;
gap:5px
}

.sf2-dev-social a{
width:26px;
height:26px;
display:flex;
align-items:center;
justify-content:center;
border-radius:6px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
color:#cbd5e1;
text-decoration:none;
transition:var(--tr)
}

.sf2-dev-social a:hover{
color:var(--blue);
border-color:var(--blue);
transform:translateY(-2px)
}

.sf2-fadein{
opacity:0;
transform:translateY(16px);
transition:opacity .45s ease,transform .45s ease
}

.sf2-fadein.sf2-vis{
opacity:1;
transform:translateY(0)
}

@media (max-width:1100px){
.sf2-main{grid-template-columns:1fr;gap:20px}
.sf2-vdiv{display:none}
}

@media (max-width:768px){
.sf2-main{padding:20px}
.sf2-bottom-inner{
padding:12px 20px;
flex-direction:column;
align-items:flex-start
}
.sf2-logos{flex-wrap:wrap}
}
</style>

<!-- ════ SCRIPTS ════ -->
<script>
(function(){
  // Ano
  document.getElementById('sf2-ano').textContent = new Date().getFullYear();

  // Partículas
  const canvas = document.getElementById('sf2-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, pts = [];

  function resize(){
    W = canvas.width  = canvas.offsetWidth;
    H = canvas.height = canvas.offsetHeight;
  }
  function init(){
    pts = [];
    const n = Math.floor(W / 24);
    for(let i=0;i<n;i++) pts.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*2+.4,
      dx:(Math.random()-.5)*.18,
      dy:-Math.random()*.22-.07,
      a: Math.random()*.14+.03
    });
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(37,99,235,${p.a})`;
      ctx.fill();
      p.x+=p.dx; p.y+=p.dy;
      if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}
      if(p.x<-5) p.x=W+5;
      if(p.x>W+5) p.x=-5;
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',()=>{resize();init();});
  resize(); init(); draw();

  // Fade-in via IntersectionObserver
  const io = new IntersectionObserver((entries)=>{
    entries.forEach((e,i)=>{
      if(e.isIntersecting){
        setTimeout(()=>e.target.classList.add('sf2-vis'), i*90);
        io.unobserve(e.target);
      }
    });
  },{threshold:.1});
  document.querySelectorAll('.sf2-fadein').forEach(el=>io.observe(el));
})();
</script>
